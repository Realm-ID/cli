name: release

# Cut a release by pushing a semver tag, e.g.:
#   git tag v0.2.1 && git push origin v0.2.1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release + upload archives/checksums
  # packages: write # uncomment when the ghcr Docker target is enabled

jobs:
  # This tag has its own CHANGELOG.md entry. Every other repo in the workspace
  # gates this at deploy/promote time; the CLI has no separate promote step —
  # `goreleaser` runs directly off the tag push — so the gate is a job of its
  # own that `goreleaser` depends on, ahead of anything getting released.
  changelog:
    name: This tag has its own CHANGELOG.md entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/changelog-hygiene.sh tag "$GITHUB_REF_NAME"

  goreleaser:
    needs: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # GoReleaser needs full history + tags for the changelog

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}  # uncomment with the brews: block
