name: release

# Cut a release by pushing a semver tag, e.g.:
#   git tag v0.2.1 && git push origin v0.2.1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release + upload archives/checksums
  # packages: write # uncomment when the ghcr Docker target is enabled

defaults:
  run:
    # GitHub's implicit default omits pipefail
    shell: bash

concurrency:
  # NOT cancel-in-progress: a cancelled run of this workflow can leave
  # half-applied state behind. Queue instead.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # This tag has its own CHANGELOG.md entry. Every other repo in the workspace
  # gates this at deploy/promote time; the CLI has no separate promote step —
  # `goreleaser` runs directly off the tag push — so the gate is a job of its
  # own that `goreleaser` depends on, ahead of anything getting released.
  changelog:
    name: This tag has its own CHANGELOG.md entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/changelog-hygiene.sh tag "$GITHUB_REF_NAME"

  # The suite, run against the TAGGED tree, as a hard dependency of the
  # release. `tests.yml` is the same workflow that gates pushes to main; it is
  # invoked here rather than duplicated so the release can never be gated by a
  # weaker check than a routine commit is.
  #
  # This is what closes the `paths-ignore` hole for this repo. The issuer hit
  # it twice — it tags a docs-only CHANGELOG commit, so the tagged SHA got no
  # run and the promote step had to guess a verdict, which promoted a red tree
  # (`v0.106.0`) and an unverified one (`v0.117.0`). The CLI has no promote
  # step to teach, so the gate is a dependency instead.
  test:
    uses: ./.github/workflows/tests.yml

  goreleaser:
    needs: [changelog, test]
    runs-on: ubuntu-latest
    # Runaway guard, not an SLA (GitHub's default is 360m).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # GoReleaser needs full history + tags for the changelog

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.23'
          cache: true

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}  # uncomment with the brews: block
