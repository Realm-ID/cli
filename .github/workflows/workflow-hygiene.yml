name: Workflow hygiene

# Two checks over this repo's OWN workflow files. Neither existed here before:
# `actionlint` ran only in the umbrella repo, which does not contain these files,
# so nothing linted them — and this repo has shipped workflows that failed at
# startup, which is the failure a linter catches for free.
#
#   1. actionlint  — workflow syntax + expression checking, and shellcheck over
#                    every `run:` body.
#   2. pinned      — third-party actions must be pinned to a full commit SHA.
#                    A moved tag on an action used by a deploy workflow is a
#                    supply-chain event with production blast radius.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR pushes supersede each other; nothing here is mid-flight state.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # GitHub's implicit default omits pipefail
    shell: bash

jobs:
  lint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Lint rules change only with a commit: actionlint is pinned by `version:` below, and
      # shellcheck here. The action runs whatever `shellcheck` is on PATH (the runner image's,
      # which moves with every image update), so a checksummed release goes first on PATH.
      - name: install pinned shellcheck
        shell: bash
        env:
          SC_VERSION: v0.11.0
          SC_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sc.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-${SC_VERSION}/shellcheck" --version | grep -qx "version: ${SC_VERSION#v}"
          echo "$RUNNER_TEMP/shellcheck-${SC_VERSION}" >> "$GITHUB_PATH"

      # actionlint is installed from its release tarball and verified against a SHA-256, then run
      # through the same make target the laptop gate runs (scripts/workflow_preflight.py lint,
      # which also runs the shellcheck-is-live canary and the SHA-pin check). No install-and-run
      # action: it cannot be proven to be the version the laptop runs.
      - name: Install pinned actionlint
        shell: bash
        env:
          AL_VERSION: 1.7.12
          AL_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfLo "$RUNNER_TEMP/al.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          echo "${AL_SHA256}  $RUNNER_TEMP/al.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/al.tgz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - run: make workflow-lint

  pinned:
    name: third-party actions are SHA-pinned
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Parity (every CI job maps to a step the laptop gate runs) compares the pinned Go
      # toolchain with `go env GOVERSION`, so it runs here with the same Go the config pins.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.2'
      - run: make workflow-parity
      - name: Reject mutable action refs
        run: |
          # Matches `uses: owner/repo@ref` where ref is not a 40-char hex SHA.
          # Local (`./…`) refs are excluded by `[^./]`.
          #
          # FIRST-PARTY REUSABLE WORKFLOWS ARE EXCLUDED ON PURPOSE.
          # `Just-Git-Dev/reusable-workflows/...@vX.Y.Z` must stay a RELEASE TAG:
          # semver there tracks the workflow's INPUT CONTRACT, which is what a
          # consumer needs to reason about, and the platform's own rule is that
          # consumers pin an exact `vX.Y.Z` — never a SHA, never `@main`. A SHA
          # would pin the bytes and discard the contract. The supply-chain risk
          # this job exists to stop is a MOVED THIRD-PARTY TAG; a first-party
          # repo under the same ownership is not that risk.
          if grep -rnP '^\s*(-\s*)?uses:\s*[^./][^@]+@(?![0-9a-f]{40}\s*($|#))' \
               --include='*.yml' --include='*.yaml' .github/workflows \
             | grep -v 'Just-Git-Dev/reusable-workflows/'; then
            echo "::error::Third-party actions must be pinned to a full commit SHA."
            exit 1
          fi
          echo "All third-party action references are SHA-pinned."

      # A gate that greps must be shown to fire, or a narrowed pattern is
      # indistinguishable from a clean tree. This plants a violation, requires
      # the grep to catch it, and cleans up.
      - name: Self-test — the pin check actually fires
        run: |
          tmp=".github/workflows/zz-selftest.yml"
          scan() {
            grep -rP '^\s*(-\s*)?uses:\s*[^./][^@]+@(?![0-9a-f]{40}\s*($|#))' \
              --include='*.yml' "$1" | grep -v 'Just-Git-Dev/reusable-workflows/'
          }

          # MUST FIRE: a third-party action on a mutable tag.
          printf 'on: push\njobs:\n  x:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n' > "$tmp"
          if ! scan "$tmp" >/dev/null; then
            rm -f "$tmp"
            echo "::error::self-test FAILED — the check did not fire on actions/checkout@v4."
            exit 1
          fi

          # MUST STAY SILENT: a first-party reusable workflow on a release tag.
          # Without this half, tightening the exclusion into a catch-all would
          # pass unnoticed, and the gate would stop checking anything.
          printf 'on: push\njobs:\n  x:\n    uses: Just-Git-Dev/reusable-workflows/.github/workflows/ci-go.yml@v2.6.0\n' > "$tmp"
          if scan "$tmp" >/dev/null; then
            rm -f "$tmp"
            echo "::error::self-test FAILED — the check fired on a first-party reusable workflow pinned to a release tag."
            exit 1
          fi

          rm -f "$tmp"
          echo "self-test: fires on a mutable third-party ref, silent on a first-party release tag."
