openapi: 3.0.3
info:
  title: RealmID Auth Service
  description: |
    Multi-tenant identity + auth service. Dogfood-launch (v1) surface.

    Source of truth is `api/internal/httpapi/routes.go`; this spec
    mirrors it. Schema source of truth is
    `api/internal/migrations/migrations.go` (ADR-030).

    Response-status convention (ADR-069): a **uniform `200` `{data:...}`
    envelope**. Every endpoint returns `200` on success — including all
    DELETEs, which carry a `{status:...}` body — EXCEPT genuine
    resource-creation POSTs, which return `201 Created` (enumerated below:
    `POST /platforms`, `/identity-providers`, `/sources` (ADR-072),
    `/platforms/{id}/{api-keys,roles,origins,federation-bindings}`,
    `/platforms/{pid}/tenants`, `/tenants/{id}/invitations`, tenant-scoped
    invitations, and `/tenants/{id}/service-accounts` (ADR-071)). Clients
    should accept the whole `2xx` class; the RealmID SDKs already do.

    Retired in this release (returned 404):
    `/auth/select-tenant`, `/auth/token/switch`, `/auth/user-token`,
    `/auth/cross-platform-token`, and the `choice_token` machinery.
    See ADR-032 for the consolidation.

    New in v1: `GET /platforms/mine` for caller-scoped platform
    discovery; 412 error envelopes include sibling fields on the error object
    (`revocation_token`, `mfa_challenge_token`, `active_sessions`,
    `tenant_id`) rather than bare codes.

    New in v0.7.0 (ADR-051 — two-endpoint auth surface): the
    credential-exchange surface collapses to **`POST /auth/login` +
    `POST /auth/token`**. `POST /auth/service-token` and
    `POST /auth/platform-token` are deleted (hard cut, no aliases).
    `/auth/login` now takes a `grant_type`-discriminated body with
    five grants (`provider_token`, `password`, `otp`,
    `api_key`, `platform_api_key`). The legacy `method` field was a
    one-release deprecated alias for the user grants and is **removed**
    at its announced sunset (2026-08-01). All issued tokens carry an explicit
    `subject_type ∈ {user, service, platform}`. The realm-config key
    `service_refresh_rotates` (default `false`) opts the ADR-071
    service-account refresh token into the user-style single-use
    rotation lifecycle. Its sibling `platform_refresh_rotates` was
    removed by ADR-089, which withdrew the refresh token from every
    credential-bootstrapped session.

    See ADR-035 (`issuer/docs/adr/035-post-v1-deferrals.md`) for features
    deferred past v1: HTTP rate limiting, cross-platform authorization
    endpoints, OTP internal login (`method: "otp"`), and per-realm
    invitation TTL overrides.
  version: 0.30.0
  contact:
    name: RealmID
    url: https://realmid.dev

servers:
  - url: https://auth.realmid.dev
    description: Production

tags:
  - name: Auth
    description: Login, token mint, MFA, logout
  - name: Sessions
    description: Session list and revocation
  - name: JWKS
    description: Public key discovery
  - name: Platforms
    description: Self-serve platform onboarding (ADR-033)
  - name: Realms
    description: Realm-as-OIDC-issuer surface (JWKS, OIDC discovery)
  - name: Platform Admin
    description: Partner-platform admin surface (api keys, config, roles)
  - name: Tenants
    description: Tenant CRUD, config, membership
  - name: MFA Admin
    description: Admin-initiated TOTP enrollment + reset
  - name: Invitations
    description: Tenant invitation management
  - name: Internal ops
    description: |
      RealmID-staff-only endpoints under `/admin/platforms/...` powering
      the internal-ops console (UI v2 G3). Authz: base-realm staff
      (a service JWT scoped to the base realm OR a user JWT whose tenant
      is the base realm's admin tenant with role=owner). Customer
      partners get 403 even on the GET routes — these are surfaces RI
      ops uses, not partner self-service. Spec lives in
      `ui/web/docs/v2-handoff.md` G3.3-G3.5 + `ui/TODO.md` decision #15.

components:
  securitySchemes:
    BearerAccess:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access JWT minted by POST /auth/token.
    BearerRefresh:
      type: http
      scheme: bearer
      description: Refresh token (opaque). Used by POST /auth/token, /auth/logout.
    BearerService:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Service JWT minted by POST /auth/login with
        `grant_type=api_key` (ADR-051; v0.7.0). Carries
        `subject_type=service`.
    BearerMFAChallenge:
      type: http
      scheme: bearer
      description: Short-lived MFA challenge token.
    BearerRevocation:
      type: http
      scheme: bearer
      description: Short-lived revocation token returned on 412 session_limit_reached. Scope = session:list + session:revoke.
    BearerPlatformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived platform JWT minted by POST /auth/login with
        `grant_type=platform_api_key` (ADR-051; v0.7.0). Carries
        `subject_type=platform` and claim `token_class=platform`.

        **ADR-097 #8 — claim rename, COMPLETE.** The class marker used to be
        the `scope` claim. RFC 9068 §2.2.3 gives that name to GRANTED
        AUTHORITY, which ADR-097 hands to partner-supplied strings, so the
        class moved to its own `token_class` claim. Spec `0.27.0` emitted
        **both**; from `0.28.0` a platform token carries `token_class` only.
        **BREAKING for anything still reading `scope` to decide "is this a
        platform token"** — a `scope` on a token is now the partner's own
        granted-authority vocabulary and says nothing about class. A partner
        may legitimately name a scope `platform`. Used by
        partner backends per ADR-047 to mediate every scoped
        read/write against RealmID — including identity-provider
        discovery, /auth/login user grants, /me forwards, and the
        A.7 domain CRUD surface.

  schemas:
    Error:
      type: object
      required: [code, message]
      description: |
        Standard error envelope. **Wire shape note (applies to every
        error response in this spec):** GoFr nests the handler's error
        object under a top-level `"error"` key, and the human-readable
        text travels in a field named `"error"` — NOT `"message"`
        (`apiErr.Response()` in `internal/httpapi/types.go`). The actual
        bytes on the wire are:

            {"error": {"code": "<slug>", "error": "<human text>"}}

        The `message` property below is the *logical* hint field; read it
        from `error.error` when consuming raw HTTP. Extra sibling fields
        (e.g. the 412 precondition envelopes' `mfa_challenge_token`,
        `revocation_token`, `active_sessions`, `tenant_id`) are nested
        under the same top-level `"error"` object.

        `code` is a stable machine-readable
        slug; `message` is a human-readable hint. Common 401 codes
        emitted by the auth surface:

        - `invalid_credentials` — bad password / token / OTP.
        - `invalid_audience` — id-token `aud` not registered (ADR-046).
        - `invalid_token` — malformed / expired bearer.
        - `wrong_scope` — bearer present but wrong class
          (e.g. user JWT where platform is required).
        - `bff_bearer_required` — every realm requires the BFF escort (ADR-088)
          and the inbound platform bearer is missing. Emitted on
          `POST /auth/token` + `POST /auth/logout`. NOTE: `POST /auth/login`
          requires a platform bearer **unconditionally** (ADR-047 §2 — it
          gates via the platform-token check, which runs *before* the BFF
          gate), so a **bearerless `/auth/login` returns `401 unauthorized`
          ("missing bearer"), never `bff_bearer_required`**. The
          `bff_bearer_required` code is only reachable on
          `/auth/token` / `/auth/logout`.
        - `key_class_mismatch` — declared `grant_type` on
          `/auth/login` (`api_key` vs `platform_api_key`) doesn't
          match the api-key's class (ADR-051).
        - `user_not_invited` — known user but not a member of any
          tenant in the resolved realm. (Returned as **403**, not 401 —
          listed here for discoverability.)
        - `refresh_invalid` — on `POST /auth/token` only: the presented
          refresh token is expired, revoked, or reuse-detected. Terminal
          for the caller — re-authentication is required (no retry helps).
      properties:
        code: { type: string, example: user_not_invited }
        message: { type: string }

    SuspendPlatformResponse:
      type: object
      description: |
        Response shape for POST /admin/platforms/{id}/suspend +
        /unsuspend. `suspended_at` and `reason` are present only when
        the platform is currently suspended.
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, suspended, deactivated] }
        suspended_at: { type: integer, format: int64, nullable: true }
        reason: { type: string }

    PreconditionMFA:
      type: object
      description: 412 response when target tenant requires MFA.
      required: [code, mfa_challenge_token, tenant_id]
      properties:
        code:
          type: string
          enum: [mfa_required, mfa_registration_required]
        missing:
          type: array
          items: { type: string }
          example: [mfa]
        mfa_challenge_token: { type: string }
        tenant_id: { type: string, format: uuid }

    SessionSummary:
      type: object
      required: [id, created_at]
      properties:
        id: { type: string, format: uuid }
        origin: { type: string }
        device_name:
          type: string
          description: >
            Human-readable label for the device that created this session
            (e.g. a CLI hostname), supplied at login via the `X-Device-Name`
            header. Omitted when the session carries no label. Lets a user
            tell sessions apart when revoking (ADR-062).
        created_at: { type: integer, format: int64 }
        last_seen_at: { type: integer, format: int64 }

    PreconditionSessionLimit:
      type: object
      description: |
        412 response when concurrent session cap is hit at login.
        Extends the base {code, message} error envelope with the
        short-lived revocation_token (scope: session:list + session:revoke,
        TTL = realm challenge TTL) and the list of active sessions the UI
        shows in the Session-Limit modal. See TEST_INVENTORY §2.6.
      required: [code, message, revocation_token, active_sessions]
      properties:
        code: { type: string, enum: [session_limit_reached] }
        message: { type: string }
        revocation_token: { type: string }
        active_sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionSummary' }

    PreconditionFirstLoginPending:
      type: object
      description: |
        412 response when the first login on a recently-vacated contact
        slot (slot_recycled_until > now; ADR-042 P2) is held for tenant-
        owner approval. The IdP proof is stashed as a pending
        contact_verification (verification_id); login returns no session.
        The owner approves/rejects via
        POST /tenants/{id}/contact-verifications/{cvId}/approve|reject,
        after which the user re-logs in.
      required: [code, message, tenant_id, user_id, verification_id]
      properties:
        code: { type: string, enum: [first_login_pending_approval] }
        message: { type: string }
        tenant_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        verification_id: { type: string, format: uuid }

    TenantMembership:
      type: object
      required: [tenant_id, display_name, role, mfa_required]
      properties:
        tenant_id: { type: string, format: uuid }
        display_name: { type: string }
        role:
          type: string
          description: |
            The user's role in this tenant. Any name from the realm's
            role catalog (`GET /platforms/{id}/roles`): the system roles
            `owner` / `admin` / `member` / `viewer` / `platform_api`, or
            a platform-defined custom role (ADR-040). Not a closed enum.
        mfa_required: { type: boolean }
        mfa_methods:
          type: array
          items: { type: string, enum: [totp, otp] }
          description: |
            The MFA methods this membership must satisfy (union of the
            user's enrollment and the role/realm requirements —
            `computeMFAMethods`, ADR-059/075). Empty/omitted when no
            method-specific requirement applies.

    LoginRequest:
      type: object
      required: [grant_type]
      description: |
        ADR-051 (v0.7.0): `/auth/login` is the single
        credential-exchange endpoint. The body's `grant_type`
        discriminates which credentials are presented and which
        subject class the issued tokens carry.

        Inbound bearer rules (the handler dispatches on `grant_type`
        before applying any bearer gate):

        - `provider_token`, `password`, `otp` — **user
          grants**. Require `Authorization: Bearer <platform access
          token>` (the realm's BFF / partner-backend gate, ADR-041 +
          ADR-047). Realm is resolved from the bearer's `realm_id`
          claim; body `realm_id` is ignored.
        - `api_key`, `platform_api_key` — **api-key grants**.
          Unauthenticated; the raw API key travels in the body. Any
          inbound bearer is rejected. The api-key's class must match
          the declared `grant_type`; mismatch → 401
          `key_class_mismatch`.

        The legacy `method` selector (pre-ADR-051) is **removed** at
        its announced `Sunset: 2026-08-01`. A body carrying only
        `method` now 400s `missing_grant_type`; send `grant_type`
        (+ `provider` for `provider_token`). `grant_type=password` is
        reserved and unconditionally 400s `unknown_method`
        (ADR-042 slot).

        ADR-046 (still applies under `provider_token`/`google`):
        `tenant_id` is required on tenant-scoped origins so the
        verifier can pick the tenant's per-tenant `client_id`s (plus
        the platform-default list) to validate `aud`. On realm-root
        origins (e.g. `app.realmid.dev` or a platform's admin
        console apex) discovery returns `tenant_id: null` and the
        field is OPTIONAL — realm-scoped `identity_providers`
        client_ids gate the sign-in instead (issuer v0.27.2).
      oneOf:
        - $ref: '#/components/schemas/LoginRequestProviderToken'
        - $ref: '#/components/schemas/LoginRequestPassword'
        - $ref: '#/components/schemas/LoginRequestOTP'
        - $ref: '#/components/schemas/LoginRequestAPIKey'
        - $ref: '#/components/schemas/LoginRequestPlatformAPIKey'
        - $ref: '#/components/schemas/LoginRequestTokenExchange'
      discriminator:
        propertyName: grant_type
        mapping:
          provider_token:    '#/components/schemas/LoginRequestProviderToken'
          password:          '#/components/schemas/LoginRequestPassword'
          otp:               '#/components/schemas/LoginRequestOTP'
          api_key:           '#/components/schemas/LoginRequestAPIKey'
          platform_api_key:  '#/components/schemas/LoginRequestPlatformAPIKey'
          user_api_key:      '#/components/schemas/LoginRequestUserAPIKey'
          urn:ietf:params:oauth:grant-type:token-exchange: '#/components/schemas/LoginRequestTokenExchange'
      properties:
        grant_type:
          type: string
          enum: [provider_token, password, otp, api_key, platform_api_key, user_api_key, 'urn:ietf:params:oauth:grant-type:token-exchange']
        custom_claims:
          type: object
          additionalProperties: true
          description: |
            Optional partner-supplied claims, gated by
            `realms.config.access_token_custom_claim_keys`
            (SDK SPEC §4.2). Only meaningful on user grants when an
            access token is minted on the first call (single-tenant,
            no MFA). Otherwise pass on `POST /auth/token`.

    LoginRequestProviderToken:
      type: object
      required: [grant_type, provider, token]
      description: |
        Exchange a third-party id-token (Google, Firebase phone
        auth, etc.) for a RealmID refresh token. Inbound bearer:
        platform access JWT.
      properties:
        grant_type: { type: string, enum: [provider_token] }
        provider:
          type: string
          enum: [google, firebase, firebase_phone, microsoft, apple, facebook, github]
          description: |
            `google`, `firebase`, `microsoft`, `apple`, and `facebook`
            have working direct OIDC verifiers. `firebase_phone` is a
            legacy alias for the Firebase verifier. `facebook` accepts
            only the OIDC ID-token ("Limited Login") flavor — the classic
            access token is not supported (it needs an app secret RealmID
            does not store). `github` is post-v1 and listed so the schema
            documents the forward roadmap. The accepted `aud` (client_id;
            for `apple` the Services ID, for `facebook` the app id) is
            resolved per realm/tenant from identity_providers; for
            `firebase` the configured value is the Firebase project id.
            `tenant_id` is optional for every provider on a realm-root
            origin (e.g. app.realmid.dev or a partner admin console),
            where realm-scoped client_ids gate sign-in with no tenant pin.
        token:
          type: string
          description: The provider-issued id-token to exchange.
        tenant_id:
          type: string
          format: uuid
          description: |
            Optional. Pins membership resolution to one tenant; required
            only when a partner end-user origin resolves to a specific
            tenant and the response must be single-tenant. On a realm-root
            origin it is absent — realm-scoped client_ids gate sign-in
            (v0.27.2; ADR-046). When set, the response is single-tenant and
            an access token is minted on the first call.
        custom_claims:
          type: object
          additionalProperties: true
      example:
        grant_type: provider_token
        provider: google
        token: eyJhbGciOiJSUzI1NiIs...
        tenant_id: 018f0c9f-2c1f-7c6c-9a0b-3a8b1d4c2f00

    LoginRequestPassword:
      type: object
      required: [grant_type, identifier, presented]
      description: |
        **Reserved, not implemented.** `grant_type=password` is the
        ADR-042 native u/p schema slot: the grant name is recognised on
        the wire, but there is no native password verifier — the handler
        **unconditionally returns `400 unknown_method`**
        ("grant_type=password not enabled"). The field shapes below are
        the reserved contract for when it ships. Inbound bearer:
        platform access JWT.
      properties:
        grant_type: { type: string, enum: [password] }
        identifier:
          type: string
          description: |
            Identifier the user logs in with — typically email or
            E.164 phone, resolved through the realm's user lookup.
            Resolution failure surfaces as `invalid_credentials`
            (no enumeration).
        presented:
          type: string
          format: password
          description: The presented password.
        tenant_id:
          type: string
          format: uuid
          description: |
            Optional. When set and the user is a member, the
            response is single-tenant and an access token is
            minted on the first call.
        custom_claims:
          type: object
          additionalProperties: true
      example:
        grant_type: password
        identifier: alice@example.com
        presented: hunter2

    LoginRequestOTP:
      type: object
      required: [grant_type, identifier, presented]
      description: |
        OTP login (ADR-071; direct cutover from the former
        `otp` grant). Under ADR-071 this authenticates a
        **service account** (`users.kind=service`) via a `view_bff` OTP
        an owner/admin minted for it (`POST /auth/otp/issue`
        `purpose=login`). The `kind × mode` gate rejects a `kind=human`
        subject here (humans elevate via TOTP, never an owner-minted OTP)
        — failure collapses to `invalid_credentials` (no enumeration).
        Gated by `realms.config.otp_login_enabled`. Inbound bearer:
        platform access JWT.
      properties:
        grant_type: { type: string, enum: [otp] }
        identifier:
          type: string
          description: |
            The service account's login handle (email/phone). Resolved
            against the realm's user lookup. Failure → `invalid_credentials`
            (no enumeration).
        presented:
          type: string
          description: The OTP value minted for the service account.
        tenant_id:
          type: string
          format: uuid
          description: Optional tenant pin (same semantics as `password`).
      example:
        grant_type: otp
        identifier: 'sync-bot@dealer-a.example'
        presented: '038412'

    LoginRequestAPIKey:
      type: object
      required: [grant_type, api_key]
      description: |
        Service api-key exchange. **No inbound bearer** — the raw
        API key travels in `api_key`. The key must have been issued
        as a service key; if it was issued as a platform key the
        server returns 401 `key_class_mismatch`.
      properties:
        grant_type: { type: string, enum: [api_key] }
        api_key:
          type: string
          description: The raw service API key (e.g. `rk_svc_...`).
      example:
        grant_type: api_key
        api_key: rk_svc_live_AbCdEf012345

    LoginRequestUserAPIKey:
      type: object
      required: [grant_type, api_key]
      description: |
        ADR-084 end-user api-key exchange. **No inbound bearer** — the raw key
        travels in `api_key`. Mints a **user-class** session for the key's bound
        user, capped by the key's `permissions_cap`.

        Three things are re-resolved HERE, at every exchange, rather than trusted
        from the key row:

        1. **The key itself** — revoked or past `expires_at` returns the same
           envelope either way, so a holder cannot distinguish the two states.
        2. **Live org membership** — for `org_scope=selected`, `org_ids` no
           longer resolvable are dropped; for `all`, memberships are resolved
           fresh. Revocation on membership loss is an async sweep, not
           transactional (reachability of an org dies through many events across
           other tenants' transactions), so a key may LIST an org it can no
           longer MINT into.
        3. **The MFA floor** — exempt if and only if MFA was proven at mint
           (`minted_mfa_at IS NOT NULL`). Without that exemption a headless
           script could never log in to a realm with a mandatory floor, making
           user keys unusable in exactly the realms that care most.

        The minted token carries `amr: ["api_key"]` with **no** `mfa` entry, so it
        can never satisfy a downstream step-up gate.

        A **partner-audience** key is class-rejected at RealmID's own admin
        surface with `user_key_not_accepted_here`: its `permissions_cap` is
        opaque to RealmID, so there is nothing to intersect and therefore
        nothing to enforce — only to refuse.
      properties:
        grant_type: { type: string, enum: [user_api_key] }
        api_key:
          type: string
          description: |
            The raw user API key. Prefix `uk_live_`, deliberately distinct from
            the admin key's `rk_live_`.
        tenant_id:
          type: string
          format: uuid
          description: |
            Optional target org. Must be within the key's resolved scope, else
            `403 org_not_in_key_scope`. Omitted on a single-org key = that org.
      example:
        grant_type: user_api_key
        api_key: uk_live_AbCdEf012345

    LoginRequestPlatformAPIKey:
      type: object
      required: [grant_type, api_key]
      description: |
        Platform api-key exchange (ADR-041 §1, §3). **No inbound
        bearer** — the raw API key travels in `api_key`. The key
        must have been issued as a platform key; if it was issued
        as a service key the server returns 401
        `key_class_mismatch`. The platform access token returned
        here is what callers present as the inbound bearer for
        the user-facing grants (`provider_token`, `password`,
        `otp`).
      properties:
        grant_type: { type: string, enum: [platform_api_key] }
        api_key:
          type: string
          description: The raw platform API key (e.g. `rk_plat_...`).
      example:
        grant_type: platform_api_key
        api_key: rk_plat_live_AbCdEf012345

    LoginRequestTokenExchange:
      type: object
      required: [grant_type, subject_token]
      description: |
        Workload identity federation exchange (ADR-057). **No inbound
        bearer** — the partner workload's ambient OIDC token (GCP
        metadata server or GitHub Actions) travels in `subject_token`.
        The issuer validates it against the RI-pinned JWKS for its
        issuer, enforces `aud` (the global RI audience) + `iat`-freshness
        + one-time-use, then selects the unique `federation_binding`
        whose `match_claims` all hold and mints the **same**
        `class="platform"` session the `platform_api_key` grant returns —
        including ADR-089's shape: an access token with **no**
        `refresh_token`. Re-mint by exchanging a fresh assertion.
        401 on: unknown issuer, invalid/stale/replayed assertion, audience
        mismatch, or no matching binding.
      properties:
        grant_type:
          type: string
          enum: ['urn:ietf:params:oauth:grant-type:token-exchange']
        subject_token:
          type: string
          description: The workload OIDC JWT (Google ID token or GitHub Actions OIDC token).
        subject_token_type:
          type: string
          enum: ['urn:ietf:params:oauth:token-type:jwt']
          description: Optional; defaults to the JWT token-type URN when omitted.
      example:
        grant_type: 'urn:ietf:params:oauth:grant-type:token-exchange'
        subject_token: eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9.eyJpc3MiOiJodHRwczovL3Rva2VuLmFjdGlvbnMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIn0.sig
        subject_token_type: 'urn:ietf:params:oauth:token-type:jwt'

    LoginResponse:
      description: |
        `/auth/login` response. Three success shapes. The shape is
        selected by `subject_type` and, for users, by tenant
        cardinality + MFA state:

        1. **User, fully resolved** (`subject_type:"user"`,
           single-tenant, no MFA pending): refresh + access +
           tenant_id + role + expires_in + tenants[] + user.
        2. **User, multi-tenant OR MFA pending**
           (`subject_type:"user"`): refresh + tenants[] + user;
           caller picks a tenant via `POST /auth/token`. No
           access_token / tenant_id / role / expires_in.
        3. **Api-key grants** (`subject_type:"service"` |
           `"platform"` via `grant_type=api_key` /
           `platform_api_key`) and the token-exchange grant:
           access + expires_in + `"tenants": []` (present but always
           empty). **No `refresh_token`** — ADR-089: the credential
           itself is re-presentable, so a refresh token would be a
           weaker duplicate of one the caller already holds, and the
           field is omitted entirely. Re-mint by calling this
           endpoint again. No tenant_id, no role — the session is
           pinned to the api-key's bot user / admin tenant.
           NOTE: a **service-account OTP login**
           (`grant_type=otp` resolving a `kind=service` user,
           ADR-071) is *user-shaped*: it returns
           `subject_type:"service"` **with** tenants[] / tenant_id /
           role / user — shapes 1/2 with `subject_type:"service"`.

        **MFA is NOT signalled here.** There is no
        `status:"mfa_required"` login shape — every successful
        credential exchange returns `status:"ok"` **including a
        refresh token** even when MFA is still pending. An
        MFA-requiring membership is flagged per-tenant via
        `tenants[].mfa_required` (which suppresses the shape-1
        access-token fast path), and the `412 mfa_required`
        precondition (`PreconditionMFA`) is raised later, on the
        `POST /auth/token` tenant mint.
      oneOf:
        - $ref: '#/components/schemas/LoginResponseUserResolved'
        - $ref: '#/components/schemas/LoginResponseUserMultiTenant'
        - $ref: '#/components/schemas/LoginResponseM2M'

    LoginResponseUserResolved:
      type: object
      required: [status, subject_type, refresh_token, access_token, tenant_id, role, expires_in, tenants]
      description: |
        Single-tenant user, no MFA pending — fully resolved on the first
        call. `subject_type` is `service` (not `user`) when the resolved
        subject is a `kind=service` account (`grant_type=otp`, ADR-071).
      properties:
        status: { type: string, enum: [ok] }
        subject_type: { type: string, enum: [user, service] }
        user:
          type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
          description: |
            The resolved subject's user id. Present on every user-grant
            login (even when no access token is minted) so a BFF can
            resolve the user without decoding the JWT `sub`. Omitted on
            api-key (M2M) grants.
        refresh_token: { type: string }
        access_token: { type: string }
        tenant_id: { type: string, format: uuid }
        role: { type: string }
        expires_in: { type: integer, format: int64 }
        tenant_choice_required:
          type: boolean
          description: >
            ADR-092 D5. The caller holds two or more ACTIVE memberships in a
            realm whose `single_tenant_membership` is on, and must settle the
            picker via POST /me/tenant-choice. Optional; omitted when false.

            This login SUCCEEDED — an access token is still issued, and the
            field is a reconciliation prompt, not an authentication failure.
            Treating it as an auth error would strand exactly the users the
            drain exists to resolve, leaving them no credential to answer with.
        tenant_choices:
          type: array
          description: >
            ADR-092 D5. The memberships the picker may choose between; present
            only alongside `tenant_choice_required`. The chosen membership is
            KEPT and the others are suspended (recoverable) with their sessions
            revoked.
          items:
            type: object
            properties:
              tenant_id: { type: string, format: uuid }
              display_name: { type: string }
              is_owner:
                type: boolean
                description: >
                  This membership CANNOT be given up — `tenants.owner_user_id`
                  is NOT NULL, so revoking it would leave the tenant ownerless.
                  The server refuses such a choice with 409
                  `owner_cannot_be_revoked`; clients should not offer it, and
                  must still handle the refusal since the client is not the
                  authority.
        refresh_exp:
          type: integer
          format: int64
          description: >
            Absolute wall-clock expiry (unix seconds) of the refresh token —
            the min of the rolling refresh TTL, the ADR-054 scheduled cutoff,
            and the ADR-058 absolute session cap. Distinct from `expires_in`
            (the access-token lifetime, in seconds). Optional and
            forward-compatible: absent on pre-refresh_exp issuers, so a
            consumer sizing a session from it must fall back to its own ceiling
            when absent/zero.
        idle_ttl:
          type: integer
          format: int64
          description: >
            Realm-configured idle (inactivity) session timeout, in seconds —
            a sliding-window DURATION (resets on each request), NOT an absolute
            expiry (ADR-070). The BFF force-logs-out a session idle for longer
            than this; the issuer only reports the value. Absent / 0 = idle
            timeout disabled for this realm (the default). Sourced straight
            from `realms.config.idle_ttl_seconds` with no min-of-three compute.
        tenants:
          type: array
          items: { $ref: '#/components/schemas/TenantMembership' }
      example:
        status: ok
        subject_type: user
        refresh_token: rt_...
        access_token: eyJhbGciOi...
        tenant_id: 018f0c9f-2c1f-7c6c-9a0b-3a8b1d4c2f00
        role: owner
        expires_in: 900
        refresh_exp: 1782043200
        idle_ttl: 1800
        user:
          id: 018f0c9f-2c1f-7c6c-9a0b-3a8b1d4c2f99
        tenants:
          - tenant_id: 018f0c9f-2c1f-7c6c-9a0b-3a8b1d4c2f00
            display_name: Acme Inc
            role: owner
            mfa_required: false

    LoginResponseUserMultiTenant:
      type: object
      required: [status, subject_type, refresh_token, tenants]
      description: |
        Multi-tenant user — or a single-tenant user whose membership has
        `mfa_required:true` (the access-token fast path is suppressed).
        Caller must pick a tenant and call `/auth/token` with the
        refresh + `tenant_id` (which raises `412 mfa_required` when MFA
        is still unsatisfied for that tenant).
      properties:
        status: { type: string, enum: [ok] }
        subject_type: { type: string, enum: [user, service] }
        user:
          type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
          description: The resolved subject's user id (see LoginResponseUserResolved.user).
        refresh_token: { type: string }
        tenants:
          type: array
          items: { $ref: '#/components/schemas/TenantMembership' }
      example:
        status: ok
        subject_type: user
        refresh_token: rt_...
        tenants:
          - tenant_id: 018f0c9f-2c1f-7c6c-9a0b-3a8b1d4c2f00
            display_name: Acme Inc
            role: owner
            mfa_required: false
          - tenant_id: 018f0c9f-2c1f-7c6c-9a0b-3a8b1d4c2f01
            display_name: Beta Co
            role: member
            mfa_required: true

    LoginResponseM2M:
      type: object
      required: [status, subject_type, refresh_token, access_token, expires_in, tenants]
      description: |
        Api-key (M2M) login — pinned to the api-key's bot user + admin
        tenant. `tenants` is present but **always `[]`** on this shape;
        `tenant_id` / `role` / `user` are omitted (those are user
        concepts). Emitted by `grant_type=api_key` / `platform_api_key`
        only — a service-account **OTP** login is user-shaped (see
        `LoginResponse` shape 3 note).
      properties:
        status: { type: string, enum: [ok] }
        subject_type:
          type: string
          enum: [service, platform]
        refresh_token: { type: string }
        access_token: { type: string }
        expires_in: { type: integer, format: int64 }
        tenants:
          type: array
          maxItems: 0
          items: { $ref: '#/components/schemas/TenantMembership' }
          description: Always the empty array on api-key grants.
        refresh_exp:
          type: integer
          format: int64
          description: >
            Absolute refresh-token expiry (unix seconds); see
            LoginResponseUserResolved.refresh_exp. Optional.
        idle_ttl:
          type: integer
          format: int64
          description: >
            Realm idle-timeout duration (seconds); see
            LoginResponseUserResolved.idle_ttl. Absent / 0 = disabled. Optional.
      example:
        status: ok
        subject_type: platform
        refresh_token: rt_...
        access_token: eyJhbGciOi...
        expires_in: 300
        refresh_exp: 1782043200
        tenants: []

    TokenRequest:
      type: object
      description: |
        Refresh-token rotation. The body's `tenant_id` is **required
        only** when selecting a tenant for a multi-tenant user
        (response shape #2 from `/auth/login`). For service /
        platform refresh tokens, `tenant_id` is **ignored** — those
        sessions are pinned to the api-key's admin tenant.
      properties:
        tenant_id:
          type: string
          format: uuid
          description: |
            Required for multi-tenant user pick. Ignored when the
            refresh token's `subject_type` is `service` or
            `platform`.
        refresh_token:
          type: string
          description: Optional — refresh may also arrive via Authorization header.
        custom_claims:
          type: object
          additionalProperties: true
          description: |
            Optional partner-supplied claims, gated by
            `realms.config.access_token_custom_claim_keys`
            (SDK SPEC §4.2).

            A key that collides with a reserved JWT claim name is now
            **refused** with 400 `reserved_claim_key`, not dropped
            (ADR-097 D3). A dropped claim is indistinguishable, from your
            side, from an honoured one — and once `scope` carries granted
            authority, that difference is a gate that never fires.
        scope:
          type: string
          description: |
            **ADR-097 §A — granted authority, space-delimited.**

            RFC 9068 §2.2.3, which defines the claim by reference to RFC
            8693 §4.2 ("a JSON string containing a space-separated list of
            scopes") in RFC 6749 §3.3 format. A STRING, not an array.

            These are **your** scope strings. RealmID stores no partner
            catalog: the values are never parsed, validated against a
            vocabulary, persisted, or interpreted. Your repo owns the
            route -> scope and role -> scope maps; the RealmID SDK is the
            gate that evaluates them.

            **Charset (RFC 6749 §3.3):** `%x21 / %x23-5B / %x5D-7E` —
            printable ASCII minus SPACE, `"` and `\`. Case-SENSITIVE, no
            normalization. A space inside a value would split one scope into
            two, so a malformed entry is refused at mint (`invalid_scope`)
            rather than silently reshaped.

            **Bounded** by the realm's `user_api_keys.max_permission_strings`
            and `max_permission_string_len` (defaults 32 / 128) —
            `too_many_scopes` / `scope_too_long`. The same knobs, not a
            second vocabulary for the same kind of string.

            **Intersected server-side.** When the session came from a user
            API key, the minted claim is `scope` INTERSECTED with the key's
            live `permissions_cap` — exact string match, no wildcards, no
            hierarchy. RealmID does this so that a caller who bypasses the
            SDK still receives a narrowed token.

            **Re-resolved on every call.** The claim is never stored on the
            session: send it each time. Omitting it mints no `scope` at all.

            **Revocation lag.** A token-carried scope is only as fresh as
            the token: revoking a grant takes effect within
            `access_ttl_seconds`. Where a stale grant is unacceptable —
            money movement, permission administration, data export — use the
            SDK's `CapAllows`, which reads live and has zero lag.

            Not accepted on a service-class refresh (`scope_not_supported`).

    TokenResponse:
      type: object
      required: [status, subject_type, access_token, refresh_token, expires_in]
      description: |
        Access + rotated-refresh response. `tenant_id` and `role`
        are present only when `subject_type=user`; absent for
        `service` refresh. ADR-089: a credential-bootstrapped
        session (api key / WIF) has NO refresh token, so this
        endpoint serves only users and ADR-071 service accounts.
        `refresh_token` is rotated unconditionally for users; for
        a service account only when the realm has opted in via
        `service_refresh_rotates` (otherwise the same refresh is
        echoed back unchanged).
      properties:
        status: { type: string, enum: [ok] }
        subject_type:
          type: string
          enum: [user, service, platform]
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, format: int64 }
        refresh_exp:
          type: integer
          format: int64
          description: >
            Absolute expiry (unix seconds) of the rotated refresh token (or,
            when rotation is off for a service/platform refresh, of the
            unchanged echoed token); see
            LoginResponseUserResolved.refresh_exp. Optional.
        idle_ttl:
          type: integer
          format: int64
          description: >
            Realm idle-timeout duration (seconds); see
            LoginResponseUserResolved.idle_ttl. Absent / 0 = disabled. Optional.
        tenant_id:
          type: string
          format: uuid
          description: User refresh only.
        role:
          type: string
          description: User refresh only.
      example:
        status: ok
        subject_type: user
        access_token: eyJhbGciOi...
        refresh_token: rt_...
        expires_in: 900
        refresh_exp: 1782043200
        idle_ttl: 1800
        tenant_id: 018f0c9f-2c1f-7c6c-9a0b-3a8b1d4c2f00
        role: owner

    MFAVerifyRequest:
      type: object
      required: [mfa_challenge_token, code]
      properties:
        mfa_challenge_token: { type: string }
        code: { type: string }
        method:
          type: string
          enum: [totp, otp]
          description: |
            Which MFA method this verify is completing. Defaults to
            `totp` for backward compatibility. Set `otp` to
            consume an OTP minted via `POST /auth/otp/issue`
            (gated by `realms.config.otp_mfa_enabled` and per-user /
            per-role enrollment in `otp`). The first-factor
            login response's `methods[]` lists which values are valid
            here for the current challenge.

    MFAVerifyResponse:
      type: object
      description: |
        SPEC §10.4 — successful verify returns a freshly minted access token
        (with the new `mfa_at` claim) plus a rotated refresh, so the client
        can resume the original protected operation in one round trip. The
        access token's claim set is identical to the /auth/login response —
        see AccessTokenClaims for the full claim list, including `mfa_at`.
      required: [status, access_token, refresh_token, expires_in, tenant_id, role, mfa_at]
      properties:
        status: { type: string, enum: [ok] }
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, format: int64 }
        refresh_exp:
          type: integer
          format: int64
          description: >
            Absolute expiry (unix seconds) of the rotated refresh token; see
            LoginResponseUserResolved.refresh_exp. Optional.
        idle_ttl:
          type: integer
          format: int64
          description: >
            Realm idle-timeout duration (seconds); see
            LoginResponseUserResolved.idle_ttl. Absent / 0 = disabled. Optional.
        tenant_id: { type: string, format: uuid }
        role: { type: string }
        mfa_at:
          type: integer
          format: int64
          description: Unix-seconds timestamp of the MFA verify just completed.

    MFAChallengeResponse:
      type: object
      description: |
        SPEC §10.4 — POST /auth/mfa/challenge mints a step-up challenge token
        for an already-verified access token. SDK middleware calls this when
        a route requires fresh MFA but the caller's access token is missing
        or stale on `mfa_at`. Auth: bearer of the user's current access
        token (NOT a platform token).
      required: [mfa_challenge_token, methods]
      properties:
        mfa_challenge_token: { type: string }
        methods:
          type: array
          items: { type: string, enum: [totp] }
          description: Supported challenge methods. Today only `totp`.

    # ---- partner OTP primitive (v0.6.0, proposal partner-otp-primitive.md) ----

    OTPIssueRequest:
      type: object
      required: [subject_ref, purpose]
      properties:
        subject_ref:
          type: string
          description: |
            Opaque tenant-scoped key the OTP gates. Conventionally
            `"user:<uuid>"`, `"booking:<uuid>"`, `"payout:<uuid>"`,
            etc. RealmID does not interpret the prefix — EXCEPT for
            `purpose: "login"` (ADR-071 §5), where the server re-derives
            a canonical `"user:<service-account-id>"` from the validated
            target and ignores any caller-supplied value (a login OTP is
            a become-the-subject credential and is never minted from an
            untrusted subject_ref).
        purpose:
          type: string
          description: |
            Opaque tenant-scoped purpose label. Examples: `"login"`,
            `"delivery"`, `"payout_approval"`. Pattern
            `^[a-z][a-z0-9_]{0,63}$`. `purpose: "login"` is the
            **mint-gate** (ADR-071 §5): the effective caller must be
            owner/admin of the tenant and the target `subject_ref` must
            reference a `kind=service` account in that tenant — else
            `403`. Other purposes keep the open-to-any-tenant-member
            behavior of the partner OTP primitive.
        delivery_mode:
          type: string
          enum: [view_bff, email]
          default: view_bff
          description: |
            Mint transport (ADR-071 §4, threaded by ADR-095 D7).

            `view_bff` (the default when omitted) returns the plaintext code
            to the authorized caller in the response `value`, to be relayed
            out-of-band. This is unchanged, and an omitted field still means
            exactly this.

            `email` has RealmID deliver the code to the SUBJECT. The caller
            does **not** receive the plaintext — `value` is omitted from the
            response and `delivered` reports `email`. Returning the code as
            well would make the mode confer nothing.

            **`email` is refused for `purpose=login`** with
            `400 unsupported_delivery_mode`: that path targets a `kind=service`
            account (ADR-071 §5), which has no mailbox, so there is no correct
            destination for the message.

            Errors: `400 unsupported_delivery_mode` (unknown mode, or `email`
            on a login OTP); `400 no_delivery_address` (the subject has no
            email on record — the issue FAILS rather than returning an id for
            a code nobody will receive); `503 delivery_unavailable` (the mode
            is legal but this deployment has no transport wired).

            `sms`/`whatsapp` remain deferred behind the
            credential-custodian/KMS work and still return
            `400 unsupported_delivery_mode`.

    OTPIssueResponse:
      type: object
      required: [id, expires_at, purpose, subject_ref]
      properties:
        id: { type: string, format: uuid }
        value:
          type: string
          description: |
            Plaintext OTP. Length is `realms.config.otp_length` (default
            6, range 4..10). The caller is responsible for delivery (UI
            display, partner SMS / email). Re-displayable via
            `GET /auth/otp/{id}` until TTL expires.

            **OMITTED when `delivery_mode=email`** (ADR-095 D7): RealmID
            delivered the code to the subject, so the caller does not get it.
            Check `delivered` to tell that apart from a fault.
        delivered:
          type: string
          enum: [view_bff, email]
          description: |
            The transport actually used (ADR-095 D7). Lets a caller
            distinguish "no `value` because it was emailed" from "no `value`
            because something broke".
        expires_at:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp; TTL = `realms.config.otp_ttl_seconds`.
        purpose: { type: string }
        subject_ref: { type: string }

    OTPViewResponse:
      type: object
      required: [id, value, expires_at, purpose, subject_ref, issuer_user_id]
      properties:
        id: { type: string, format: uuid }
        value: { type: string }
        expires_at: { type: string, format: date-time }
        purpose: { type: string }
        subject_ref: { type: string }
        issuer_user_id:
          type: string
          format: uuid
          description: |
            User-id of the actor that called `/auth/otp/issue`.
            Available on view because the issuer typically re-displays
            their own code in the partner UI.

    OTPVerifyRequest:
      type: object
      required: [subject_ref, purpose, presented]
      properties:
        subject_ref: { type: string }
        purpose: { type: string }
        presented:
          type: string
          description: The OTP value the consumer entered.

    OTPVerifyResponse:
      type: object
      required: [otp_id, issuer_user_id, issued_at, subject_ref, purpose]
      properties:
        otp_id: { type: string, format: uuid }
        issuer_user_id:
          type: string
          format: uuid
          description: |
            Denormalised on the verify response so partner audit logs
            can attribute the action to the issuer without a follow-up
            RealmID query (the matched row may be purged later).
        issued_at:
          type: string
          format: date-time
          description: RFC3339 UTC creation time of the consumed row.
        subject_ref: { type: string }
        purpose: { type: string }

    AccessTokenClaims:
      type: object
      description: |
        Reference shape of the access-token JWT payload. Wire token is
        RS256-signed JWT; this schema documents the claim set the verifier
        returns (`realm.verify`).
      properties:
        iss: { type: string }
        sub: { type: string }
        aud: { type: string }
        iat: { type: integer, format: int64 }
        nbf: { type: integer, format: int64 }
        exp: { type: integer, format: int64 }
        jti: { type: string }
        azp: { type: string }
        tenant_id: { type: string, format: uuid }
        role: { type: string }
        mfa_at:
          type: integer
          format: int64
          description: |
            SPEC §10.4 — unix-seconds timestamp of the most recent successful
            MFA verify against the bearer's session. Omitted when the session
            has no MFA proof. SDK middleware uses this to enforce the
            per-route freshness gate locally.

    LogoutRequest:
      type: object
      properties:
        refresh_token: { type: string }
        all: { type: boolean, default: false }

    StatusOK:
      type: object
      properties:
        status: { type: string, example: ok }

    # ---- identity providers (ADR-046, v0.5.3) ----

    IdentityProvider:
      type: object
      required:
        [id, entity_type, entity_id, provider, client_type, client_id,
         allowed_origins, comments, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        entity_type: { type: string, enum: [realm, tenant] }
        entity_id: { type: string, format: uuid }
        provider:
          type: string
          enum: [google, microsoft, firebase, facebook, apple]
        client_type:
          type: string
          enum: [web, ios, android, desktop, other]
        client_id: { type: string }
        app_id:
          type: string
          format: uuid
          description: |
            The `sources.id` this registration is bound to (ADR-072 §1 /
            § Amendment, app-first registration). Omitted/empty =
            legacy/unrestricted row.
        allowed_origins:
          type: array
          items: { type: string }
          description: |
            Required and validated when `client_type=web`; rejected
            (400) when `client_type` is non-web. Each entry must parse
            as a URL with scheme + host.
        comments: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
          description: |
            Provider-specific PUBLIC config (e.g. the Firebase web
            config: `apiKey`, `authDomain`, `projectId`, `appId`).
            Echoed verbatim on discovery so a browser SDK can bootstrap
            sign-in with no app-side config. All values are publishable —
            never store secrets here. Omitted when empty.
        enabled: { type: boolean }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }

    IdentityProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IdentityProvider' }

    CreateIdentityProviderRequest:
      type: object
      required: [platform_id, provider, client_type, client_id]
      properties:
        platform_id: { type: string, format: uuid }
        tenant_id:
          type: string
          format: uuid
          description: |
            Omit for realm-scoped rows; set for tenant-scoped rows.
            When set, the tenant must belong to `platform_id`.
        provider:
          type: string
          enum: [google, microsoft, firebase, facebook, apple]
        client_type:
          type: string
          enum: [web, ios, android, desktop, other]
        client_id: { type: string }
        app_id:
          type: string
          format: uuid
          description: |
            Optional: bind this registration to a human app/source
            (ADR-072 § Amendment). Must reference a source in the same
            platform (400 `app_not_found` / `app_platform_mismatch`) of
            a human type (400 `app_kind_mismatch` for a bot source).
            Empty/omitted = legacy/unrestricted.
        allowed_origins:
          type: array
          items: { type: string }
        comments: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
          description: |
            Provider-specific PUBLIC config (e.g. the Firebase web
            config: `apiKey`, `authDomain`, `projectId`, `appId`).
            Echoed verbatim on discovery. All values are publishable —
            never store secrets here.

    PatchIdentityProviderRequest:
      type: object
      description: |
        Sparse update. At least one of `enabled`, `client_id`,
        `allowed_origins`, `comments`, `config`, `app_id` must be
        supplied. Supplying `config` replaces the whole config map.
      properties:
        enabled: { type: boolean }
        client_id: { type: string }
        app_id:
          type: string
          format: uuid
          description: |
            Re-bind (or, with `""`, clear) the row's app binding
            (ADR-072 § Amendment). Omitted = leave unchanged. A non-empty
            value is validated like create (400 `app_not_found` /
            `app_platform_mismatch` / `app_kind_mismatch`).
        allowed_origins:
          type: array
          items: { type: string }
        comments: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
          description: |
            Provider-specific PUBLIC config. Replaces the stored map
            wholesale (not merged). Publishable values only.

    PublicIdentityProvider:
      type: object
      required: [type, client_type, client_id]
      properties:
        type:
          type: string
          enum: [google, microsoft, firebase, facebook, apple]
        client_type:
          type: string
          enum: [web, ios, android, desktop, other]
        client_id: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
          description: |
            Provider-specific PUBLIC config (e.g. the Firebase web
            config). Present only when non-empty; lets a browser SDK
            bootstrap sign-in with no app-side config.

    PublicIdentityProviderResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/PublicIdentityProvider' }

    # ---- platforms ----

    ClaimDomainRequest:
      type: object
      required: [domain]
      properties:
        domain: { type: string, example: automahn.com }

    ClaimDomainResponse:
      type: object
      properties:
        domain: { type: string }
        status: { type: string, enum: [pending, verified] }
        dns_record_name: { type: string, example: _realmid-verification.automahn.com }
        dns_record_value: { type: string }

    PendingDomain:
      type: object
      description: |
        A pending domain claim as listed by `GET /domains/pending` — the
        claim response shape plus created/expiry timestamps (unix seconds).
      properties:
        domain: { type: string }
        status: { type: string, enum: [pending] }
        dns_record_name: { type: string, example: _realmid-verification.automahn.com }
        dns_record_value: { type: string }
        created_at: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64 }

    VerifyDomainRequest:
      type: object
      required: [domain]
      properties:
        domain: { type: string }

    ImportUsersRequest:
      type: object
      required: [users]
      properties:
        users:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/ImportUserRow' }
    ImportUserRow:
      type: object
      required: [role]
      description: At least one of `email`/`phone` is required.
      properties:
        user_id:
          type: string
          format: uuid
          description: |
            Optional. When present it becomes `users.id` (bring-your-own,
            reconciles if it already exists in THIS tenant, rejects the file if
            it exists in another). When absent a UUIDv7 is minted and returned.
        email: { type: string }
        phone: { type: string, description: E.164 (leading '+') }
        role:
          type: string
          description: Validated against the realm catalog; `owner`/`platform_api` rejected.
        display_name: { type: string }
        provider:
          type: string
          enum: [google, microsoft, apple, facebook, firebase]
          description: With `provider_uid`, writes an exact first-SSO binding.
        provider_uid: { type: string }
        created_at:
          type: string
          format: date-time
          description: |
            Optional RFC3339 "member since" timestamp (ADR-073 C.4); absent ⇒
            import-time. `invalid_created_at` on a malformed value.
    InlineOwner:
      type: object
      description: |
        Seats a tenant's owner inline at create (ADR-073 Amendment C.2). At
        least one of `email`/`phone` is required. There is deliberately NO
        `role` — the owner is provisioned with the dormant `member` role
        (ADR-076: ownership is the `owner_user_id` pointer, not the role name);
        the owner's real app-role, if any, arrives via the roster import that
        reuses the same `user_id`.
      properties:
        user_id:
          type: string
          format: uuid
          description: Optional bring-your-own owner id; absent ⇒ minted.
        email: { type: string }
        phone: { type: string, description: E.164 (leading '+') }
        display_name: { type: string }
        provider:
          type: string
          enum: [google, microsoft, apple, facebook, firebase]
          description: With `provider_uid`, writes the owner's exact first-SSO binding.
        provider_uid: { type: string }
    ImportUsersResponse:
      type: object
      properties:
        committed:
          type: boolean
          description: false → validation rejected the file; nothing was written.
        imported: { type: integer }
        updated: { type: integer }
        failed: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              line: { type: integer, description: 1-based row index }
              user_id: { type: string, description: bring-your-own or minted-and-returned }
              identifier: { type: string }
              status: { type: string, enum: [created, updated, failed, ok] }
              error: { type: string }
              error_hint: { type: string }

    CreatePlatformRequest:
      type: object
      required: [display_name, slug]
      properties:
        display_name: { type: string }
        domain:
          type: string
          description: |
            Optional custom apex (ADR-073 Release A). Omit to create a
            domainless platform whose routing domain is
            `<slug>.realmid.dev`. When supplied it must be a caller-owned
            verified domain (`412 domain_not_verified` otherwise).
        slug:
          type: string
          description: |
            URL-safe globally-unique identifier. Used to derive the
            auto-bound RealmID-hosted login surface
            `<slug>.realmid.dev` (a `domain_mappings` row is inserted at
            create time, sharing the apex's verification_id since RealmID
            owns the realmid.dev zone). Format: 1–63 chars, lowercase
            ASCII letters, digits, and hyphens, no leading/trailing
            hyphen. The following names are reserved for first-party
            RealmID surfaces and rejected with `409 reserved_slug`:
            `console`, `app`, `auth`, `api`, `www`, `status`, `admin`.

    CreatePlatformResponse:
      type: object
      properties:
        platform_id: { type: string, format: uuid }
        admin_tenant_id: { type: string, format: uuid }
        domain: { type: string }
        slug: { type: string }
        hosted_login_domain:
          type: string
          description: |
            Auto-bound `<slug>.realmid.dev` subdomain. Empty when the
            partner's apex is itself under `realmid.dev` (in which case
            the apex bind already covers the hosted login surface).
        platform_api_user_id:
          type: string
          format: uuid
          description: |
            ADR-041 — bot user provisioned in the new admin tenant. Backs
            every API key minted for this realm by default. Pass this id
            (or another platform_api/owner user in the admin tenant) as
            user_id on POST /platforms/{id}/api-keys to bind a key.

    PlatformInvite:
      type: object
      required: [email]
      properties:
        email: { type: string }
        role: { type: string, enum: [owner, member], default: owner }

    # ---- tenants / realms / config ----

    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        realm_id: { type: string, format: uuid }
        display_name: { type: string }
        status: { type: string, enum: [active, suspended, deactivated] }
        config:
          $ref: '#/components/schemas/TenantConfig'
        owner:
          allOf: [{ $ref: '#/components/schemas/User' }]
          nullable: true
          description: |
            Inline owner of this tenant (role=owner). Populated on list
            responses (`GET /tenants`, `GET /platforms/{pid}/tenants`) so
            admin UIs avoid an N+1 fan-out, and on `GET /tenants/{id}` (one
            lookup, so no fan-out concern). `null` when no owner is seated yet (e.g., a freshly
            minted admin tenant before the invite is accepted).
        users_count:
          type: integer
          description: |
            Dashboard rollup column. The tenant's FULL roster size — every
            `users` row in the tenant regardless of `status` (active, invited,
            suspended, deactivated) or `kind` (human, service), so it matches
            the count the org's own Users page shows.

            Populated ONLY on `GET /platforms/{pid}/tenants`, where one
            realm-scoped aggregate covers the whole page. **Absent** (not `0`)
            on every other surface — render an absent value as unknown.
        last_activity_at:
          type: integer
          format: int64
          description: |
            Dashboard rollup column, unix seconds. `MAX(audit_log.occurred_at)`
            for this tenant — the same definition `last_activity_at` uses at
            platform scope on `GET /admin/platforms`. Reflects AUDITED events
            only (an org whose users merely sign in without triggering an
            audited action will not move it).

            Populated on `GET /platforms/{pid}/tenants` and on
            `GET /tenants/{id}`, and **absent** when the tenant has never had
            an audited event — render absent as unknown, never as the epoch.
        member_count:
          type: integer
          description: |
            People currently on this tenant's roster: `users` rows with
            `kind='human'` AND `status <> 'invited'`.

            A DEACTIVATED member IS counted — they are still on the roster and
            still administrable. An INVITED row is NOT: an invitation is an
            offer, not a membership. A `kind='service'` row is not counted at
            all — a bot is not a member of a team.

            This is deliberately not derivable from `users_count`, which is
            every row regardless of status or kind and therefore already
            contains every pending invitation and every service account.

            Populated ONLY on `GET /tenants/{id}`, computed best-effort:
            **absent** (not `0`) when the aggregate could not be computed, so
            render an absent value as unknown. It exists on this endpoint
            because a platform owner may READ one of their orgs
            (`authorizeTenantRead` has a parent branch) but may NOT read its
            user roster (`GET /tenants/{id}/users` does not) — ADR-067. The
            aggregate is what that persona can be shown.
        pending_invitation_count:
          type: integer
          description: |
            `users` rows in this tenant with `status='invited'` — the exact
            precondition the accept/reject endpoints enforce.

            Same surface and same absent-vs-zero contract as `member_count`
            above. `member_count` and `pending_invitation_count` are disjoint
            by construction and both are subsets of `users_count`.

    TenantConfig:
      type: object
      properties:
        mfa_policy:
          type: string
          enum: [off, opt_in, required_for_all]
        signup_mode:
          type: string
          enum: [closed, allowlist, open]
          description: |
            ADR-045 auto-provisioning policy:
              - `closed`    invitation-only; domain grants ignored.
              - `allowlist` first-time login matches when the verified email
                            domain has an ACTIVE, proven `tenant_domains`
                            grant for this tenant (ADR-094 D10). A tenant
                            with no such grant matches nobody — a legal,
                            fail-closed state, since a grant can be revoked
                            or fail re-verification with no write here.
              - `open`      every authenticated user is provisioned (incl.
                            phone-only). Allowed only on the base realm's
                            admin tenant; rejected at config-write time
                            on every other tenant.

    TenantPatch:
      type: object
      properties:
        display_name: { type: string }
        status: { type: string, enum: [active, suspended, deactivated] }

    TenantConfigPatch:
      type: object
      description: Allowlist — unknown keys return 400 `unknown_config_key`.
      properties:
        mfa_policy: { type: string, enum: [off, opt_in, required_for_all] }
        signup_mode:
          type: string
          enum: [closed, allowlist, open]
          description: |
            Auto-provisioning policy (ADR-045). One write-time invariant
            remains:
              - `open` is rejected on every tenant other than the base
                realm's admin tenant (`signup_mode_invalid_for_tenant`).

            **BREAKING (ADR-094 R3):** `allowed_domains` is no longer a key
            here and now returns 400 `unknown_config_key`. The domains that
            drive auto-provisioning are `tenant_domains` grants, claimed and
            proven through `/platforms/{pid}/tenants/{tid}/domains` — a
            settable allowlist required no proof of control, which is what
            let a domain confer access nobody had demonstrated. The two
            domain invariants went with the column: a grant can be revoked,
            or fail re-verification, without any write to `signup_mode`, so
            enforcing them here would have refused a state the system
            reaches on its own.
        role_overrides:
          type: array
          items: { type: string }
          description: |
            Org-governance (roles overhaul): the set of realm-role names this
            org (tenant) has DISABLED for itself. Disable-only — an org can
            hide a role the platform defined but cannot create or re-enable
            roles. Each name must exist in the realm catalog; `owner` is
            rejected. Replaced wholesale on every patch. The org's effective
            role set = enabled realm roles minus this list.
        default_invitation_role:
          type: string
          description: |
            Org-level default invitation role, overriding the realm default
            when set. Must be an enabled realm role that is not in
            `role_overrides` and is not `owner`. Empty string clears it (falls
            back to the realm default).

    SSODomainGrant:
      type: object
      description: |
        One row of `tenant_domains` (ADR-094): an organization's grant to
        auto-provision users from an email domain, together with the evidence
        backing it.
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        domain:
          type: string
          description: |
            Normalized lowercase hostname. Subdomains are SEPARATE entities and
            match exactly (D13) — a grant on `acme.com` does not cover
            `eng.acme.com`. This deliberately differs from ADR-049 routing,
            where a verified apex covers its subdomains; two rules coexist for
            two purposes, and harmonizing them would silently widen SSO.
        method:
          type: string
          enum: [dns_txt, html_file, meta_tag, platform_approval, self_asserted]
        status:
          type: string
          enum: [claimed, pending, active, suspended, rejected, revoked, failed]
          description: |
            Only `active` provisions. `suspended` is recoverable and is what the
            D9 resolution ladder and org soft-delete leave behind; `failed` is a
            proven grant whose re-check failed for 7 consecutive days, which is
            what releases the domain to a challenger.
        verified:
          type: boolean
          description: |
            TRUE only for REAL proof. Derived from `verified_at`, never from
            `status` or `method`, so an approved or self-asserted grant can
            never read as proven. A schema CHECK enforces the same thing at the
            storage layer.
        verified_at: { type: string, format: date-time, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        rejected_reason: { type: string, nullable: true }
        requested_at: { type: string, format: date-time }
        last_checked_at: { type: string, format: date-time, nullable: true }
        check_failing_since:
          type: string
          format: date-time
          nullable: true
          description: |
            When the current run of consecutive re-check failures began; cleared
            on the first success. The grant goes `failed` 7 days after this.
        cooldown_until:
          type: string
          format: date-time
          nullable: true
          description: Re-requesting this domain is refused until this passes.
        created_at: { type: string, format: date-time }

    RealmConfigPatch:
      type: object
      description: Allowlist — unknown keys return 400 `unknown_config_key`.
      properties:
        concurrent_session_limit:
          type: integer
          minimum: 0
          description: |
            ADR-092 D1/D2. Live tenant-scoped sessions allowed per membership;
            `0` means unlimited. A DEFAULT, not a cap — `realm_roles.
            concurrent_session_limit` overrides it in BOTH directions.

            **The login mechanism does not decide concurrency.** The gate sits
            in `mintAccessTokenWithBroker`, the single choke point every
            tenant-scoped access token passes through, so it applies to
            `grant_type=otp` and service-account logins exactly as it does to
            provider-token logins. There is no per-grant exemption.

            Machine principals are handled at CONFIG time, not exempted at mint
            time: setting a limit on a role whose `assignable_to` includes
            `service` is refused with `session_limit_not_allowed_for_service_role`,
            because N pods logging in as one bot are one user row and a limit
            there turns a rolling deploy into an outage.

            A renewal is never refused — the check asks whether admitting this
            session would push the membership over, so a refresh of an existing
            (jti, tenant) mint is always allowed.
        invitation_acceptance:
          type: string
          enum: [auto, explicit]
          default: auto
          description: |
            ADR-095 D2. How an invitation into a tenant in this realm becomes a
            live membership.

            `auto` (the default, and what every realm did before ADR-095) flips
            the invited membership to active on the invitee's next sign-in
            ANYWHERE in this realm, with no prompt. That makes an invitation a
            unilateral cross-tenant membership grant — fine for a platform whose
            invitees are expected, wrong for one where a person can be pulled
            into several customer orgs.

            `explicit` requires the invitee to accept via
            `POST /me/invitations/{tenantId}/accept` (or decline via the
            `/reject` sibling). Until they do, the membership stays
            `status='invited'` and is surfaced on `GET /me` with
            `pending_first_signin: true`.

            **Exception (D3):** even in `explicit` mode, an invitation
            auto-accepts when it is the invitee's ONLY membership in the realm.
            That case is invite-only onboarding rather than a cross-org grant,
            and refusing it would strand a first-time invitee with no console on
            which to accept the invitation that would give them one.

            An ABSENT value means `auto`. Changing the mode affects invitations
            not yet accepted; it never retroactively un-joins anyone.
        single_tenant_membership:
          type: boolean
          description: |
            ADR-092 D4. When true a person may belong to at most ONE tenant in
            this realm. Default false.

            Counts ACTIVE memberships only — an invitation is a users row with
            status='invited', and a suspended row is what the D5 picker leaves
            behind; treating either as a violation would contradict D5, which
            deliberately lets a user keep and decline their invites.

            Does NOT apply to the base realm or to a realm's admin tenant: a
            platform's admin tenant lives in the base realm while its orgs live
            in the platform realm (ADR-015/ADR-067), so staff legitimately span
            both.

            Turning it ON is permitted even while users still hold two active
            memberships; the D5 picker drains them at each next login. Read
            `single_tenant_pending_reconciliation` on GET /platforms/{id}/config
            to see how many are still outstanding — a user who never logs in
            never resolves.

            A conflicting membership is an ERROR, never an automatic move. Every
            ADMINISTERED membership-creating path refuses with `409
            single_tenant_membership` and the user must leave their current
            organization first: `POST /tenants/{id}/invitations`,
            `POST /platforms/{pid}/tenants` (the inline owner), and
            `PUT /tenants/{id}/owner`. Bulk import
            (`POST /tenants/{id}/users/import`) reports the same code per row,
            which rejects the whole file (uniform-200, no 409).

            JIT / domain auto-provisioning at `POST /auth/login` is the one path
            with no operator on it: the second membership is simply NOT CREATED
            and the login SUCCEEDS on the membership the user already holds.
            Failing it would lock a compliant user out of their own org because
            another org proved their email domain — and per D5 a domain-eligible
            org is not an active membership and violates nothing. The refusal is
            audited as `user.auto_provision_refused`.
        session_eviction_policy: { type: string, enum: [reject] }
        access_ttl_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Per-realm override for access-token TTL. Omit = 15m default.
        refresh_ttl_seconds:
          type: integer
          minimum: 1
          maximum: 15552000
          description: Per-realm override for refresh-token TTL. Omit = 30d default.
        max_user_session_lifetime_seconds:
          type: integer
          minimum: 3600
          maximum: 31536000
          description: |
            ADR-058 — hard upper bound on a **user** session's total
            lifetime, measured from first login (not from the latest
            refresh). Refresh-token `expires_at` is additionally capped at
            `created_at + max_user_session_lifetime_seconds`, so even a
            continuously-refreshing session terminates and forces a full
            re-login — there is no infinite session. Independent of
            `refresh_absolute_expiry` mode. Applies to user sessions only;
            service/platform (M2M) sessions are exempt. Omit = service
            default (30d). The cap cannot be disabled, only tuned within
            [1h, 365d].
        idle_ttl_seconds:
          type: integer
          minimum: 0
          description: |
            ADR-070 — per-realm idle (inactivity) session timeout, in seconds.
            After this many seconds without activity a user's BFF session is
            force-logged-out (a sliding window that resets on each request).
            Enforcement lives in the BFF; the issuer only stores this value and
            emits it as the `idle_ttl` duration on login/token/refresh
            responses. `null` / `0` / omitted = **disabled** (the default;
            fully backward compatible). When set, must be `>= 300` (5 min) and
            must not exceed the realm's effective `refresh_ttl_seconds` (idling
            out after the refresh token has already died is meaningless) —
            values outside that band return 400 `invalid_config_value`.
        challenge_ttl_seconds:
          type: integer
          minimum: 1
          maximum: 1800
          description: Per-realm override for MFA/revocation challenge TTL. Omit = 5m default.
        platform_token_ttl_seconds:
          type: integer
          minimum: 1
          maximum: 900
          description: |
            Per-realm override for the platform access-token TTL
            minted by `POST /auth/login` with
            `grant_type=platform_api_key` (ADR-051; SDK SPEC §4.0).
            Omit = 5m default; hard cap = 15m. Used by the SDK's
            platform session manager.
        access_token_custom_claim_keys:
          type: array
          items: { type: string }
          description: |
            Allowlist of partner-supplied claim keys honoured by
            POST /auth/token's `custom_claims` (SDK SPEC §4.2). Reserved
            JWT claim names (iss, sub, aud, iat, nbf, exp, jti, azp,
            tenant_id, role, mfa_at, amr, scope, token_class) always win,
            and a request naming one is now REFUSED with 400
            `reserved_claim_key` rather than dropped (ADR-097 D3 — the list
            this sentence used to carry was hand-maintained and had already
            drifted, omitting `mfa_at` and `amr`). Any request key not in
            this allowlist returns 400 `bad_request`. Empty / unset = no
            custom claims accepted.
        service_refresh_rotates:
          type: boolean
          description: |
            ADR-051 (v0.7.0). When `false` (default), service
            refresh tokens issued by `POST /auth/login` with
            `grant_type=api_key` are multi-use until expiry — no
            rotation, no reuse-detection. When `true`, service
            refresh tokens are single-use; `POST /auth/token`
            rotates them and runs the user-style reuse-detection
            lifecycle (ADR-031). Service refresh TTL reuses
            `refresh_ttl_seconds`. Default `false` matches today's
            "M2M tokens are essentially single-shot" posture.
        service_refresh_ttl_seconds:
          type: integer
          minimum: 300
          maximum: 15552000
          description: |
            ADR-071 §6 — platform default refresh TTL for **ClassService**
            (service-account) sessions, in seconds [300, 180d]. `0`/absent
            falls back to `refresh_ttl_seconds` at mint time.
        service_refresh_ttl_max_seconds:
          type: integer
          minimum: 300
          maximum: 15552000
          description: |
            ADR-071 §6 — platform ceiling a per-org service-TTL override
            cannot exceed, in seconds [300, 180d].
        mfa_session_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          description: |
            Realm-wide default MFA freshness window (SPEC §10.4). The SDK
            middleware reads this via `realm.info()` to pick a default
            `maxAgeSeconds` for routes that don't override it. Suggested 900
            (15 min). Server does not directly enforce — SDK middleware does.
        default_invitation_role:
          type: string
          description: |
            Per ADR-040 §5: role new invitations land in when the caller
            doesn't pass one. Must reference a name in the realm's
            /platforms/{id}/roles catalog; cannot be `owner`. Falls back to
            `member` when unset or stale. Owner-editable.
        signing_key_rotation_mode:
          type: string
          enum: [auto, manual]
          description: |
            Scheduled signing-key rotation policy (roles/signing-keys overhaul).
            `auto` (default when unset) rotates on `signing_key_rotation_interval`;
            `manual` disables scheduled rotation (keys only rotate on an explicit
            `POST /platforms/{id}/signing-keys/rotate`).
        signing_key_rotation_interval:
          type: string
          enum: ['1w', '1mo', '1y']
          description: |
            Auto-rotation cadence. Empty falls back to the worker default (the
            base/RI realm keeps a short internal cadence; customer realms default
            to `1w` in the console). Ignored when `signing_key_rotation_mode` is
            `manual`.
        mfa_policy:
          type: string
          enum: [disabled, enabled, enforced]
          description: |
            ADR-075 — **platform-level** MFA floor, layered on top of the
            per-org `TenantConfig.mfa_policy`. Distinct from that per-org key
            (which is `off`/`opt_in`/`required_for_all`). Values:
            `disabled` (or omitted) — no platform floor; org policy governs
            (default, backward-compatible). `enabled` — UI-hint only; MFA is
            surfaced as recommended but carries **no** server-side effect (an org
            may still opt out). `enforced` — MFA is required across **every** org
            regardless of the per-org policy, and an unenrolled user is pushed
            into first-login enrollment (ADR-061). Only `enforced` changes
            request-path behavior. Surfaced on `realm.info()` / GET
            /platforms/mine.
        accept_provider_mfa:
          type: boolean
          description: |
            ADR-078 — when true, a login token that carried a provider-native
            MFA proof (google/microsoft/firebase only) satisfies the GENERIC MFA
            requirement (the ADR-075 floor + org policy) for that session,
            removing the double-challenge for federated users. It NEVER satisfies
            a role's `required_mfa_methods`. Default false = fail-closed (RI always
            challenges). Surfaced on GET /platforms/mine.
        provider_mfa_ttl_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: |
            ADR-078 §6 — re-MFA window for provider-sourced satisfaction. `0`
            (default) = valid for the whole session (still bounded by the session
            TTL). `>0` = a session whose provider MFA was proven longer ago than
            this no longer satisfies a step-up ("specific operation") check — the
            user must re-MFA (RI challenge if enrolled, else re-login).
        otp_length:
          type: integer
          minimum: 4
          maximum: 10
          description: |
            Length (in digits) of OTP values minted by `/auth/otp/issue`.
            Default 6. Per-realm only — per-call override is rejected to
            avoid security erosion.
        otp_ttl_seconds:
          type: integer
          minimum: 30
          maximum: 600
          description: |
            Time-to-live (seconds) for OTPs minted by `/auth/otp/issue`
            and the Redis-backed plaintext cache backing `GET /auth/otp/{id}`.
            Default 60.
        otp_login_enabled:
          type: boolean
          description: |
            Gates `POST /auth/login` with `grant_type=otp` (the
            single-factor "manager hands SA an OTP, SA types phone +
            OTP" flow — see `LoginRequestOTP`). `grant_type` is the
            RFC 6749 credential-exchange parameter; the OTP login has
            no `method` field. Default false.
        otp_mfa_enabled:
          type: boolean
          description: |
            Gates `POST /auth/mfa/verify` with `method=otp`
            (two-factor: first-factor login → manager-issued OTP as
            second factor). Default false. Per-user activation also
            requires the user (or one of the user's role assignments)
            to be enrolled in `otp` — see `users.mfa_methods`
            and `roles.required_mfa_methods`.

        # ---- ADR-094 D4: per-org domain SSO -------------------------------
        domain_sso:
          type: object
          description: |
            ADR-094 per-org domain-SSO standard, grouped as ONE nested object
            rather than two flat siblings, per the convention `user_api_keys`
            below also follows.

            **PATCH semantics are MERGE** — send one sub-key and the other is
            left alone. (The stored object is then replaced wholesale, but the
            handler fills the omitted field from the current value first, so a
            partial patch never silently resets the other half.)

            `evidence` — how much proof activates a grant:

            * `dns_required` (DEFAULT) — only DNS/file/meta proof activates.
            * `platform_approved` — the platform owner may additionally attest.
            * `self_asserted` — an org's own unverified claim activates.

            Proof is ALWAYS accepted, at every level; the setting only decides
            how far BELOW proof the platform is willing to go.

            `uniqueness` — may one domain back more than one org:

            * `exclusive` (DEFAULT) — at most one active grant per domain.
            * `shared` — several orgs may hold it.

            `shared` is refused with `409 incoherent_domain_policy` while the
            realm also sets `single_tenant_membership`: a shared domain offers
            several candidate orgs to a new user while single-tenant membership
            admits exactly one, so the assignment would fall out of candidate
            ORDER — arbitrary org capture, for every new user, with nothing to
            make anyone notice.

            An ABSENT or partially-set object reads back as the STRICT defaults,
            never as empty strings. Forgetting to configure must not be the
            permissive path.
          properties:
            evidence:
              type: string
              enum: [dns_required, platform_approved, self_asserted]
            uniqueness:
              type: string
              enum: [exclusive, shared]

        # ---- ADR-084 §10: user API keys (end-user keys) -------------------
        user_api_keys:
          type: object
          description: |
            ADR-084 end-user-API-key settings, grouped as ONE nested object
            rather than a dozen `user_api_key_*` siblings. Governs **user**
            keys only — the platform-bot key's lifecycle is ADR-085 and its
            login switch is `platform_api_key_login_enabled` below.

            **PATCH semantics are MERGE**: an omitted sub-key leaves the stored
            value alone. This deliberately differs from
            `refresh_absolute_expiry`, which replaces wholesale because its
            fields are one coherent policy where a partial update is ambiguous;
            these knobs are independent, so resetting eleven of them because
            the caller patched the twelfth would be a footgun.

            An unknown sub-key is rejected with `unknown_config_key` qualified
            by the dotted path (e.g. `user_api_keys.enabld`) — silently
            ignoring it would let a typo look like a successful write.
          properties:
            enabled:
              type: boolean
              description: |
                Master switch. Default **false**: the feature is opt-in per
                realm. While false every
                `/tenants/{tid}/users/{uid}/user-api-keys` call returns
                `412 user_api_keys_disabled`.
            max_active:
              type: integer
              minimum: 1
              maximum: 100
              description: |
                Maximum **active** keys per user — active meaning neither
                revoked nor expired, so revoked and expired rows do not consume
                slots. Default 5. `409 too_many_active_keys` at the limit.

                Per ADR-084 §6 this is a **per-partition** quota, not
                per-person: cross-tenant identity is an equivalence induced by
                approved `contact_verifications` `(method, provider_uid)`
                tuples — the IdP account, not the email address — so two IdP
                accounts for one human are two identities by design (ADR-080's
                anti-takeover posture) and each carries its own quota.
            max_ttl_seconds:
              type: integer
              minimum: 300
              maximum: 31536000
              description: |
                Hard ceiling on a key's TTL, applied at mint; above it returns
                `400 ttl_exceeds_max`. Default 7776000 (90d).
            default_ttl_seconds:
              type: integer
              minimum: 300
              maximum: 31536000
              description: |
                TTL applied when a mint request omits `ttl_seconds`. Default
                2592000 (30d). **Not** cross-validated against `max_ttl_seconds`
                at PATCH time — both can arrive in one body in either order, so
                a pairwise check would be order-dependent. The mint path clamps
                default to max instead, which is the only place both values are
                known for certain.
            allow_non_expiring:
              type: boolean
              description: |
                When false (default) a key must carry an expiry; requesting a
                non-expiring key returns `400 non_expiring_not_allowed`. A
                permanent user credential should be a conscious realm-level
                decision, not what you get by omitting a field.
            org_scope_default:
              type: string
              enum: ["", selected, all]
              description: |
                ADR-084 §6 — `org_scope` used when a mint request omits it.
                `selected` (default) pins the key to a **frozen** allowlist of
                org ids, defaulting to just the user's current org; memberships
                acquired later do **not** widen the key. Setting this to `all`
                still requires `allow_all_orgs`.
            allow_all_orgs:
              type: boolean
              description: |
                ADR-084 §6 — gates `org_scope=all`, default **false**. `all`
                means "every org in this realm the user belongs to, now *and in
                future*", resolved fresh at every exchange rather than
                snapshotted (a snapshot would mean "all orgs as of Tuesday",
                which is neither thing a user could mean). It is the one mode
                that widens with no human in the loop — hence its own opt-in,
                and the requirement that the mint UI label it
                forward-inclusive. `400 all_orgs_not_allowed` when false.
            max_permission_strings:
              type: integer
              minimum: 1
              maximum: 256
              description: |
                Cap on the number of entries in `permissions_cap`. Default 32;
                `400 too_many_permissions` above it.
            max_permission_string_len:
              type: integer
              minimum: 1
              maximum: 1024
              description: |
                Cap on the length of one `permissions_cap` entry. Default 128.
                Shape validation only — for a partner audience the strings are
                opaque to RealmID (ADR-084 §7.2).
            require_mfa_at_mint:
              type: boolean
              nullable: true
              description: |
                ADR-084 §8 — makes minting a step-up operation
                (`RequireMFAOpts(mintPath, {RequireFresh: true})`), answering
                `412 mfa_required` with a challenge.

                **Defaults to ON**: `null` (never configured) means required
                whenever the realm has MFA *enabled* — not merely enforced. So
                `null` and `false` differ: `false` is an explicit downgrade.
                That is why this is nullable rather than a plain boolean, which
                could never be turned off.

                This is one mechanism with §8.1's floor exemption: a key
                exchange *is* a login, and in a realm with a mandatory MFA floor
                a headless script can never present TOTP. So key exchange is
                exempt from the realm MFA floor **if and only if** MFA was
                proven at mint (`minted_mfa_at IS NOT NULL`). Weakening this
                knob therefore weakens the exemption's justification, not just
                the mint.
            org_admin_visible:
              type: boolean
              nullable: true
              description: |
                Whether an org admin holding `user_api_keys:read` may see (and
                with `user_api_keys:manage`, revoke) their members' keys.
                **Defaults to ON** — `null` = never configured = visible;
                `false` hides the surface. Nullable for the same reason as
                above.

        # ---- ADR-057 Amendment A.1 / ADR-085 §5 --------------------------
        platform_api_key_login_enabled:
          type: boolean
          nullable: true
          description: |
            Gates `POST /auth/login` with `grant_type=platform_api_key` for this
            realm. **Defaults to ON** (`null` = never configured = enabled), so
            nothing changes for an existing realm.

            Setting it false is what lets a realm that has completed its ADR-057
            WIF migration go keyless **and mean it**: WIF's whole value is that
            no long-lived secret sits in the deployed service, which is void if
            a forgotten key still authenticates. The flip is
            base-realm-staff-only in both directions; PATCHing it to `false`
            while the realm still holds an ACTIVE platform key returns
            `409 active_api_keys_exist` — **revoked and expired keys do not
            block**, since they already authenticate nothing. Re-enabling is
            never blocked.

            Enforcement is at `POST /auth/login`: while `false`, a
            `grant_type=platform_api_key` call returns
            `403 platform_api_key_login_disabled`. 403 rather than 401 because
            the credential is not what is wrong — the realm's policy is, and a
            401 would send a client into a pointless re-auth loop.

            Because the flip requires zero active keys, no live M2M session can
            survive it: the keys behind those sessions must be revoked first,
            and the ADR-085 §4 refresh re-check then kills the sessions.

            The staff-only rule is enforced *inside* the config handler; the
            handler's outer gate accepts base-realm staff as an alternative to
            `platform:config`, without which this knob would be unsettable on
            any partner realm.
        refresh_absolute_expiry:
          type: object
          description: |
            ADR-054 — scheduled absolute expiry for refresh tokens. Object
            `{mode, daily_cutoff_local, timezone}`. `mode="rolling"` (or
            omitted) preserves rolling-TTL behaviour and ignores the other
            two fields. `mode="scheduled"` forces every refresh token in the
            realm to expire at the next daily cutoff and requires both a
            valid `daily_cutoff_local` (HH:MM, 00:00..23:59) and IANA
            `timezone`. The emitted `refresh_exp` (SPEC §4.1) is the min of
            the rolling TTL, this scheduled cutoff, and the ADR-058
            max-user-session-lifetime cap.
          properties:
            mode:
              type: string
              enum: [rolling, scheduled]
              default: rolling
            daily_cutoff_local:
              type: string
              description: Local wall-clock cutoff HH:MM (00:00..23:59). Required when mode=scheduled.
              example: "03:30"
            timezone:
              type: string
              description: IANA timezone name for daily_cutoff_local. Required when mode=scheduled.
              example: Asia/Singapore
            applies_to_service:
              type: boolean
              default: false
              description: |
                ADR-071 §6 three-class matrix — when `true`, the
                scheduled cutoff also walls **ClassService**
                (service-account) refresh tokens. Default `false`:
                service sessions are exempt (an unattended agent is not
                logged out at the daily wall). ClassPlatform is never
                walled regardless.
        origin_enforcement:
          type: string
          enum: ['', off, required]
          description: |
            ADR-065 — per-realm browser-Origin policy surfaced to the SDK
            middleware via `realm.info()`. Enforcement happens SDK-side, not
            on the server. `""`/`off` = no Origin check; `required` = the SDK
            rejects browser calls whose Origin isn't an allowed realm origin.

    RealmConfigView:
      type: object
      description: |
        Read shape served by GET /platforms/{id}/config. Key-for-key identical
        to `RealmConfigPatch` (a drift test pins the two property sets equal in
        both directions) — semantics, ranges and enums for each key are
        documented there. This schema deliberately omits the write-side enum
        constraints because a never-configured key reads back as the zero value
        (`""` / `0` / `false`), which is not itself a settable enum member.
        Every key is always present; RealmConfig fields with no patch
        counterpart (`suspended_at`, `suspend_reason`) are NOT exposed.
      properties:
        concurrent_session_limit:
          type: integer
          description: |
            See `RealmConfigPatch.concurrent_session_limit`. Applies to every
            tenant-scoped mint regardless of grant type; `0` is unlimited.
        single_tenant_membership: { type: boolean }
        invitation_acceptance: { type: string, enum: [auto, explicit] }
        session_eviction_policy: { type: string }
        access_ttl_seconds: { type: integer }
        refresh_ttl_seconds: { type: integer }
        challenge_ttl_seconds: { type: integer }
        platform_token_ttl_seconds: { type: integer }
        access_token_custom_claim_keys:
          type: array
          items: { type: string }
          description: Always an array, never null. `[]` = no custom claims accepted.
        mfa_session_ttl_seconds: { type: integer }
        default_invitation_role: { type: string }
        origin_enforcement: { type: string }
        otp_length: { type: integer }
        otp_ttl_seconds: { type: integer }
        otp_login_enabled: { type: boolean }
        otp_mfa_enabled: { type: boolean }
        service_refresh_rotates: { type: boolean }
        service_refresh_ttl_seconds: { type: integer }
        service_refresh_ttl_max_seconds: { type: integer }
        max_user_session_lifetime_seconds: { type: integer }
        idle_ttl_seconds: { type: integer }
        signing_key_rotation_mode: { type: string }
        signing_key_rotation_interval: { type: string }
        mfa_policy: { type: string }
        accept_provider_mfa: { type: boolean }
        provider_mfa_ttl_seconds: { type: integer }
        # ADR-084 §10. Always the full object with every sub-key present, same
        # "no key is ever omitted" rule the top level follows. The two nullable
        # booleans default to TRUE, so `null` means "never configured" and
        # therefore ON — NOT the same as `false`, which is an explicit downgrade.
        user_api_keys:
          type: object
          description: |
            ADR-084 end-user-API-key settings. Semantics, ranges and defaults for
            each sub-key are documented on `RealmConfigPatch.user_api_keys`.
          properties:
            enabled: { type: boolean }
            max_active: { type: integer }
            max_ttl_seconds: { type: integer }
            default_ttl_seconds: { type: integer }
            allow_non_expiring: { type: boolean }
            org_scope_default: { type: string }
            allow_all_orgs: { type: boolean }
            max_permission_strings: { type: integer }
            max_permission_string_len: { type: integer }
            require_mfa_at_mint: { type: boolean, nullable: true }
            org_admin_visible: { type: boolean, nullable: true }
        # ADR-094 D4. Always the full object; an unconfigured realm reads back
        # the STRICT defaults (dns_required + exclusive), never empty strings —
        # forgetting to configure must not read as the permissive setting.
        domain_sso:
          type: object
          description: |
            ADR-094 per-org domain-SSO standard. Semantics and enums are
            documented on `RealmConfigPatch.domain_sso`.
          properties:
            evidence: { type: string }
            uniqueness: { type: string }
        platform_api_key_login_enabled: { type: boolean, nullable: true }
        refresh_absolute_expiry:
          type: object
          description: |
            Always the full object; `mode` reads back as `rolling` when unset.
          properties:
            mode: { type: string }
            daily_cutoff_local: { type: string }
            timezone: { type: string }
            applies_to_service: { type: boolean }

    TransferOwnerRequest:
      type: object
      description: |
        ADR-076 §3 DIRECT owner-pointer transfer (this replaced the ADR-063
        propose→accept handshake — there is no pending proposal / accept step).
        `owner_user_id` names the recipient, who must be an ACTIVE existing
        member of THIS tenant (§4 lockout guard). `outgoing_owner_role` is the
        base role the outgoing owner keeps (default `member`); `leave_entirely`
        instead deactivates the outgoing owner.

        **Two caller paths (ADR-087).** The tenant's OWN owner picks a recipient
        by `owner_user_id` from a roster they can read. The G-014 PARENT (a
        platform owner acting on one of their realm's orgs) cannot read that
        roster — ADR-067 keeps `GET /tenants/{id}/users` own-tenant only — so
        they name `new_owner_email`, which is resolved inside the target tenant
        and **PROVISIONED there as an active member if it does not exist**.
        Provisioning happens on the parent path ONLY: on the owner path an
        unmatched email is a typo, and returns `user_not_found`.

        `suspend_outgoing_owner` settles the outgoing owner as `suspended`
        instead of demoting them — chosen over deletion so a mistyped transfer
        stays reversible (ADR-087 §4). Mutually exclusive with `leave_entirely`.
      properties:
        owner_user_id: { type: string, format: uuid, description: Active member of this tenant to make owner. }
        outgoing_owner_role: { type: string, enum: [admin, member, viewer], description: 'Base role the outgoing owner keeps (default member).' }
        leave_entirely: { type: boolean, description: Deactivate the outgoing owner instead of demoting them. }
        new_owner_email: { type: string, description: 'Recipient by email. Canonical for the G-014 parent path, which cannot read the roster; provisioned into the tenant when absent. Used only when owner_user_id is absent.' }
        suspend_outgoing_owner: { type: boolean, description: 'Suspend the outgoing owner (recoverable) instead of demoting them. Mutually exclusive with leave_entirely.' }

    Invitation:
      type: object
      properties:
        id: { type: string }
        identifier: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expires_at: { type: integer, format: int64 }

    ServiceAccount:
      type: object
      description: A kind=service account (ADR-071 §1).
      properties:
        id: { type: string, format: uuid }
        handle: { type: string, description: The email-shaped login handle. }
        role: { type: string }
        status: { type: string, enum: [active, suspended, deactivated] }
        kind: { type: string, enum: [service] }
        display_name: { type: string }
        created_at: { type: string, format: date-time }

    ServiceAccountCreateRequest:
      type: object
      required: [handle]
      properties:
        handle:
          type: string
          description: |
            Email-shaped login handle (must contain `@`). Unique-in-tenant
            (`409` on collision); the platform's responsibility if it picks
            a real person's email (ADR-071 § Residual risk accepted).
        role:
          type: string
          description: |
            Tenant role for the account. Must not be `owner` or
            `platform_api` (ADR-071 §2). Defaults to `member`.
        display_name:
          type: string
          description: Optional; defaults to the handle.

    ServiceAccountResetHandleRequest:
      type: object
      required: [handle]
      properties:
        handle:
          type: string
          description: The new email-shaped login handle (unique-in-tenant).

    Source:
      type: object
      description: >-
        A platform app/source (ADR-072 §1). `allowed_methods` is mapping-2 —
        the login methods this app surfaces.
      properties:
        id: { type: string, format: uuid }
        platform_id: { type: string, format: uuid }
        type: { type: string, enum: [web, android, ios, desktop, bot] }
        label: { type: string }
        allowed_methods:
          type: array
          items: { type: string, enum: [google, microsoft, apple, facebook, firebase, otp] }
        enabled: { type: boolean }
        created_at: { type: integer, format: int64, description: unix seconds }

    SourceList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Source' }

    CreateSourceRequest:
      type: object
      required: [platform_id, type, label]
      properties:
        platform_id: { type: string, format: uuid }
        type: { type: string, enum: [web, android, ios, desktop, bot] }
        label: { type: string }
        allowed_methods:
          type: array
          items: { type: string, enum: [google, microsoft, apple, facebook, firebase, otp] }
          description: >-
            A `bot` source may list only `otp`; a human source may never list
            `otp` (mapping-1 invariant, ADR-072 §0).

    PatchSourceRequest:
      type: object
      description: Sparse update; at least one field required.
      properties:
        label: { type: string }
        allowed_methods:
          type: array
          items: { type: string, enum: [google, microsoft, apple, facebook, firebase, otp] }
        enabled: { type: boolean }

    InvitationCreateRequest:
      type: object
      required: [identifier]
      properties:
        identifier: { type: string, description: email or phone }
        role:
          type: string
          enum: [owner, admin, member, viewer]
          default: member
          description: |
            Tenant role assigned on accept. Defaults to `member` (or the
            org/realm `default_invitation_role` when configured). Only
            owners may invite at `owner`. A role not in the realm catalog
            returns 400 `unknown_role`; a disabled (or org-overridden-off)
            role returns 400 `role_disabled` — there is no `invalid_role`
            code on this endpoint.

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        phone: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        status: { type: string, enum: [active, suspended, invited, deactivated] }
        mfa_methods:
          type: array
          items: { type: string, enum: [totp, otp] }
          description: |
            Per-user MFA enrollment (v0.6.0). When non-empty (or when
            unioned with the user's role's `required_mfa_methods` is
            non-empty), the first-factor login response gates with
            `mfa_required: true` and `methods[]` listing the union.
            TOTP confirm/disable mirrors into this array; `otp`
            entries are added/removed by the partner via the user
            patch surface.

    UserListPage:
      type: object
      description: Paginated list envelope per SDK SPEC §7.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor; empty when no more pages.
        total: { type: integer, nullable: true }

    InvitationListPage:
      type: object
      description: Paginated list envelope per SDK SPEC §7.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
        next_cursor:
          type: string
          nullable: true
        total: { type: integer, nullable: true }

    TenantListPage:
      type: object
      description: Paginated list envelope per SDK SPEC §7.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tenant' }
        next_cursor: { type: string, nullable: true }
        total: { type: integer, nullable: true }

    SessionListPage:
      type: object
      description: Paginated list envelope per SDK SPEC §7.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SessionSummary' }
        next_cursor: { type: string, nullable: true }
        total: { type: integer, nullable: true }

    PlatformSummary:
      type: object
      description: |
        Partner/owner-facing platform shape — the `myPlatformDTO` returned by
        GET /platforms/mine (inside PlatformListPage) and PATCH /platforms/{id}.
        Distinct from `AdminPlatformSummary`, the internal-ops ADR-048 fleet row.

        Field groups: the always-present identity block; the SDK block
        (`public_ref`/`audience`, ADR-064) read via `realm.Info()`; the MFA/origin
        policy block primed by the Settings panes; and the dashboard-enrichment
        block, which is populated ONLY on the multi-identity user path — the cheap
        SDK audience-discovery path omits it so `realm.Info()` stays one lookup.
      properties:
        id: { type: string, format: uuid }
        domain: { type: string }
        admin_tenant_id: { type: string, format: uuid }
        display_name: { type: string }
        public_ref:
          type: string
          description: |
            ADR-064 — the partner-facing platform handle. Omitted on paths that
            don't resolve it.
        audience:
          type: string
          description: |
            ADR-064 — the frozen token audience `realmid:<public_ref>`. This is
            what SDK `Verify` checks the `aud` claim against.
        mfa_session_ttl_seconds:
          type: integer
          description: |
            SPEC §10.4 — realm-wide default MFA freshness window. Future SDK
            versions auto-pick this via `realm.info()`. Omitted = SDK default.
        mfa_policy:
          type: string
          enum: [disabled, enabled, enforced]
          description: |
            ADR-075 — platform-level MFA tri-state (see `RealmConfigPatch.mfa_policy`).
            Surfaced here so the Settings MFA tab can prime the control (see also
            GET /platforms/{id}/config, the full read surface). Omitted = `disabled`.
        accept_provider_mfa:
          type: boolean
          description: |
            ADR-078 — whether an upstream provider's MFA assertion satisfies this
            platform's MFA requirement. Surfaced so Settings→MFA can prime it.
        provider_mfa_ttl_seconds:
          type: integer
          description: ADR-078 — re-MFA freshness window for an accepted provider MFA.
        origin_enforcement:
          type: string
          enum: ["", off, required]
          description: |
            ADR-065 — per-realm browser-Origin policy, read by SDK middleware via
            `realm.Info()` to decide whether to run the confused-deputy guard.
        slug:
          type: string
          description: Dashboard enrichment; omitted on the SDK audience-discovery path.
        status:
          type: string
          enum: [active, suspended, deactivated]
          description: Dashboard enrichment; omitted on the SDK audience-discovery path.
        domains:
          type: array
          items: { type: string }
          description: Dashboard enrichment; omitted on the SDK audience-discovery path.
        tenants_count:
          type: integer
          description: |
            Dashboard enrichment. Present-and-`0` means a genuine zero (e.g. a
            freshly-created platform); OMITTED means "not computed" on this path.
            Clients must distinguish the two — rendering absent as `0` is a bug.
        users_count:
          type: integer
          description: |
            Dashboard enrichment. Same present-`0` vs omitted contract as
            `tenants_count` — absent is "not computed", not zero.

    PlatformListPage:
      type: object
      description: Paginated list envelope per SDK SPEC §7.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PlatformSummary' }
        next_cursor: { type: string, nullable: true }
        total: { type: integer, nullable: true }

    AdminPlatformSummary:
      type: object
      description: |
        Rich GET /admin/platforms row per ADR-048 §1. The base realm is
        omitted from the list. Counts are rolled up server-side; the
        owner sub-object is the platform's owner user inside its admin
        tenant (resolved via tenants.owner_user_id per ADR-076).

        NOTE: distinct from `PlatformSummary` (the partner/owner-facing
        shape returned by GET /platforms/mine and PATCH /platforms/{id}).
        Both schemas were previously named `PlatformSummary`, so this ops
        row silently won every $ref under YAML last-key-wins and the two
        partner endpoints were mis-documented. Do not re-merge them.
      required:
        [id, display_name, slug, status, signup_mode, domains, owner,
         tenants_count, users_count, last_activity_at, created_at]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, suspended, deactivated] }
        signup_mode: { type: string, enum: [closed, allowlist, open, ""] }
        domains:
          type: array
          items: { type: string }
        owner:
          type: object
          required: [user_id, name, email]
          properties:
            user_id: { type: string }
            name: { type: string }
            email: { type: string }
        tenants_count: { type: integer }
        users_count: { type: integer }
        last_activity_at: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }

    AdminPlatformsResponse:
      type: object
      description: Paginated internal-ops platform list; base realm is omitted.
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminPlatformSummary' }
        next_cursor: { type: string, nullable: true }
        total: { type: integer }

    AdminStats:
      type: object
      description: |
        Internal-ops fleet summary (ADR-048 §2, extended for the fleet-health
        strip). Cached in-process for 30 seconds; refreshed lazily on first
        request after expiry.

        Every `platforms_*` count EXCLUDES the base realm — RealmID's own
        control plane is not a partner platform — matching
        `GET /admin/platforms`.
      required:
        [platforms_count, platforms_active, platforms_suspended,
         platforms_new_7d, tenants_count, users_count, sessions_active,
         sessions_24h, events_24h]
      properties:
        platforms_count:
          type: integer
          description: Non-base realms, any status.
        platforms_active:
          type: integer
          description: Non-base realms with `status='active'`.
        platforms_suspended:
          type: integer
          description: |
            Non-base realms with `status='suspended'`. The remainder
            (`platforms_count - active - suspended`) is `deactivated`.
        platforms_new_7d:
          type: integer
          description: Non-base realms created within the trailing 7 days.
        tenants_count:
          type: integer
          description: Non-deleted tenants across those platforms.
        users_count:
          type: integer
          description: Every `users` row across those platforms' tenants.
        sessions_active:
          type: integer
          description: |
            Point-in-time GAUGE — cross-realm count of live (non-revoked,
            non-expired) sessions, ALL classes.
        sessions_24h:
          type: integer
          description: |
            FLOW metric — sessions with `class='user'` **created** in the
            trailing 24 hours, i.e. human interactive sign-ins. Machine
            sessions (service accounts, platform-API bots) are excluded, and a
            token REFRESH does not create a session row, so this is sign-ins,
            not requests.

            Deliberately not named "tokens": the issuer keeps no token-mint
            counter, and a refresh mints an access token without creating a
            session — a "tokens" label would be a number nobody could
            reconcile against any other surface.
        events_24h:
          type: integer
          description: "`audit_log` rows in the trailing 24 hours."

    PlatformMFACoverage:
      type: object
      description: |
        MFA enrollment coverage for a platform, reported as its raw parts so a
        client can render "8 of 40" rather than only a rounded percentage.
      required: [covered_users, eligible_users, percent]
      properties:
        eligible_users:
          type: integer
          description: |
            DENOMINATOR — users across this platform's tenants with
            `status='active'` **and** `kind='human'`. An invited, suspended or
            deactivated user cannot be asked to enroll, and a service account
            (ADR-071 `kind='service'`) cannot hold an authenticator at all, so
            neither belongs in the denominator.
        covered_users:
          type: integer
          description: |
            NUMERATOR — the subset of `eligible_users` holding a `user_mfa` row
            with `confirmed_at IS NOT NULL`. A STARTED-but-unconfirmed
            enrollment does NOT count. ADR-078 provider-native MFA acceptance
            does NOT count either: that is a per-session proof, not enrollment
            state, so a platform relying on it will legitimately read 0%.
        percent:
          type: number
          format: double
          nullable: true
          description: |
            `covered_users / eligible_users * 100`, rounded to one decimal.
            `null` when `eligible_users == 0` — there is no coverage of an
            empty population, and `0` would misread as "nobody has MFA".

    PlatformStats:
      type: object
      description: |
        Per-platform KPI rollup for the admin console's platform overview.
        Cached in-process for 30 seconds per platform.
      required:
        [platform_id, generated_at, orgs_count, users_count, sessions_24h,
         mfa_coverage]
      properties:
        platform_id: { type: string, format: uuid }
        generated_at:
          type: integer
          format: int64
          description: |
            Unix seconds at which these numbers were computed. May be up to 30
            seconds old (the cache window) — render it if the freshness
            matters.
        orgs_count:
          type: integer
          description: |
            Non-deleted tenants in this platform's realm — the same number
            `tenants_count` reports for this platform on `GET /admin/platforms`.
            The platform's own admin tenant is NOT included: per ADR-015 every
            admin tenant lives in the BASE realm.
        users_count:
          type: integer
          description: |
            Every `users` row across those tenants. Identical to the
            `users_count` already emitted for this platform by
            `GET /admin/platforms` and `GET /platforms/mine`, so all three
            surfaces show one number.
        sessions_24h:
          type: integer
          description: |
            Sessions with `class='user'` **created** in the trailing 24 hours
            in this platform's realm — human interactive sign-ins. Same
            definition as `AdminStats.sessions_24h`, scoped to one platform.
            Machine sessions are excluded and a refresh does not create a row.
        mfa_coverage:
          $ref: '#/components/schemas/PlatformMFACoverage'

    AuditEvent:
      type: object
      description: |
        Single audit-log row per ADR-048 §3. The kind taxonomy is
        defined in `internal/audit/kinds.go`. actor_label is decorated
        server-side from the actor's user row.
      required: [id, occurred_at, kind]
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: integer, format: int64 }
        kind: { type: string }
        actor_user_id: { type: string }
        actor_label: { type: string }
        platform_id: { type: string }
        tenant_id: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        summary: { type: string }

    AdminEventsResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        next_cursor: { type: string, nullable: true }

    SearchHit:
      type: object
      description: |
        One result in the GET /admin/search response. type is "platform"
        or "tenant"; platform_id is populated only on tenant rows.
      required: [type, id, label]
      properties:
        type: { type: string, enum: [platform, tenant] }
        id: { type: string, format: uuid }
        label: { type: string }
        sublabel: { type: string }
        platform_id: { type: string, format: uuid }

    AdminSearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }

    APIKeyListItem:
      type: object
      description: |
        Per-row shape for GET /platforms/{id}/api-keys. The plaintext key value
        is intentionally omitted — it is shown ONCE on create and never again.
      properties:
        id: { type: string, format: uuid }
        prefix:
          type: string
          description: Non-secret prefix derived from the stored hash; stable across logs.
        label:
          type: string
          description: |
            ADR-085 §7 — the label supplied at create, and **the only handle on a
            key**. The plaintext is never echoed and `prefix` is derived from the
            stored hash, so an `rk_live_…` found in a log or a deployment config
            cannot be traced back to its row by value. Label bootstrap-minted keys
            predictably or you will not be able to tell them apart later. Empty
            string when the key was created without one.
        role: { type: string }
        created_at: { type: integer, description: Unix seconds }
        last_used_at:
          type: integer
          nullable: true
          description: Unix seconds of the most recent successful authentication.
        revoked_at:
          type: integer
          nullable: true
          description: Unix seconds; present iff the key has been revoked.
        expires_at:
          type: integer
          nullable: true
          description: |
            ADR-085 §3 — Unix seconds of the key's scheduled cutoff; `null` =
            non-expiring. A key past its expiry behaves EXACTLY like a revoked
            one at login and at M2M refresh, and returns the same error
            envelope, so the two states are indistinguishable to a key holder.

    APIKeyListPage:
      type: object
      description: Paginated list envelope per SDK SPEC §7.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/APIKeyListItem' }
        next_cursor: { type: string, nullable: true }
        total: { type: integer, nullable: true }

    Role:
      type: object
      description: |
        Per ADR-040 a realm declares its own role catalog. Two names are
        load-bearing inside RI itself: `owner` (tenant config patches,
        owner transfer, demotion guards) and `member` (neutral default).
        Everything else is partner-defined; partners gate on the role
        name in their own RBAC.
      properties:
        id: { type: string, format: uuid, description: "Immutable role catalog row id; use this in role-management paths." }
        name: { type: string, description: "lowercase alphanumeric + _- (2-32 chars)" }
        display_name: { type: string }
        permissions:
          type: array
          items: { type: string }
          description: |
            Permission strings from the closed `resource:action` catalog
            (see `GET /platforms/{id}/permissions`). Since ADR-074 they
            are ENFORCED by the issuer: resolved from the DB at request
            time (never inlined into JWTs), so a grant/revoke takes
            effect on the next request. Writes reject strings outside
            the catalog with `400 unknown_permission`; legacy free-form
            strings already stored stay inert (no effect, never
            granted).
        is_system:
          type: boolean
          description: "true for {owner, member, platform_api} (name/permissions immutable); false for everything else."
        disabled:
          type: boolean
          description: |
            true when the role has been disabled by a realm admin — hidden from
            the invite/assignment surface, but existing holders keep it. The
            roles list hides `platform_api` entirely by default (pass
            `?include_system=true` to include it).
        disabled_at:
          type: integer
          description: "Unix seconds when the role was disabled; omitted when enabled."
        required_mfa_methods:
          type: array
          items: { type: string, enum: [totp, otp] }
          description: |
            Per-role MFA requirement (v0.6.0; **writable** since ADR-075). At
            login time the auth server unions this with the user's `mfa_methods`
            and filters by the realm-enabled methods; if the result is non-empty
            the switch-tenant response gates on MFA (a monotonic floor — a role
            can only add a requirement, never remove one). Only the two real
            methods (`totp`, `otp`) are accepted; unknown/unsupported methods
            (e.g. `webauthn`, `sms`) return 400 `unknown_mfa_method`. AutoMahn's
            `sales_agent` role sets this to `["otp"]` so every SA auto-gates
            without per-user toggles.
        assignable_to:
          type: array
          items: { type: string, enum: [human, service] }
          description: |
            ADR-081 principal typing: the `users.kind` values that may hold this
            role. Always a NON-EMPTY array (§ Amendment 2 — every role
            declares; a DB CHECK enforces it). An empty array can only come
            from an issuer older than v0.57.0, where it meant "any".
        migrated_holders:
          type: integer
          description: |
            ADR-081 §2.5 — present ONLY on the PATCH response that narrowed
            `assignable_to` so humans may no longer hold the role. The number of
            human holders reassigned in that same transaction.
        migrated_holders_to:
          type: string
          description: |
            ADR-081 §2.5 — the role those holders were migrated to. Present only
            alongside `migrated_holders`.
        can_invite_roles:
          type: array
          items: { type: string }
          description: |
            ADR-076 WP4 invitation **scope**: the role names a holder of this
            role may invite new members at (create only). Orthogonal to the
            `invitations:manage` **capability** — a member may create an
            invitation only if their role holds `invitations:manage` AND the
            target role is in this list (owner + a realm M2M principal are
            implicit-all and bypass the scope). `owner` is never a valid entry
            (ownership moves via transfer, not invitation) — writes reject it
            with `400 owner_not_invitable`; an unknown role name returns
            `400 unknown_invite_role`. The seeded `admin` role carries every
            non-owner, non-bot role name (back-compat for its
            `invitations:manage`). Always an array (never null).
        created_at: { type: integer, description: "Unix seconds." }
        updated_at: { type: integer, description: "Unix seconds." }

    RoleListPage:
      type: object
      description: Paginated list envelope per SDK SPEC §7.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        next_cursor: { type: string, nullable: true }
        total: { type: integer, nullable: true }

    SigningKeysResponse:
      type: object
      description: Owner-scoped view of the realm's signing keyring + rotation policy.
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kid: { type: string }
              created_at: { type: integer, description: "Unix seconds." }
              active_until: { type: integer, description: "Unix seconds — signing cutoff." }
              retire_at: { type: integer, description: "Unix seconds — JWKS cutoff." }
              is_current: { type: boolean, description: "true for the key currently used to sign new tokens." }
        rotation:
          type: object
          properties:
            mode: { type: string, enum: [auto, manual] }
            interval:
              type: string
              enum: ['1w', '1mo', '1y']
              description: "Auto-rotation cadence; omitted when unset or mode=manual."
            next_rotation_at:
              type: integer
              description: "Unix seconds the worker next mints a replacement (current key's active_until); omitted in manual mode."

    RotateSigningKeyResponse:
      type: object
      required: [kid, retired_kids]
      properties:
        kid: { type: string, description: "The newly minted key's kid." }
        retired_kids:
          type: array
          items: { type: string }
          description: "kids present on the keyring before this rotation (still published until their RetireAt)."

    FederationBinding:
      type: object
      description: |
        A workload-identity-federation trust binding (ADR-057). The wire
        shape returned by every `/platforms/{id}/federation-bindings`
        endpoint. A workload OIDC assertion is accepted as a bootstrap
        credential for this platform iff its `iss` matches `issuer`, its
        `aud` matches `audience`, and every `match_claims` entry equals the
        corresponding assertion claim.
      properties:
        id: { type: string, format: uuid, description: "Immutable binding id; use this in the DELETE path." }
        platform_id: { type: string, format: uuid }
        realm_id: { type: string, format: uuid, description: "The platform's realm; the minted session is scoped here." }
        issuer:
          type: string
          description: "RI-known OIDC issuer (v1: https://accounts.google.com or https://token.actions.githubusercontent.com)."
        audience:
          type: string
          description: "Forced to the global RI audience constant (anti-confused-deputy); a per-platform audience is rejected."
        match_claims:
          type: object
          additionalProperties: { type: string }
          description: |
            AND-conditions the assertion must satisfy — the tenant boundary.
            Must constrain at least the provider's mandatory claim (GCP `sub`
            = the service account's numeric `uniqueId`; GitHub `repository`).
        mapped_role:
          type: string
          description: "Role stamped on the minted platform session. Defaults to platform_api."
        scope:
          type: array
          items: { type: string }
        status: { type: string, enum: [active, revoked] }
        last_used_at: { type: integer, description: "Unix seconds; omitted until first successful exchange." }
        created_at: { type: integer, description: "Unix seconds." }

    FederationBindingListPage:
      type: object
      description: Paginated list envelope per SDK SPEC §7.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FederationBinding' }
        next_cursor: { type: string, nullable: true }
        total: { type: integer, nullable: true }

    CreateRoleRequest:
      type: object
      required: [name, display_name]
      properties:
        name: { type: string, description: "lowercase alphanumeric + _- (2-32 chars)" }
        display_name:
          type: string
          description: Required, non-blank (400 `display_name_required`).
        permissions:
          type: array
          items: { type: string }
        required_mfa_methods:
          type: array
          items: { type: string, enum: [totp, otp] }
          description: |
            Per-role MFA requirement (v0.6.0). Defaults to `[]`.
        can_invite_roles:
          type: array
          items: { type: string }
          description: |
            ADR-076 WP4 invitation scope (defaults to `[]`). Each entry must be
            a known non-owner role name in the realm (`owner` → 400
            `owner_not_invitable`; unknown → 400 `unknown_invite_role`). Inert
            unless the role also holds `invitations:manage`.
        assignable_to:
          type: array
          items: { type: string, enum: [human, service] }
          description: |
            ADR-081 principal typing: which `users.kind` values may hold this
            role. **NO UNCONSTRAINED ROLES** (§ Amendment 2) — a stored role
            always declares, enforced by a DB CHECK.
            **Omitting the key** defaults to `["human","service"]` (so existing
            clients are unaffected); sending an **explicit `[]`** returns 400
            `assignable_to_required`. Unknown values return 400
            `unknown_principal_kind`. Naming both kinds is preserved as an
            explicit pair — it is a decision, not the absence of one. Assigning
            a role to a principal it does not admit returns 400
            `role_not_assignable_to_kind` on every assignment path.

    PatchRoleRequest:
      type: object
      description: PATCH semantics — missing keys preserve existing values.
      properties:
        display_name: { type: string }
        permissions:
          type: array
          items: { type: string }
        required_mfa_methods:
          type: array
          items: { type: string, enum: [totp, otp] }
          description: |
            Per-role MFA requirement (v0.6.0). Send `[]` to clear.
        can_invite_roles:
          type: array
          items: { type: string }
          description: |
            ADR-076 WP4 invitation scope. Send `[]` to clear. Same validation as
            create (`owner_not_invitable` / `unknown_invite_role`).
        assignable_to:
          type: array
          items: { type: string, enum: [human, service] }
          description: |
            ADR-081 principal typing. **`[]` is rejected** (400
            `assignable_to_required`) — there is no "clear back to any"; name
            the kinds instead. Omitting the key preserves the stored value.
            **Narrowing this so humans may no longer hold the role migrates the
            role's existing human holders** — in the same transaction — to the
            realm's `default_invitation_role` (when set and itself
            human-assignable), else to `member`. The response then carries
            `migrated_holders` + `migrated_holders_to`, and each migration is
            audited. Existing holders are never stranded without a role.

    RenameScopeRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: The scope string to rename. RFC 6749 §3.3 scope-token.
        to:
          type: string
          description: |
            Its replacement. RFC 6749 §3.3 scope-token, bounded by the realm's
            `user_api_keys.max_permission_string_len`. A SPACE here would
            corrupt every token minted afterwards by splitting one scope into
            two, which is why the charset is enforced rather than assumed.
      example:
        from: reports.read
        to: reports:read

    RenameScopeResponse:
      type: object
      required: [from, to, dry_run, keys, roles]
      properties:
        from: { type: string }
        to: { type: string }
        dry_run:
          type: boolean
          description: |
            Echoed so a response cannot be mistaken for the other kind when read
            out of a log.
        keys:
          type: integer
          description: |
            `user_api_keys` ROWS whose `permissions_cap` changed. Rows, not
            occurrences — a row holding `from` twice counts once, because a row
            is what you can go and look at.
        roles:
          type: integer
          description: |
            ALWAYS `0`. `realm_roles.permissions` holds RealmID's own ADR-074
            catalog, not your vocabulary, and is deliberately not renamed — see
            the endpoint description. The field is kept so a client written
            against the originally-documented two-store shape still parses.

    RenameRoleRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          description: |
            New role name. Same constraints as create: lowercase
            alphanumeric + `_-`, 2-32 chars. Must not collide with an
            existing name in the realm catalog.

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          description: |
            Per ADR-040 the role value space is the realm's role catalog
            (see `GET /platforms/{id}/roles`). Cannot be `owner` — use
            `PUT /tenants/{id}/owner` for the explicit handover (returns
            400 `use_transfer_owner` otherwise). Unknown role names return
            400 `unknown_role`.

    # CreateRealmRequest / Realm DTOs were removed in v0.5.0 alongside
    # POST /realms (see ADR-043 / ADR-044). Partner realms are created
    # via POST /platforms (PlatformCreate); the base realm is created by
    # cmd/realmid-seed.

    CreateAPIKeyRequest:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          default: service
          description: >-
            **Cosmetic metadata only — does NOT set the key's class.**
            Persisted to `api_keys.scope` and echoed back, but the
            `/auth/login` class check (`isPlatformKey`) ignores it and
            derives the class **solely from the role of the bound bot
            user** (see `user_id`): `platform_api` → platform-class
            (`grant_type=platform_api_key`), anything else →
            service-class (`grant_type=api_key`). Passing
            `scope: platform` does **not** make a service key
            platform-class. (Footgun; tracked for fix — make it
            authoritative or drop it.)
        label: { type: string }
        ttl_seconds:
          type: integer
          minimum: 300
          description: |
            ADR-085 §3 — key lifetime in seconds. Omit **and** set
            `non_expiring: true` for a permanent key; omitting both applies the
            built-in **90-day** default. That default is deliberately NOT a
            per-realm knob: a lifetime a partner can widen to "forever" from
            their own console is not a control. Below the 300s floor the call
            returns `400 invalid_ttl` rather than clamping — clamping upward
            would hand back a key that outlives what was asked for. Sending
            both `ttl_seconds` and `non_expiring` is also `400 invalid_ttl`.

            Expiry is enforced at three points and implementing only the first
            is the trap: at create (here), at the login lookup, and at every
            M2M refresh (§4).
        non_expiring:
          type: boolean
          description: |
            Explicitly request a key with no expiry. Rejected with
            `400 non_expiring_not_allowed` when the realm already holds a
            non-expiring platform key — at most one is permitted, so a
            permanent key is a conscious act rather than what you get by
            forgetting a field.

            Applies to PLATFORM-class keys (those bound to a `platform_api`
            bot). Owner-bound `scope=service` keys are excluded from both this
            rule and the active-key cap: they are bounded by the human who
            holds them, and ADR-085 §2 caps the machine credential, not people.
        user_id:
          type: string
          format: uuid
          description: >-
            Optional. Binds the key to a specific bot user, which
            determines the key's class (ADR-041). If omitted, defaults
            to the realm's `platform_api` bot user (→ platform-class
            key). If the realm has **no** `platform_api` bot user
            (e.g. a realm provisioned outside `POST /platforms`), the
            default cannot resolve and the call returns
            `400 no_default_bot_user` — pass a `user_id` explicitly, or
            have the bot user backfilled (see operator-runbook
            "ensure platform_api bot user"). Binding to a human/owner
            user yields a **service-class** key.

    APIKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        value:
          type: string
          description: Raw key, returned only on create.
        scope:
          type: string
          description: >-
            Echoed `scope` metadata from create — cosmetic, not the
            authoritative class (see CreateAPIKeyRequest.scope). The
            real class is derived from the bound bot user's role.
        label: { type: string }
        expires_at:
          type: integer
          nullable: true
          description: |
            ADR-085 §3 — Unix seconds of the scheduled cutoff; `null` =
            non-expiring, which is permitted for at most ONE platform key per
            realm.

    UserAPIKeyCreateRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          description: |
            Human label. **The only handle on a key**: listing returns a
            non-secret hash prefix, never the plaintext, so a found
            `uk_live_…` cannot otherwise be correlated to its row.
        org_scope:
          type: string
          enum: [selected, all]
          description: |
            ADR-084 §6. `selected` (realm default) pins the key to a FROZEN
            allowlist — memberships acquired later do NOT widen it. `all` is
            **forward-inclusive**: every org in this realm the user belongs to,
            now *and in future*, resolved fresh at each exchange rather than
            snapshotted. `all` requires the realm's
            `user_api_keys.allow_all_orgs`, else `400 all_orgs_not_allowed`,
            and the minting UI must label it forward-inclusive.
        org_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            The frozen allowlist for `org_scope=selected`; defaults to just the
            user's current org. Every id must be a live membership of `{uid}`,
            else `400 org_not_a_membership`. Ignored when `org_scope=all`.
        permissions_cap:
          type: array
          items: { type: string }
          description: |
            **A CAP, NEVER A GRANT.** Effective authority is
            `permissions_cap ∩ the principal's live permissions`, re-resolved
            per request — so it can only ever UNDER-grant. Demote the holder
            and the key shrinks with them; transfer the org (ADR-076) and the
            cap still binds, because the intersection runs *before* owner
            implicit-all.

            The name is a control, not decoration: `permissions` in a decoded
            token reads like an OAuth grant and invites
            `if (tok.permissions.includes(p)) allow`, which is the stale-scope
            hole. `permissions_cap` makes that line look wrong.

            For `aud=realmid` the strings are validated at mint against the
            ADR-074 catalog (`400 unknown_permission`) and enforced at the
            issuer's gates. For a partner audience they are **opaque to
            RealmID** — shape-validated only — and the intersection is the
            REQUIRED partner integration pattern, not a suggestion. A partner
            with no live permission model has nothing to intersect, and for
            them the real controls are revocation, expiry, org pinning and the
            revoke sweep.

            RealmID never pattern-matches, expands, or orders these strings: no
            wildcards, no hierarchy, no implied `*`. Bounded by
            `user_api_keys.max_permission_strings` /
            `max_permission_string_len`.
        ttl_seconds:
          type: integer
          description: |
            Lifetime in seconds. Omitted = the realm's
            `user_api_keys.default_ttl_seconds`. Clamped to
            `max_ttl_seconds`; above it returns `400 ttl_exceeds_max`. A
            non-expiring key requires `user_api_keys.allow_non_expiring`, else
            `400 non_expiring_not_allowed`.

    UserAPIKey:
      type: object
      description: |
        Create response. `value` is the plaintext and is shown **once** — it is
        never stored and never returned again.
      properties:
        id: { type: string, format: uuid }
        value:
          type: string
          description: |
            Raw key, returned only on create. Prefix `uk_live_` is deliberately
            distinct from the admin key's `rk_live_` so a leaked string is
            classifiable at a glance and the two lookup paths cannot be
            confused.
        label: { type: string }
        org_scope: { type: string, enum: [selected, all] }
        org_ids:
          type: array
          items: { type: string, format: uuid }
        permissions_cap:
          type: array
          items: { type: string }
        expires_at:
          type: integer
          nullable: true
          description: Unix seconds; `null` = non-expiring.

    UserAPIKeyListItem:
      type: object
      description: |
        Per-row list shape. The plaintext is never echoed — only the label and a
        non-secret hash prefix, same discipline as the admin key list.
      properties:
        id: { type: string, format: uuid }
        prefix:
          type: string
          description: Non-secret prefix derived from the stored hash.
        label: { type: string }
        org_scope: { type: string, enum: [selected, all] }
        org_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            For `selected`, the frozen allowlist AS STORED. An org listed here
            may no longer be resolvable: revocation on membership loss is an
            async sweep, and live membership is re-intersected at every
            exchange, so a key can LIST an org it can no longer MINT into
            (ADR-084 §9).
        permissions_cap:
          type: array
          items: { type: string }
        minted_mfa_at:
          type: integer
          nullable: true
          description: |
            Unix seconds MFA was proven at mint; `null` = not proven. Load
            bearing, not informational: key exchange is exempt from the realm
            MFA floor **if and only if** this is set (ADR-084 §8.1).
        created_at: { type: integer, description: Unix seconds }
        last_used_at: { type: integer, nullable: true }
        expires_at: { type: integer, nullable: true }
        revoked_at: { type: integer, nullable: true }

    UserAPIKeyListPage:
      type: object
      description: Paginated list envelope per SDK SPEC §7.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserAPIKeyListItem' }
        next_cursor: { type: string, nullable: true }
        total: { type: integer, nullable: true }

  responses:
    Unauthorized:
      description: 401 unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 403 forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 404 not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  # ---------------------------------------------------------------- Auth

  /auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for a refresh (+ access if resolved)
      description: |
        ADR-051 (v0.7.0). Single credential-exchange endpoint. The
        body's `grant_type` selects the credential exchange and the
        subject class of the issued tokens. See `LoginRequest` for
        the per-grant fields and inbound bearer rules. The legacy
        `method` alias is removed (sunset 2026-08-01) — a body without
        `grant_type` 400s `missing_grant_type`.

        Inbound bearer:
        - **User grants** (`provider_token`, `password`,
          `otp`) require `Authorization: Bearer <platform
          access token>`. NOTE: `password` is **reserved, not
          implemented** — it unconditionally returns
          `400 unknown_method` (ADR-042 slot). The realm is resolved from the bearer's
          `realm_id` claim; body `realm_id` is ignored. ADR-046
          `aud` validation still applies on `provider_token` /
          `google`.
        - **Api-key grants** (`api_key`, `platform_api_key`) carry
          the raw key in the body and reject any inbound bearer.

        ADR-051 hard cut: `POST /auth/service-token` and
        `POST /auth/platform-token` are deleted in v0.7.0; both URLs
        return 404. Migrate to this endpoint with
        `grant_type: api_key` / `grant_type: platform_api_key`.
      security:
        - BearerPlatformToken: []
        - {}
      parameters:
        - in: header
          name: X-Device-Name
          required: false
          schema: { type: string, maxLength: 120 }
          description: >
            Optional human-readable device label persisted on the created
            session and surfaced in GET /auth/sessions (ADR-062). Control
            characters are stripped and the value is capped at 120 chars.
            Only the user grants record it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: |
            OK — every successful credential exchange returns
            `status:"ok"` **including a refresh token even when MFA is
            still pending** (MFA is flagged per-tenant via
            `tenants[].mfa_required`; the `412 mfa_required`
            precondition is raised later, on `POST /auth/token`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          description: |
            bad_json (malformed body)
            | missing_grant_type (no `grant_type`; the legacy `method`
            alias was removed at its 2026-08-01 sunset)
            | bad_grant_type (unrecognised `grant_type`)
            | missing_provider (`grant_type=provider_token` without
            `provider`)
            | unknown_method (provider/method not enabled for the realm;
            ALSO the unconditional response to `grant_type=password` —
            reserved, not implemented, ADR-042)
            | bad_tenant_id (`tenant_id` not in the resolved realm)
            | missing_api_key (api-key grants without `api_key`)
            | missing_subject_token | bad_subject_token_type
            (token-exchange grant, ADR-057).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: |
            unauthorized (missing or invalid platform token; user
            grants only)
            | wrong_scope (bearer is not `token_class=platform`; the
            error CODE is unchanged, only the claim it reads)
            | invalid_audience (id-token `aud` not registered;
            `provider_token` / `google`)
            | invalid_credentials (bad password / OTP / api-key)
            | key_class_mismatch (declared `grant_type` doesn't
            match the api-key's class — `api_key` vs
            `platform_api_key`; ADR-051)
            | revoked_api_key (api-key grants; key soft-revoked)
            | keyless_api_key (api-key not bound to a bot user).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            user_not_invited (known user, no membership in the resolved
            realm) | signup_domain_not_allowed | user_suspended.
            (A `realm_mismatch` 403 was previously documented here but
            is not emitted by this handler.)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: realm_not_found (bearer's realm does not resolve)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: realm_suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: |
            session_limit_reached (concurrent session cap hit) |
            first_login_pending_approval (first login on a recently-
            vacated contact slot awaits tenant-owner approval; ADR-042 P2).
            NOTE: `mfa_required` is NOT raised here — see the 200
            description and `POST /auth/token`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PreconditionSessionLimit'
                  - $ref: '#/components/schemas/PreconditionFirstLoginPending'
        '501':
          description: |
            federation_disabled (token-exchange grant while workload
            identity federation is not enabled; ADR-057)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/token:
    post:
      tags: [Auth]
      summary: Rotate a refresh token into a new refresh + access pair
      description: |
        Accepts a refresh token (Bearer header or body) and returns
        a fresh access token plus a (possibly rotated) refresh token.
        Works for all three subject classes — the response carries
        `subject_type ∈ {user, service, platform}`.

        Body `tenant_id` is required only when the refresh token's
        subject is a multi-tenant **user** (response shape #2 from
        `/auth/login`). For service / platform refresh tokens
        `tenant_id` is **ignored** — those sessions are pinned to
        the api-key's bot user / admin tenant.

        Rotation policy (ADR-051): user refresh tokens always
        rotate (ADR-031 reuse-detection). An ADR-071 service-account
        refresh token rotates only when the realm has opted in via
        `service_refresh_rotates`; otherwise the same refresh is
        echoed back unchanged. ADR-089: a credential-bootstrapped
        session (`grant_type` ∈ {`api_key`, `platform_api_key`,
        token-exchange}) has no refresh token — presenting one
        returns `401 m2m_refresh_withdrawn`; re-mint via
        `POST /auth/login` instead.

        **BFF gate (ADR-041).** When the refresh-bound session's realm
        is not the base realm, this endpoint requires a partner
        platform bearer in `Authorization` and the refresh token MUST be
        supplied in the **body** (the header is the platform JWT, not the
        refresh). The realm is resolved from the refresh-bound session, so
        the gate applies to **every** refresh class — user, service, and
        platform — not just tenant-scoped user refreshes. A missing/invalid
        platform bearer returns `401 bff_bearer_required`.

        Returns 412 if the tenant's MFA policy requires a challenge
        the caller has not completed.
      security:
        - BearerRefresh: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: |
            missing_tenant_id (refresh subject is a multi-tenant user and
            the body carries no `tenant_id`) | bad_request (a
            `custom_claims` key is not in the realm's
            `access_token_custom_claim_keys` allowlist)
            | reserved_claim_key (a `custom_claims` key is a reserved JWT
            claim name — ADR-097 D3; previously dropped silently)
            | invalid_scope (a `scope` entry is not an RFC 6749 §3.3
            scope-token)
            | too_many_scopes / scope_too_long (`scope` exceeds the realm's
            `user_api_keys.max_permission_strings` /
            `max_permission_string_len`)
            | scope_not_supported (this session class mints no `scope`)
            | bad_json.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            not_a_member | user_suspended. NOTE: a **deactivated** user
            also returns `user_suspended` — the previously-documented
            separate `deactivated` code is collapsed into
            `user_suspended` (suspended and deactivated map to the same
            error in `authsvc`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: MFA required (or registration required)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreconditionMFA' }

  /auth/refresh:
    post:
      tags: [Auth]
      deprecated: true
      summary: Alias of POST /auth/token
      description: Retained for one release; identical request/response shape.
      security:
        - BearerRefresh: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session (or all sessions)
      security:
        - BearerRefresh: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOK' }

  /auth/mfa/enroll:
    post:
      tags: [Auth]
      summary: Self-enroll a first MFA factor (refresh-authed)
      description: |
        ADR-061 — bootstraps a first TOTP factor for the user behind the
        supplied refresh token. Refresh-authed (the refresh is the handle to
        the user's login session) so a first-login user who has no access
        token yet — the MFA gate withheld it — can still enroll; the same path
        serves a post-login user switching into an MFA-required tenant.

        In BFF mode the `Authorization` header is the partner platform token,
        so the refresh travels in the body (as for `/auth/token`). The response
        carries the secret/QR/recovery plus an **enroll-scoped**
        `mfa_challenge_token`; the client completes via `POST /auth/mfa/verify`,
        which confirms the new secret AND mints tokens in a single code entry.
        There is no separate `/auth/mfa/confirm` for self-enroll.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                refresh_token:
                  type: string
                  description: |
                    The user's refresh token. May instead be presented as the
                    bearer for public clients (BFF mode keeps the platform token
                    in Authorization and sends the refresh here).
                tenant_id:
                  type: string
                  description: The MFA-required tenant the enroll-challenge is scoped to.
                method:
                  type: string
                  enum: [totp]
                  default: totp
      responses:
        '200':
          description: OK — secret/QR/recovery + an enroll-scoped MFA challenge token
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  qr_url: { type: string }
                  recovery_codes:
                    type: array
                    items: { type: string }
                    description: >-
                      Generated and hash-stored, but NOT yet redeemable —
                      there is no redemption endpoint today, so a lost
                      authenticator is currently an unrecoverable lockout.
                      Do not present these to users as a recovery mechanism
                      until the redeem path ships.
                  mfa_challenge_token: { type: string }
                  tenant_id: { type: string }
        '401':
          description: refresh_invalid — refresh token missing, expired, or revoked
        '403':
          description: not_a_member / user_suspended
        '409':
          description: already_enrolled — reset before re-enrolling

  /auth/mfa:
    delete:
      tags: [Auth]
      summary: Self-disable MFA (step-up gated)
      description: |
        ADR-061 counterpart to `POST /auth/mfa/enroll` — disables MFA for
        the calling user. Auth (`requireAuthAsUser`): the user's own
        access JWT, **or** a partner **platform bearer**
        (`token_class=platform`; was `scope=platform` before ADR-097 #8)
        carrying the user's verified access JWT in
        `X-User-Token` — the production BFF path (ADR-050). The partner
        cannot impersonate: it must possess the user's access JWT, and the
        operation resolves to and acts as that user. The bare
        `X-On-Behalf-Of-User` id is **no longer accepted** for identity
        (removed 2026-07-27; it was an unauthenticated assertion) — a
        request carrying it gets `401 x_user_token_required`.

        Step-up: the caller MUST present a currently valid TOTP `code` in
        the body, so a stolen access token alone cannot disable MFA on the
        victim. On success the enrollment is reset, `totp` is pruned from
        `users.mfa_methods` (`otp` entries are preserved), and every
        session's MFA-freshness anchor for this user is cleared — the next
        MFA-protected operation gets `412 mfa_required` and forces
        re-enrollment.

        Returns 200 (not 204) per the ADR-069 uniform-200 envelope so the
        `{status}` body survives.
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: A currently valid TOTP code (step-up proof).
      responses:
        '200':
          description: OK — MFA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [disabled] }
        '400':
          description: missing_code | not_enrolled
        '401':
          description: invalid code, or bearer is not a user JWT

  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Complete an MFA challenge (or enrollment confirmation)
      description: |
        SPEC §10.4 — on success the response carries a freshly minted access
        token (with the new `mfa_at` claim) plus a rotated refresh, so the
        client can drop in the new tokens and resume the original protected
        operation without a separate /auth/token round trip.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFAVerifyRequest' }
      responses:
        '200':
          description: OK — access + refresh tokens carrying the new mfa_at claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MFAVerifyResponse' }
        '401':
          description: Invalid challenge token or code
        '429':
          description: mfa_too_many_fails

  /auth/mfa/recovery:
    post:
      tags: [Auth]
      summary: Redeem a recovery (backup) code in place of TOTP (ADR-077 §2)
      description: |
        A primary-authenticated user who lost their TOTP authenticator submits a
        single-use recovery code in place of the TOTP step-up. Requires the same
        `mfa_challenge_token` the MFA gate mints (so it NEVER substitutes for
        primary auth — the code alone is useless). On success it satisfies the
        MFA gate for this (session, tenant) and mints tokens exactly like
        `/auth/mfa/verify`, **consumes** the code, and **forces fresh
        re-enrollment** (the old authenticator is presumed lost) — the response
        sets `reenroll_required:true` and the enrollment is cleared, so the next
        login drives ADR-061 enrollment (regenerating the code set). Rate-limited
        on the same counter as TOTP. Closes review gap I-02 (recovery codes were
        generated but redeemed nothing).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_challenge_token, code]
              properties:
                mfa_challenge_token: { type: string }
                code: { type: string, description: "A single-use recovery code from enrollment." }
      responses:
        '200':
          description: |
            OK — access + refresh tokens (with the new `mfa_at`) plus
            `reenroll_required:true`. Same token fields as MFAVerifyResponse.
        '401':
          description: Invalid challenge token or recovery code
        '429':
          description: mfa_too_many_fails

  /auth/mfa/authenticators:
    get:
      tags: [Auth]
      summary: List the current user's enrolled MFA authenticators
      description: |
        Returns the caller's enrolled MFA authenticator(s) and how many backup
        codes remain. One TOTP enrollment per user today, so the array has 0 or 1
        entries; the shape is forward-compatible with multiple factors. A read —
        NOT MFA-gated. Access-token authed.
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: |
            OK — { authenticators: [{ type, confirmed, created_at, confirmed_at }],
            backup_codes_remaining }

  /auth/mfa/recovery/regenerate:
    post:
      tags: [Auth]
      summary: Regenerate (rotate) the current user's recovery codes
      description: |
        Mints a fresh set of backup/recovery codes for the current user,
        invalidating the previous set (including any still-unconsumed codes).
        **Gated on a FRESH TOTP within the elevated window** — the route is
        registered `RequireFresh`, so a token without a recent `mfa_at` gets the
        412 `mfa_required` step-up envelope until the user re-completes TOTP; a
        stolen long-lived session cannot silently rotate the codes. Requires a
        confirmed enrollment. Codes are shown once and also emailed (ADR-079).
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: "OK — { status: ok, recovery_codes: [...] }"
        '409':
          description: not_enrolled — no confirmed authenticator
        '412':
          description: mfa_required — a fresh TOTP step-up is needed first

  /auth/mfa/challenge:
    post:
      tags: [Auth]
      summary: Mint a step-up MFA challenge for an already-verified access token
      description: |
        SPEC §10.4 — SDK middleware calls this when a protected route
        requires fresh MFA but the caller's `mfa_at` is missing or stale.
        Auth: bearer of the user's current access token (NOT a platform
        token). The minted challenge is bound to (sub, tenant_id, jti) of
        the access token and is consumed by POST /auth/mfa/verify.
      security:
        - BearerAccess: []
      responses:
        '200':
          description: OK — challenge token + supported methods
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MFAChallengeResponse' }
        '401':
          description: Missing, expired, or invalid bearer access token

  # ---------------------------------------------------------------- Partner OTP primitive (v0.6.0)

  /auth/otp/issue:
    post:
      tags: [Auth]
      summary: Mint a partner OTP for (subject_ref, purpose)
      description: |
        Partner OTP primitive (proposal: partner-otp-primitive.md §3).
        Mints a short-lived, one-shot OTP scoped to the caller's
        tenant. Length and TTL come from
        `realms.config.otp_length` / `otp_ttl_seconds`. Multiple
        issuers can mint codes concurrently for the same
        `(subject_ref, purpose)` — codes stack; verify consumes the
        first hash-match. Plaintext is cached in Redis under the
        OTP id and re-displayable via `GET /auth/otp/{id}` until TTL.
        Emits `auth.otp.issued`.
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OTPIssueRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OTPIssueResponse' }
        '400':
          description: |
            invalid_purpose | invalid_subject_ref | invalid_scope |
            unsupported_delivery_mode (`delivery_mode` other than
            `view_bff` — the RI-delivered modes are not yet available;
            ADR-071 §4).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid bearer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            forbidden — ADR-071 §5 login-OTP mint-gate: a
            `purpose=login` OTP may be minted only by an owner/admin,
            only for a `kind=service` subject in the caller's own
            tenant (a missing / cross-tenant / non-service subject
            collapses to the same code — no oracle).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/otp/{id}:
    get:
      tags: [Auth]
      summary: Re-fetch the plaintext for an OTP minted by this user
      description: |
        Returns the plaintext OTP from Redis. Issuer-scoped — the
        bearer's `(tenant_id, user_id)` must match the row's. After
        the OTP TTL the plaintext cache expires and this returns 404
        (the underlying row may still be verifiable). Emits
        `auth.otp.viewed`.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OTPViewResponse' }
        '404':
          description: otp_not_found (row missing, expired, or cross-tenant)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Hash-match a presented OTP, consume on hit
      description: |
        Hashes `presented` and looks up the active row in
        `(tenant_id, subject_ref, purpose, hash)`. On hit, marks the
        row consumed and returns the issuer attribution shape so the
        partner can record the gating actor in its own audit log.
        On miss, increments the per-`(tenant, subject_ref, purpose)`
        lockout counter (5 fails / 15 min → 429). Emits
        `auth.otp.verified` on success and `auth.otp.verify_failed`
        on miss/expired/locked.
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OTPVerifyRequest' }
      responses:
        '200':
          description: OK — issuer attribution returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OTPVerifyResponse' }
        '400':
          description: invalid_purpose | invalid_subject_ref | tenant_required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: invalid_otp (no active row matches hash)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: otp_expired (matched row exists but is expired)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: otp_locked (≥5 failed attempts in 15 min for this key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Sessions

  /auth/sessions:
    get:
      tags: [Sessions]
      summary: List active sessions for this (user, realm)
      security:
        - BearerAccess: []
        - BearerRevocation: []
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListPage' }
    delete:
      tags: [Sessions]
      summary: Revoke every session for this user
      description: Access-token only — revocation tokens may not call this.
      security:
        - BearerAccess: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOK' }

  /auth/sessions/{id}:
    delete:
      tags: [Sessions]
      summary: Revoke one session
      security:
        - BearerAccess: []
        - BearerRevocation: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tenants/{id}/users/{uid}/sessions/revoke:
    post:
      tags: [Sessions]
      summary: >-
        Admin force-logout of a specific user — revoke ALL of the target
        user's sessions in the tenant's realm. Distinct from the self-service
        DELETE /auth/sessions (which only touches the caller's own sessions).
        Owner/admin only (sessions:revoke; owner implicit-all).
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: "OK — status=ok, revoked=<count>"
        '404':
          description: user not found (or not in this tenant)

  /platforms/{id}/sessions/revoke-all:
    post:
      tags: [Sessions]
      summary: >-
        Realm-wide mass logout — revoke EVERY session in the realm (e.g. breach
        response). The DB revocation is authoritative; the Redis active-session
        sets are cleared realm-wide so no user trips the session-limit counter
        on next login. Owner/admin only (sessions:revoke on the realm).
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: "OK — status=ok, revoked=<count>"

  # ---------------------------------------------------------------- JWKS

  /{realm}/.well-known/jwks.json:
    get:
      tags: [JWKS]
      summary: Realm JWKS
      parameters:
        - in: path
          name: realm
          required: true
          schema: { type: string }
      responses:
        '200':
          description: RFC 7517 JWK Set
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
        '404':
          description: |
            realm_not_found — unknown realm; any resolution error
            (not-found, malformed uuid) collapses to this uniform 404
            (CODE_GAPS G-003).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: |
            realm_suspended — the realm is suspended or deactivated;
            JWKS stops serving (existing access tokens become
            unverifiable by partner APIs).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /{realm}/.well-known/openid-configuration:
    get:
      tags: [JWKS]
      summary: OIDC discovery document (ADR-038)
      description: |
        Minimal OIDC discovery doc so partner SDKs can resolve `iss` →
        `jwks_uri` + token endpoint without baking URLs into client code.
        Only the fields a JWT verifier or a dual-token client consumes are
        advertised; userinfo/registration/end_session are intentionally omitted.
      parameters:
        - in: path
          name: realm
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: { type: string, format: uri }
                  jwks_uri: { type: string, format: uri }
                  token_endpoint: { type: string, format: uri }
                  revocation_endpoint: { type: string, format: uri }
                  id_token_signing_alg_values_supported:
                    type: array
                    items: { type: string }
                  response_types_supported:
                    type: array
                    items: { type: string }
                  grant_types_supported:
                    type: array
                    items: { type: string }
                  subject_types_supported:
                    type: array
                    items: { type: string }
                  token_endpoint_auth_methods_supported:
                    type: array
                    items: { type: string }

  # ---------------------------------------------------------------- Platforms

  /domains/claim:
    post:
      tags: [Platforms]
      summary: Claim a root domain (ADR-033, pre-bootstrap only)
      description: |
        Pre-bootstrap platform-creation flow. The DV row is
        `owner_type='user'` (anchored on the actor who will become the
        platform's first admin). Post-bootstrap origin adds use
        `POST /platforms/{id}/origins/claim` instead, which scopes the
        DV row to the realm.

        DNS TXT only.

        Idempotent: re-claiming a domain with a still-pending claim
        returns the SAME pending TXT record instead of erroring, so an
        interrupted onboarding can resume (pair with
        `GET /domains/pending`).
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimDomainRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDomainResponse' }

  /domains/verify:
    post:
      tags: [Platforms]
      summary: Check the DNS TXT record and flip the claim to verified
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyDomainRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOK' }
        '400':
          description: |
            verification_failed — the DNS TXT lookup did not (yet)
            produce the expected record; the primary failure mode
            (retry after DNS propagation). The claim stays pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: domain_not_found (no pending claim for this domain by the caller)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /domains/pending:
    get:
      tags: [Platforms]
      summary: List the caller's in-progress (pending) domain claims
      description: |
        Returns the caller's non-expired pending domain verifications so a
        UI can resume one after a page refresh dropped the client-side claim
        state. Each row carries the same TXT record the original claim
        returned. Newest first.
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PendingDomain' }

  /platforms:
    post:
      tags: [Platforms]
      summary: Create a platform realm (custom domain optional, ADR-073)
      description: |
        Creates a partner platform realm + admin tenant + bot user.

        **`domain` is optional (ADR-073 Release A).**

        - **With `domain`** (a verified custom apex): binds the apex via
          `domain_mappings`, ALSO binds `<slug>.realmid.dev` (the
          auto-bound row reuses the apex's `verification_id` because
          RealmID has implicit DNS control over its own zone; audit row
          carries `trusted_by_parent: true, parent_domain: realmid.dev,
          auto_bound: true`). Requires a caller-owned verified
          `domain_verifications` row (else `412 domain_not_verified`).
        - **Without `domain`** (domainless): the realm's routing domain is
          set to its `<slug>.realmid.dev` hosted-login subdomain, ONLY that
          mapping is bound (with a NULL `verification_id`), and no domain
          proof is required. A custom apex can be added later via
          `POST /platforms/{id}/origins` (claim → verify → bind), which
          promotes it to the realm's primary domain.

        Reserved slugs (`console`, `app`, `auth`, `api`, `www`, `status`,
        `admin`) return `409 reserved_slug`.
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlatformRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatePlatformResponse' }
        '400':
          description: |
            missing_fields (`display_name` or `slug` absent) |
            invalid_slug (1–63 chars, lowercase a-z, 0-9, hyphen, no
            leading/trailing hyphen) | bad_json.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Conflict. Possible codes:
              - `domain_taken` — domain already mapped.
              - `reserved_slug` — slug is on the first-party reserved
                list (`console`, `app`, `auth`, `api`, `www`, `status`,
                `admin`).
              - `slug_taken` — another platform already owns this slug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: |
            domain_not_verified — a custom `domain` was supplied but the
            caller holds no verified `domain_verifications` row for it
            (claim + verify first via `/domains/claim` + `/domains/verify`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /platforms/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Platforms]
      summary: Read one platform the caller owns
      description: |
        The singular counterpart to `GET /platforms/mine`, returning the same
        row shape for one platform. Backs the CLI's `platforms describe`.

        Authorization is inherited from `/platforms/mine`, not restated: the
        visible set is exactly what that endpoint returns, filtered to one id.
        A platform the caller cannot see returns the SAME `404
        platform_not_found` as an id that was never issued — never `403`. A
        distinct refusal would confirm the id is live, which would turn any
        partner account into a directory of every platform on the fleet.
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSummary' }
        '401':
          description: unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: |
            platform_not_found — returned identically for an unknown id and for
            a platform the caller may not see.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [Platforms]
      summary: Rename a platform
      description: |
        Renames a platform's display label. The platform's display_name and
        its admin tenant's display_name are kept in lockstep, so callers do
        not need to drill into the admin tenant to change the platform label.
        Owner-gated against the platform's admin tenant (tenant lifecycle
        stays owner-only — NOT opened by the ADR-074 permission gates).
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSummary' }
        '404':
          description: platform_not_found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /platforms/mine:
    get:
      tags: [Platforms]
      summary: List platforms the caller owns
      description: |
        Returns every platform (realm) whose admin tenant the caller owns
        (role=owner). The UI uses this to decide which platforms the user
        may administer (UI-003). Service JWTs receive 401 since "my
        platforms" has no meaning for them.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformListPage' }
        '401':
          description: unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /platforms/{pid}/tenants:
    parameters:
      - in: path
        name: pid
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platforms]
      summary: Create a tenant inside a platform realm
      security: [{ BearerAccess: [] }]
      description: |
        Creates an organization (tenant) inside the platform's realm.

        **Gated on `tenants:manage` (ADR-091 D2).** Both `tenants:read` and
        `tenants:manage` are new catalog entries in this release — org
        lifecycle was previously reachable only through the realm-admin gate,
        so it could not be delegated without granting realm administration.

        Since ADR-073 Amendment C this is also the tenant rung of a bulk
        migration:

        - **Bring-your-own `id`** (any UUID — a derived UUIDv5 is legal) makes
          the create idempotent and re-runnable. Absent ⇒ a UUIDv7 is minted
          and returned. An `id` that already exists **in this realm** RECONCILES
          it (updates `display_name` only — never the owner pointer or
          `created_at`); one that exists **in another realm** is rejected.
        - **`signup_mode`** (ADR-045) is honoured on create; absent ⇒ `closed`.
          It was documented and accepted by every SDK from ADR-073 Amendment C
          but **silently dropped server-side until 2026-08-02** — every org came
          out `closed`. On RECONCILE it is idempotent-or-refused, never applied:
          the same value is a no-op, a different one is
          `409 signup_mode_immutable_on_reconcile`. A re-run import must not
          clobber a policy the org changed in the console since, and dropping
          the field silently is the defect being fixed.
        - **Inline `owner` is REQUIRED when creating** a new tenant (ADR-073 C.3:
          `owner_user_id` is NOT NULL — a tenant is born with an owner). It is
          seated atomically with the tenant, provisioned as a verified ACTIVE
          human with the dormant `member` role. On RECONCILE `owner` is optional;
          if supplied it must MATCH the seated owner (`owner_already_set`
          otherwise) — reconcile never re-seats ownership.
        - **`created_at`** preserves the source "org since" age.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                id:
                  type: string
                  format: uuid
                  description: |
                    Optional caller-supplied tenant id (ADR-073 C.1). Absent ⇒
                    mint UUIDv7. Present + exists in this realm ⇒ reconcile;
                    present + exists in another realm ⇒ `cross_realm_tenant_id`.
                display_name: { type: string }
                signup_mode:
                  type: string
                  enum: [closed, allowlist, open]
                  description: |
                    Optional ADR-045 signup policy; absent ⇒ `closed`. `open` is
                    reserved for the base admin tenant and is refused here
                    (`400 invalid_signup_mode`) — this route cannot reach that
                    tenant at all, since orgs may not be created under the base
                    realm. Refused rather than downgraded: honouring a field by
                    writing something else is the same class of defect as
                    ignoring it. On reconcile see the 409 below.
                created_at:
                  type: string
                  format: date-time
                  description: |
                    Optional RFC3339 creation timestamp (ADR-073 C.4); absent ⇒
                    server time. Ignored on reconcile.
                owner:
                  $ref: '#/components/schemas/InlineOwner'
      responses:
        '201':
          description: Created (or reconciled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400':
          description: |
            `missing_display_name` | `bad_json` |
            `owner_required` (owner is mandatory when creating a new tenant) |
            `invalid_tenant_id` (id is not a UUID) |
            `cross_realm_tenant_id` (id exists in another realm) |
            `invalid_created_at` (not RFC3339) |
            `owner_missing_identifier` | `owner_invalid_email` |
            `owner_invalid_phone` | `owner_incomplete_provider` |
            `owner_unknown_provider` | `owner_invalid_user_id` |
            `cross_tenant_owner_id` (owner.user_id exists in another tenant) |
            `owner_already_set` (a different owner is already seated) |
            `invalid_signup_mode` (not closed|allowlist|open, or `open` on a
            non-base-admin tenant)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            `base_realm_no_orgs` — `pid` is the base realm, which holds
            ONLY admin tenants (ADR-015); plain orgs cannot be created
            there. Also returned when the caller does not administer the
            platform realm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: platform_not_found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `signup_mode_immutable_on_reconcile` — a BYO-`id` reconcile supplied
            a `signup_mode` that differs from the tenant's current one. Nothing
            is written. Use `PATCH /tenants/{id}/config`; the same value is a
            no-op, so repeated imports stay idempotent.

            `single_tenant_membership` — the realm sets
            `single_tenant_membership` (ADR-092 D4) and the inline `owner`'s
            email already holds an ACTIVE membership in another tenant of this
            realm. Creating an org always creates a membership (its owner), so
            org-create is a membership-creating path. Refused, never moved: the
            user must leave their current organization first. Nothing is
            written — the tenant is not created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Platforms]
      summary: List tenants in a platform realm
      description: |
        **Gated on `tenants:read` (ADR-091 D2)**, a new catalog entry in this
        release.

        Rows carry the dashboard rollup columns `users_count` and
        `last_activity_at` (see `Tenant`) — computed for the whole realm in one
        aggregate, not per row. Both are ABSENT rather than `0` when
        unavailable.

        Paginated (SPEC §7), oldest-first: `limit` defaults to 50, capped at 200.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantListPage' }

  /platforms/{pid}/stats:
    parameters:
      - in: path
        name: pid
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Platforms]
      summary: Platform KPI rollup (orgs, users, sessions·24h, MFA coverage)
      description: |
        Backs the platform-overview KPI strip in the admin console. Cached
        in-process for 30 seconds per platform; `generated_at` reports the
        snapshot time.

        Every field's definition is spelled out on the `PlatformStats` /
        `PlatformMFACoverage` schemas — read them before rendering a number.
        In particular `sessions_24h` counts human sign-ins (session CREATION),
        not requests or token mints, and `mfa_coverage` counts CONFIRMED
        enrollments only.

        **Authz (ADR-074):** the `users:read` permission. The platform owner
        and the platform's own service/platform token are implicit-all; any
        other member needs a realm role granting `users:read`. Per ADR-067
        base-realm (RealmID) staff get no special path — they cannot read the
        stats of a platform they do not own.
      security:
        - BearerAccess: []
        - BearerService: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformStats' }
        '403':
          description: forbidden — missing `users:read` on this platform
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: platform_not_found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tenants/{tid}/users/{uid}/user-api-keys:
    parameters:
      - in: path
        name: tid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: uid
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [User API Keys]
      summary: Mint a user API key (plaintext returned once)
      description: |
        `{uid}` MUST be the caller. Keys are self-service, with no override —
        an admin minting a credential that authenticates **as** a member is
        impersonation by another name, and ADR-039 is deliberately unbuilt.

        **Changed in ADR-091**: the `user_api_keys.admin_mint_allowed` escape
        hatch is **removed**. It is no longer a config key at all — PATCHing it
        answers `400 unknown_config_key` rather than being silently dropped.

        Minting is a **step-up operation** when
        `user_api_keys.require_mfa_at_mint` is on (the default whenever the realm
        has MFA enabled): it answers `412 mfa_required` with a challenge. That is
        one mechanism with the floor exemption — a key is by definition used with
        no human present, so MFA can only bind at mint time, and key exchange is
        exempt from the realm MFA floor only if MFA was proven here.

        Key-derived tokens carry `amr: ["api_key"]` with **no** `mfa` entry, so a
        key can never satisfy a step-up gate downstream.

        **BREAKING — new in ADR-097 §E: minting is BFF-only.** This route now
        requires a **platform bearer** in `Authorization`, carrying the acting
        user's access JWT in `X-User-Token` — the same ADR-050 shape the rest of
        the partner-mediated surface uses. A bare user access token answers
        `401 wrong_scope`.

        The escort must belong to the **target user's own realm**: a platform
        bearer from a different realm answers `403 realm_mismatch`. RealmID's own
        console satisfies this the same way a partner does — it IS the BFF for
        RealmID, which is a platform on RealmID — and consequently can no longer
        mint a key in a partner realm.

        A user API key is a long-lived credential. Creating one is the operation
        that must be mediated by a confidential backend; **`GET` and `DELETE` on
        this collection are deliberately unchanged**, because reading and
        revoking a key you already hold is not credential issuance.

        *Consequence for the `realm-id` CLI:* it holds a user token and cannot
        satisfy this escort, so `user-api-keys create` is filtered out of its
        command tree. `list` and `revoke` are unaffected.
      security: [{ BearerPlatformToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAPIKeyCreateRequest' }
      responses:
        '201':
          description: Created — `value` is shown once and never again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAPIKey' }
        '400':
          description: |
            `ttl_exceeds_max` · `non_expiring_not_allowed` ·
            `all_orgs_not_allowed` · `org_not_a_membership` ·
            `too_many_permissions` · `unknown_permission` (realmid audience only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: |
            `wrong_scope` — ADR-097 §E: this route requires a platform bearer
            (`token_class=platform`). A bare user access token is refused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: |
            `forbidden` — minting for a user other than the caller ·
            `realm_mismatch` — ADR-097 §E: the platform bearer belongs to a
            different realm than the target user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`too_many_active_keys` — the per-user active quota is full.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: '`user_api_keys_disabled` · `mfa_required` (step-up challenge).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [User API Keys]
      summary: List a user's API keys
      description: |
        Returns the label plus a non-secret hash prefix — never the plaintext.
        `{uid}` must be the caller, or an org admin holding `user_api_keys:read`
        while the realm's `user_api_keys.org_admin_visible` is on (default).

        `user_api_keys:read` / `:manage` are distinct from `platform_api_keys:read` /
        `:manage` on purpose: an org admin managing members' keys must not
        thereby gain platform-key power.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAPIKeyListPage' }
        '403':
          description: '`forbidden`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: '`user_api_keys_disabled`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tenants/{tid}/users/{uid}/user-api-keys/{id}:
    parameters:
      - in: path
        name: tid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: uid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [User API Keys]
      summary: Revoke a user API key (soft)
      description: |
        Soft revoke — sets `revoked_at`; the row is retained for audit and stops
        consuming an active-quota slot.

        Revocation is effective at the next **exchange**: the key can no longer
        be swapped for a token. Any access token already minted from it remains
        valid for the remainder of its TTL, which bounds the staleness window.
        User keys mint **user-class** sessions that refresh via `MintForTenant`,
        NOT `mintForM2MRefresh`, so ADR-085 §4's admin-key refresh re-check does
        not apply here; if user keys are ever given a long-lived refresh, that
        decision has to revisit this.
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: |
            Revoked (idempotent on an already-revoked key). Documented as 200,
            not 204: ForceStatus200Middleware rewrites every DELETE so the
            `{status:...}` body GoFr's native 204 would drop survives.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [revoked] }
                  id: { type: string, format: uuid }
        '403':
          description: '`forbidden`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such key for this user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ----------------------------------------------------- Platform admin
  #
  # ADR-044 (v0.5.0): admin api-keys, config, and role routes moved from
  # /realms/{id}/... to /platforms/{id}/.... Every retained handler
  # requires a base-realm admin user JWT (ADR-043). The /realms/...
  # namespace is now reserved for OIDC discovery + JWKS only.
  #
  # POST /realms was deleted in this same cut; partner realms are
  # provisioned via POST /platforms (self-serve), and the base realm is
  # provisioned by cmd/realmid-seed.

  /platforms/{id}/api-keys:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platform Admin]
      summary: Generate an API key (raw key returned once)
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAPIKeyRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKey' }
        '400':
          description: |
            `invalid_ttl` (below the 300s floor, or `ttl_seconds` sent together
            with `non_expiring`) · `non_expiring_not_allowed` (the realm already
            holds a non-expiring platform key) · `scope_mismatch` ·
            `invalid_user_for_api_key` · `no_default_bot_user`.

            **New in ADR-091 (D3/D6):**

            - `platform_mgmt_api_is_wif_only` — the `platform_mgmt_api` role is
              reachable over ADR-057 WIF only and can never hold an api key. A
              long-lived secret for the role that rotates secrets defeats the
              rotation it exists to perform.
            - `ambiguous_bot_user` — the realm has more than one candidate bot
              user, so the binding cannot be inferred. Previously the code took
              `candidates[0]`, which made the credential's identity depend on
              row order. Name the `user_id` explicitly.

            A key now binds **only** to the realm's `platform_api` bot; the
            admin tenant's OWNER is refused, closing the path by which a key
            could carry a human's authority.
        '403':
          description: |
            `api_key_cannot_mint_api_key` — the bearer was itself bootstrapped
            by presenting a platform api-key, and a key may not mint its own
            successor. The successor would survive revocation of the key that
            made it (nothing links the two), so a leaked credential would become
            permanent access — the same property ADR-089 removed at the
            refresh-token surface.

            Mint with an identity that is **not** a platform api-key: an
            ADR-057 **WIF-bootstrapped** session (the recommended automated
            rotation channel) or a **human owner/admin** login. Note this is
            keyed on how the token was obtained (`azp`), not on class — WIF also
            mints `token_class=platform`. `DELETE` and `GET` on this collection are
            unrestricted.

            `platform_api_key_login_disabled` — **new in ADR-091 (D6.4)**: a
            realm that has turned platform-api-key login off now refuses the
            MINT as well, not only the login. Previously a key could still be
            created in a keyless realm, which produced exactly the forgotten,
            never-exercised secret that ADR-085 §3's default expiry exists to
            age out.
        '409':
          description: |
            `too_many_api_keys` — ADR-085 §2 caps a realm at **2 active
            platform keys**: one steady-state key plus one rotation slot.
            Revoked and expired keys do not consume a slot. Per-workload
            separation belongs to WIF bindings (uncapped, ADR-057), not to
            extra keys.
    get:
      tags: [Platform Admin]
      summary: List API keys for a platform (SDK SPEC §6.5)
      description: |
        Caller must hold a base-realm admin user JWT authorized for this
        platform's realm. Cross-realm access is denied with 404 to avoid
        leaking realm existence. Plaintext key values are not echoed.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKeyListPage' }

  /platforms/{id}/api-keys/{keyId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: keyId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Platform Admin]
      summary: Revoke an API key (SDK SPEC §6.5)
      description: |
        Soft-revokes by setting `revoked_at = now()`. Subsequent
        `POST /auth/login` calls with the matching key (under
        `grant_type=api_key` or `grant_type=platform_api_key`)
        return 401 `revoked_api_key`.
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOK' }
        '404':
          description: api_key_not_found

  /platforms/{id}/config:
    get:
      tags: [Platform Admin]
      summary: Read the platform realm's config (the PATCH allowlist, read-only)
      description: |
        Read counterpart of the PATCH below — added because the realm config
        used to be write-only, forcing every consumer (console settings panes,
        SDK, BFF) to PATCH blind against placeholder hints.

        Authz mirrors PATCH exactly: the platform owner, or a realm role
        granting `platform:config` (ADR-074). There is no read-only variant of
        that permission — whoever may change the config may read it.

        The response body carries **exactly** the key set `RealmConfigPatch`
        accepts, never more: RealmConfig fields with no patch counterpart
        (`suspended_at`, `suspend_reason` — internal-ops suspend state) are not
        exposed here. No key is omitted; the zero value means "unset" and the
        documented default applies (`0` for ints, `""` for strings, `false` for
        booleans, `[]` for the claim-key allowlist). Values are returned as
        stored — `""` is never normalised to a default, so a consumer can tell
        "never configured" from "explicitly set to the default".
        `refresh_absolute_expiry` is always the full object, with `mode`
        reported as `rolling` when unset.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  config: { $ref: '#/components/schemas/RealmConfigView' }
                  single_tenant_pending_reconciliation:
                    type: integer
                    description: >
                      ADR-092 D4. How many people still hold MORE THAN ONE
                      active membership in this realm. Present only while
                      `single_tenant_membership` is on.

                      It sits BESIDE `config`, never inside it, because it is
                      derived read-only state rather than a setting — placing
                      it in the settings bag would imply it is settable.

                      It exists because the knob may be turned on while users
                      still span tenants (the D5 picker drains them at each
                      next login). Without this number a realm can report
                      `single_tenant_membership: true` while N users are still
                      non-compliant — and a user who never logs in never
                      resolves — so "is this realm actually single-tenant yet?"
                      could only be guessed at.
        '403':
          description: forbidden — missing permission `platform:config`
        '404':
          description: realm_not_found
    patch:
      tags: [Platform Admin]
      summary: Update the platform realm's config (allowlisted keys only)
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RealmConfigPatch' }
      responses:
        '200':
          description: OK
        '400':
          description: unknown_config_key | invalid_config_value

  /platforms/{id}/federation-bindings:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Platform Admin]
      summary: List workload identity federation bindings (ADR-057)
      description: |
        Lists the platform's trust bindings. Gated on the platform owner
        or a realm role granting `federation:read` (ADR-074). Paginated
        envelope.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FederationBindingListPage' }
        '403':
          description: not_authorized (caller is not a realm admin / owner)
        '404':
          description: realm_not_found | federation_disabled
    post:
      tags: [Platform Admin]
      summary: Register a federation binding (ADR-057)
      description: |
        Registers a trust binding. The `issuer` must be an RI-known provider
        (v1: GCP `accounts.google.com` or GitHub
        `token.actions.githubusercontent.com`); `match_claims` must constrain
        at least the provider's mandatory claim (GCP `sub` — the SA's numeric
        `uniqueId`; GitHub `repository`). `audience` is forced to the global RI
        constant. 409 `binding_exists` if an active binding already has the
        same `(issuer, match_claims)` tuple.
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer, match_claims]
              properties:
                issuer: { type: string }
                match_claims:
                  type: object
                  additionalProperties: { type: string }
                mapped_role:
                  type: string
                  default: platform_api
                  description: |
                    The realm role a workload assuming this binding acts as.

                    **Validated since ADR-091 (D2)**: the name must resolve in
                    the binding's GOVERNING realm — which for an admin tenant is
                    the BASE realm, not the platform realm. An unresolvable name
                    is refused with `400 invalid_mapped_role` instead of being
                    stored and silently minting a role that grants nothing.
                scope:
                  type: array
                  items: { type: string }
            example:
              issuer: https://token.actions.githubusercontent.com
              match_claims: { repository: acme/billing, environment: prod }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FederationBinding' }
        '400':
          description: |
            `unknown_issuer` | `unconstrained_binding` |
            `missing_mandatory_claim` | `invalid_mapped_role` (ADR-091 D2 — the
            role does not resolve in the governing realm)
        '403':
          description: not_authorized (caller is not a realm admin / owner)
        '404':
          description: realm_not_found | federation_disabled
        '409':
          description: binding_exists

  /platforms/{id}/federation-bindings/{bid}:
    delete:
      tags: [Platform Admin]
      summary: Revoke a federation binding (ADR-057)
      description: |
        Soft-deletes (revokes) the binding: it is marked `status=revoked` and
        immediately stops authenticating workloads, but the row is retained for
        audit. Gated on the platform owner or a realm role granting
        `federation:manage` (ADR-074). Idempotent only in that a second
        call on an already-removed id returns 404.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: bid
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [revoked] }
                  id: { type: string, format: uuid }
        '403':
          description: not_authorized (caller is not a realm admin / owner)
        '404':
          description: binding_not_found | federation_disabled

  /platforms/{id}/permissions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Platform Admin]
      summary: List the grantable permission catalog (ADR-074)
      description: |
        Returns the fixed catalog of `resource:action` permission strings a
        partner may grant to a custom (non-owner) role. The admin UI renders
        this as a grouped checklist so it never hardcodes the list. Gated by
        `roles:read` (owner + realm/platform tokens always pass). Not paginated
        — the catalog is small and fixed.
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: object
                      properties:
                        key:      { type: string, example: users:manage }
                        resource: { type: string, example: users }
                        action:   { type: string, example: manage }
                        label:    { type: string, example: Manage users (role, status, contacts) }
  /platforms/{id}/starter-roles:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platform Admin]
      summary: Opt into RealmID's starter role templates
      description: |
        Creates the named starter templates (`admin`, `viewer`) in this realm's
        catalog, pre-filled with their ADR-074 permission sets — a shortcut for
        authoring them by hand in the role editor.

        Starter roles are **opt-in as of issuer v0.54.0**. A freshly-created
        realm holds only the three system rows (`owner`, `member`,
        `platform_api`); before v0.54.0 `admin` and `viewer` were seeded
        unconditionally, which handed every realm a 23-permission operator role
        it never asked for and created the name partner role-imports most often
        collide with. The same opt-in is available at creation time via
        `starter_roles` on `POST /platforms`.

        Idempotent, and **never destructive**: seeding is ON CONFLICT DO
        NOTHING, so a name the realm already holds — whether from an earlier
        call or a partner-authored role that happens to be called `admin` — is
        left completely untouched, with its own permissions. The response
        echoes the rows that now exist under the requested names, so a caller
        can see whether a pre-existing role was preserved.

        **Owner-only (ADR-091 D3).** `roles:manage` was RETIRED from the
        permission catalog: authority over a realm's role vocabulary is not
        delegable, because a role that can edit roles can widen itself. This is
        an explicit owner-pointer check, not an unmatchable permission string.
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starter_roles]
              properties:
                starter_roles:
                  type: array
                  description: |
                    Subset of the offered templates. An unknown name is
                    rejected with 400 `unknown_starter_role` rather than
                    silently skipped, so a typo cannot leave an owner believing
                    they provisioned a role that does not exist.
                  items: { type: string, enum: [admin, viewer] }
      responses:
        '200':
          description: The roles now present under the requested names.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleObject' }
        '400':
          description: unknown_starter_role / missing_fields
        '403':
          description: '`forbidden` — realm owner only (ADR-091 D3)'
        '404':
          description: realm_not_found
  /platforms/{id}/roles:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Platform Admin]
      summary: List role catalog (ADR-040)
      description: |
        Returns the platform realm's role catalog: the system rows `owner` + `member`
        plus every custom role registered via POST. Gated on the platform
        owner or a realm role granting `roles:read` (ADR-074).
      security: [{ BearerAccess: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: include_system
          schema: { type: boolean, default: false }
          description: |
            `true` re-includes the `platform_api` system role (the
            ADR-041 API-key bot role, never human-assignable), which is
            hidden from the catalog by default. For internal/debug
            callers.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleListPage' }
    post:
      tags: [Platform Admin]
      summary: Create a custom role (ADR-040)
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400':
          description: invalid_role_name | display_name_required | unknown_permission (ADR-074) | unknown_mfa_method (ADR-075)
        '409':
          description: role_exists

  /platforms/{id}/roles/{roleId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: roleId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Platform Admin]
      summary: Edit a custom role (ADR-040)
      description: |
        PATCH semantics — missing keys preserve existing values. Returns
        400 `system_role_immutable` when `roleId` references a system role.
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchRoleRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400':
          description: system_role_immutable | display_name_required (cannot be cleared to blank) | unknown_permission (ADR-074) | unknown_mfa_method (ADR-075)
        '404':
          description: role_not_found
    delete:
      tags: [Platform Admin]
      summary: Delete a custom role (ADR-040, migration ADR-074)
      description: |
        Returns 409 `role_in_use` when any user or pending invitation in
        any tenant of the platform's realm references the role. System
        roles return 400 `system_role_immutable`.

        ADR-074/Phase 3: pass `?migrate_to=<role name>` to reassign every
        holder of this role to the target role and delete it in ONE
        transaction, bypassing the 409. The target must exist in the realm,
        be enabled, not be `platform_api`, and differ from the role being
        deleted (else 400 `unknown_migrate_target` / `migrate_target_disabled`
        / `invalid_migrate_target`). The `role_protected` / `role_is_default`
        / `last_active_role` guards still apply.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: query
          name: migrate_to
          required: false
          description: Role name to reassign this role's holders to before deletion.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOK' }
        '400':
          description: system_role_immutable | unknown_migrate_target | migrate_target_disabled | invalid_migrate_target
        '404':
          description: role_not_found
        '409':
          description: role_in_use (only when migrate_to is absent)

  /platforms/{id}/roles/{roleId}/rename:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: roleId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platform Admin]
      summary: Atomically rename a custom role (ADR-040)
      description: |
        Renames the catalog row AND every reference to it inside the platform's
        realm, in one transaction: `users.role`, `invitations.role` and every
        other role's `can_invite_roles`.

        `can_invite_roles` and `invitations.role` were **added in ADR-097** (D1
        and D2). Before that, renaming a role silently stripped "may invite at
        this tier" from every role that had it — a CLOSED failure, so nothing
        errored and nothing logged.

        System roles return 400 `system_role_immutable`. Target name collision
        returns 409 `target_exists`.
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameRoleRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400':
          description: invalid_role_name | system_role_immutable | invalid_rename
        '404':
          description: role_not_found
        '409':
          description: target_exists

  /platforms/{id}/scopes/rename:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: query
        name: dry_run
        required: false
        schema: { type: boolean }
        description: |
          When `true`, returns the counts a real run would produce and writes
          NOTHING. The preview is computed by performing the real updates inside
          a transaction that is then rolled back, so the number you confirm is
          the number the write produces — a preview counted by a separate query
          would be a second implementation of the same predicate, and the two
          would drift.
    post:
      tags: [Platform Admin]
      summary: Rename an ADR-097 scope string across the realm
      description: |
        **ADR-097 §F.** Renames one of YOUR scope strings everywhere RealmID
        stores one, for this realm, in a single transaction. Today that is
        exactly one place:

        - `user_api_keys.permissions_cap` — the cap a key's minted `scope` is
          intersected against

        RealmID stores no partner catalog and understands none of these strings
        (ADR-097 #1/#6). This endpoint exists because a scope is stored **by
        value** and is not a foreign key, so renaming one is an operation you
        cannot do safely by hand.

        `realm_roles.permissions` is **deliberately not renamed**: it is
        validated against RealmID's own ADR-074 catalog on every role write, in
        every realm, so it cannot hold your vocabulary — and renaming an
        enforced RealmID permission would fail closed and silently. The `roles`
        count in the response is therefore always `0`; it is kept so a client
        written against the originally-documented shape still parses.

        **One transaction.** A partial rename splits the vocabulary, and the
        forgotten half fails CLOSED and silently — exactly the defect ADR-097 D1
        found in the role rename. The next column that starts holding a scope
        string is added inside this transaction.

        **Idempotent.** A second run finds nothing named `from`, reports zeroes,
        and writes nothing.

        **Deduped on collision.** A row holding BOTH `from` and `to` ends with
        one `to`. That merge is also why a rename is **not reversible in
        general** — it destroys the information a reversal would need — and why
        the dry run and the audit record (`scope.rename`, carrying actor, both
        strings and both counts) are mandatory rather than convenient.

        **Case-sensitive**, matching the mint. `Read` and `read` are two
        distinct scopes, so renaming one to the other is a legitimate merge.

        **Owner-gated** (`requireRealmOwner`), the same gate as the role rename:
        renaming the vocabulary your permission model is expressed in is not a
        permission you delegate — ADR-091 D3 retired `roles:manage` from the
        catalog on that argument.

        **Removal is NOT offered** (ADR-097 #5). It is destructive in a way a
        rename is not and needs its own confirmation design.

        **Refused on a `realmid`-audience realm** (`realmid_audience_immutable`).
        There, `permissions_cap` entries are validated against RealmID's OWN
        catalog at mint, so a rename could write a string past that gate and the
        cap would quietly stop matching anything. This is the one place RealmID
        knows a vocabulary — its own, as a platform on RealmID.
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameScopeRequest' }
      responses:
        '200':
          description: OK — counts are ROWS changed, not occurrences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenameScopeResponse' }
        '400':
          description: |
            `bad_request` (from/to missing) ·
            `invalid_scope` (not an RFC 6749 §3.3 scope-token — note `from` is
            validated too: a `from` containing a space could never match a
            stored scope, so accepting it would guarantee a silent zero-row
            "success") ·
            `scope_too_long` · `invalid_rename` (from == to) ·
            `realmid_audience_immutable`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`forbidden` — realm owner only.'
        '404':
          description: realm_not_found
        '501':
          description: '`not_implemented` — no scope store wired on this deployment.'

  /platforms/{id}/roles/{roleId}/disable:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: roleId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platform Admin]
      summary: Disable a role
      description: |
        Hides the role from the invite/assignment surface without deleting it
        (existing holders keep the role). `owner` and `platform_api` are
        protected (400 `role_protected`). Disabling the realm's current default
        invitation role returns 400 `role_is_default`. The realm must keep at
        least one enabled, human-assignable role (excluding owner/platform_api)
        — else 400 `last_active_role`.
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400':
          description: role_protected | role_is_default | last_active_role
        '404':
          description: role_not_found

  /platforms/{id}/roles/{roleId}/enable:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: roleId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platform Admin]
      summary: Re-enable a disabled role
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '404':
          description: role_not_found

  /platforms/{id}/integrations:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Platform Admin]
      summary: List published integrations (ADR-082/083, SOURCE side)
      description: |
        Lists the integrations this platform publishes for other realms' orgs to
        install. Gated on the platform owner or a realm role granting
        `integrations:read` (ADR-083 §5). Publishing an integration is a
        delegable capability; editing the realm's role vocabulary is not
        (ADR-091 D3 retired `roles:manage` and made roles owner-only).
      security: [{ BearerAccess: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200':
          description: OK
    post:
      tags: [Platform Admin]
      summary: Register an integration (ADR-083 §4.1)
      description: |
        Registers a source integration once, at realm level. Gated on
        `integrations:manage`. A target org later installs it (see
        POST /tenants/{id}/integration-installations).
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, display_name]
              properties:
                slug: { type: string, description: '2-48 chars, lowercase alphanumerics + single hyphens; unique per realm' }
                display_name: { type: string }
                description: { type: string }
                homepage_url: { type: string }
                listed: { type: boolean, default: false, description: 'directory opt-in (ADR-083 §6.1; listing API deferred)' }
      responses:
        '201':
          description: Created
        '400':
          description: invalid_slug | display_name_required
        '409':
          description: slug_taken

  /platforms/{id}/integrations/{iid}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: iid
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Platform Admin]
      summary: Update an integration (ADR-083 §4.1)
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                description: { type: string }
                homepage_url: { type: string }
                listed: { type: boolean }
      responses:
        '200':
          description: OK
        '404':
          description: integration_not_found
    delete:
      tags: [Platform Admin]
      summary: Delete (permanently disable) an integration — SOURCE half of two-ended revocation (ADR-082 §6.3)
      description: |
        Permanently disables the integration, halting every mint. Modelled as a
        disable rather than a hard delete so the target orgs' inbound-access
        history (ADR-083 §4.5) is not silently rewritten.
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
        '404':
          description: integration_not_found

  /platforms/{id}/integrations/{iid}/disable:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: iid
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platform Admin]
      summary: Disable an integration (reversible; halts mints)
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
        '404':
          description: integration_not_found

  /platforms/{id}/integrations/{iid}/enable:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: iid
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platform Admin]
      summary: Re-enable a disabled integration
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
        '404':
          description: integration_not_found

  /platforms/{id}/signing-keys:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Platform Admin]
      summary: List the realm's signing keys + rotation policy
      description: |
        Owner-scoped read of the realm's JWKS keyring: each key's kid,
        created/active-until/retire timestamps, and which one is current, plus
        the effective rotation policy (mode + interval + next auto-rotation).
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningKeysResponse' }
        '404':
          description: platform_not_found

  /platforms/{id}/signing-keys/rotate:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platform Admin]
      summary: Self-serve rotate the realm's signing key
      description: |
        Realm-admin (platform owner) rotation of the realm's active signing
        key. Mints a fresh key; prior keys stay published in JWKS through their
        overlap window. Rate-limited to one rotation per 60s (429
        `rate_limited`). Mirrors the base-staff
        `/admin/platforms/{id}/signing-keys/rotate` route.
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotateSigningKeyResponse' }
        '404':
          description: platform_not_found
        '429':
          description: rate_limited

  # ----------------------------------------- Identity providers (ADR-046, v0.5.3)
  #
  # Symmetric realm/tenant config in one table (`identity_providers`).
  # Public discovery endpoints are scope-shaped and unauthenticated; admin
  # writes share the `/identity-providers` namespace and key by row id.

  /platforms/{id}/identity-providers:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: query
        name: platform
        required: false
        schema:
          type: string
          enum: [web, ios, android, desktop, other]
          default: web
      - in: query
        name: tenant_id
        required: false
        schema: { type: string, format: uuid }
        description: |
          Optional tenant pin (ADR-047 §1). When present, the response
          is scoped to the tenant — replaces the deprecated
          `/platforms/{id}/tenants/{tid}/identity-providers` variant.
    get:
      tags: [Auth]
      summary: Identity-provider discovery for a realm-or-tenant scope
      description: |
        ADR-047 (redrafted 2026-05-02): platform-token-auth only. The
        partner backend calls this through the SDK; browsers do not
        call RealmID directly. Origin enforcement moves into the SDK.
        Returns every enabled row matching the requested `client_type`.
      security: [{ BearerPlatformToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicIdentityProviderResponse' }
        '400':
          description: bad_platform
        '401':
          description: unauthorized | wrong_scope
        '403':
          description: realm_mismatch
        '404':
          description: realm_not_found | tenant_not_found
        '410':
          description: realm_suspended

  /platforms/{id}/tenants/{tid}/identity-providers:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: tid
        required: true
        schema: { type: string, format: uuid }
      - in: query
        name: platform
        required: false
        schema:
          type: string
          enum: [web, ios, android, desktop, other]
          default: web
    get:
      deprecated: true
      tags: [Auth]
      summary: (Deprecated) tenant-scoped identity-provider discovery
      description: |
        DEPRECATED 2026-05-02 — alias of
        `GET /platforms/{id}/identity-providers?tenant_id=<tid>` retained
        for one release per ADR-047. Removed in v0.7.0. Same
        platform-token gate.
      security: [{ BearerPlatformToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicIdentityProviderResponse' }
        '401':
          description: unauthorized | wrong_scope
        '403':
          description: realm_mismatch
        '404':
          description: realm_not_found | tenant_not_found
        '410':
          description: realm_suspended

  /identity-providers:
    get:
      tags: [Platform Admin]
      summary: List identity-provider rows (admin view)
      description: |
        Returns full row shape including disabled rows. `platform_id` is
        required; pass `tenant_id` to scope the query to a tenant. Caller
        must hold a base-realm admin user JWT for `platform_id`.
      parameters:
        - in: query
          name: platform_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: tenant_id
          required: false
          schema: { type: string, format: uuid }
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProviderList' }
        '400':
          description: missing_platform_id
        '404':
          description: realm_not_found | tenant_not_found
    post:
      tags: [Platform Admin]
      summary: Register an identity-provider row
      description: |
        Adds one row scoped to either a realm (omit `tenant_id`) or a
        tenant (set `tenant_id`). Validation:

        - `provider` ∈ {google, microsoft, facebook, apple}
        - `client_type` ∈ {web, ios, android, desktop, other}
        - `client_type=web` requires non-empty `allowed_origins`, each
          parsing as a URL with scheme + host
        - `client_type≠web` rejects any `allowed_origins` (400)
        - `(entity_type, entity_id, provider, client_type)` unique
          → 409 on conflict
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIdentityProviderRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProvider' }
        '400':
          description: |
            missing_platform_id | unsupported_provider |
            unsupported_client_type | bad_request | app_not_found
            (`app_id` does not reference a known source) |
            app_platform_mismatch (`app_id` belongs to a different
            platform) | app_kind_mismatch (`app_id` references a bot
            source; ADR-072 § Amendment)
        '404':
          description: realm_not_found | tenant_not_found
        '409':
          description: provider_exists

  /identity-providers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Platform Admin]
      summary: Update an identity-provider row
      description: |
        Sparse update. At least one of `enabled`, `client_id`,
        `allowed_origins`, `comments` is required.
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchIdentityProviderRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProvider' }
        '400':
          description: |
            empty_patch | bad_request | app_not_found |
            app_platform_mismatch | app_kind_mismatch (re-binding
            `app_id`; ADR-072 § Amendment)
        '404':
          description: provider_not_found
    delete:
      tags: [Platform Admin]
      summary: Remove an identity-provider row
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOK' }
        '404':
          description: provider_not_found

  # ---------------------------------------------------------------- Sources (ADR-072)

  /sources:
    get:
      tags: [Platform Admin]
      summary: List app/source registrations
      description: |
        Returns every source (including disabled) for a platform. A source is a
        first-class client app (web/android/ios/desktop human app, or the `bot`
        service-account app) and carries `allowed_methods` — ADR-072 mapping-2,
        the login methods that app surfaces. Gated on
        `requireRealmPermission(platform_id, "sources:read")` (ADR-074):
        the platform owner, the realm's own M2M token, or a member whose
        realm role grants `sources:read`.
      parameters:
        - in: query
          name: platform_id
          required: true
          schema: { type: string, format: uuid }
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceList' }
        '400':
          description: missing_platform_id
        '403':
          description: forbidden
    post:
      tags: [Platform Admin]
      summary: Register an app/source
      description: |
        Creates a platform-level source. Validation (ADR-072 §0 — mapping-2 can
        never weaken the mapping-1 safety invariant):

        - `type` ∈ {web, android, ios, desktop, bot}
        - a `bot` source may list only `otp` in `allowed_methods`
        - a human source (web/android/ios/desktop) may never list `otp`; each
          method must be a recognised human provider (google/microsoft/apple/
          facebook/firebase)

        The `bot` source is normally auto-provisioned when the first service
        account is created (one per platform); this endpoint lets an owner
        register sources explicitly. Writes are gated on
        `requireRealmPermission(platform_id, "sources:manage")` (ADR-074).
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSourceRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '400':
          description: missing_platform_id | unsupported_type | method_violates_kind | bad_request
        '403':
          description: forbidden
        '404':
          description: realm_not_found

  /sources/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Platform Admin]
      summary: Update an app/source
      description: |
        Sparse update. At least one of `label`, `allowed_methods`, `enabled` is
        required. A patched `allowed_methods` is re-validated against the
        source's (immutable) type — mapping-2 can never weaken mapping-1.
        Gated on `sources:manage` (ADR-074).
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchSourceRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '400':
          description: empty_patch | method_violates_kind | bad_request
        '403':
          description: forbidden
        '404':
          description: source_not_found
    delete:
      tags: [Platform Admin]
      summary: Remove an app/source (`sources:manage`, ADR-074)
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusOK' }
        '403':
          description: forbidden
        '404':
          description: source_not_found

  # ---------------------------------------------------------------- Tenants

  /tenants:
    get:
      tags: [Tenants]
      summary: List tenants (membership-filtered)
      description: |
        Paginated (SPEC §7). The listing is oldest-first, so a freshly created
        tenant lands on the LAST page — a caller looking for a specific row must
        follow `next_cursor` rather than reading page 1. `limit` defaults to 50
        and is capped at 200.
      security: [{ BearerAccess: [] }, { BearerService: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantListPage' }

  /tenants/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Tenants]
      summary: Get a tenant
      description: |
        Readable by any member of the tenant AND by the owner of the parent
        realm's admin tenant (a platform owner over one of their orgs; RI over
        a platform's admin tenant) — ADR-067's G-014 parent branch.

        The response carries `member_count`, `pending_invitation_count` and
        `last_activity_at`. Those aggregates exist for the parent persona, who
        can read this record but CANNOT read `GET /tenants/{id}/users` — that
        gate has no parent branch, deliberately. All three are best-effort:
        absent means "not computed", never `0`.
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
    patch:
      tags: [Tenants]
      summary: Rename or change status
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
    delete:
      tags: [Tenants]
      summary: Soft-delete a tenant
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK

  /tenants/{id}/config:
    patch:
      tags: [Tenants]
      summary: Update tenants.config (allowlist)
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantConfigPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400':
          description: unknown_config_key | invalid_config_value

  /tenants/{id}/owner:
    put:
      tags: [Tenants]
      summary: Transfer ownership to another tenant member
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferOwnerRequest' }
      responses:
        '200':
          description: OK
        '400':
          description: |
            recipient_not_member | recipient_not_active | already_owner |
            conflicting_outgoing_disposition | invalid_identifier |
            recipient_contact_unproven — `new_owner_email` matched a contact in
            the tenant that its holder has NOT verified (spec `0.26.0`). An
            address written by an admin is an assertion, and the ownership
            pointer is the one write that must not follow one: a member with
            `users:manage` can write a contact at an unclaimed address and have
            it resolve to their own row. Name the recipient with `owner_user_id`
            (which names a row, not an address, and is unaffected), or have the
            holder verify the address first. Provisioning a NEW row on the
            parent path is unchanged — at an address nobody holds there is no
            identity to confuse.
        '403':
          description: caller is neither the tenant's owner nor its G-014 parent
        '404':
          description: user_not_found (unmatched email on the owner path)
        '409':
          description: |
            `identifier_collision` |
            `single_tenant_membership` — the realm sets
            `single_tenant_membership` (ADR-092 D4) and the recipient already
            holds an ACTIVE membership in another tenant of this realm. Applies
            both when the parent path would PROVISION the named email into the
            org and when the recipient is an existing member: an owned org is
            what the D5 picker cannot drain (`owner_user_id` is NOT NULL), so
            the transfer would make a transient violation permanent. Refused,
            never moved — nothing is written.

  /platforms/{id}/login-attempts:
    get:
      tags: [Platforms]
      summary: Login-history trail (platform owner; I-16)
      description: |
        Recent login attempts (success + failure) for the platform's realm —
        the `design.md` §Login History trail. Realm-scoped: the realm is always
        known on an attempt while the tenant often is not (a failed login never
        resolves one). Each row carries the outcome (`success` / `invalid_token`
        / `not_invited` / `suspended` / `error` — the CHECK-pinned vocabulary;
        finer error classes collapse), the login identifier, the method, and a
        timestamp. Gated on the ADR-074 realm permission `audit:read` (owner is
        implicit-all); keyed off the login's realm so a platform owner sees only
        their own end-users' attempts (ADR-067). `?limit` (default 100, max
        1000).
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          required: false
          schema: { type: integer, default: 100, maximum: 1000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        tenant_id: { type: string }
                        realm_id: { type: string }
                        identifier: { type: string }
                        outcome: { type: string }
                        method: { type: string }
                        ip: { type: string }
                        user_agent: { type: string }
                        created_at: { type: string, format: date-time }
        '403':
          description: forbidden (not the tenant owner)
  /tenants/{id}/users:
    get:
      tags: [Tenants]
      summary: List users in tenant (paginated, filterable per SDK SPEC §6.3)
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: role
          schema: { type: string, enum: [owner, admin, member, viewer] }
          description: Exact match. Invalid values return 400 `invalid_role`.
        - in: query
          name: status
          schema: { type: string, enum: [active, suspended, invited, deactivated] }
          description: Exact match. Invalid values return 400 `invalid_status`.
        - in: query
          name: q
          schema: { type: string }
          description: Case-insensitive substring match on email.
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListPage' }

  /tenants/{id}/users/import:
    post:
      tags: [Tenants]
      summary: Bulk-import pre-provisioned active users (ADR-073 Release B)
      description: |
        Provisions a batch of pre-trusted, **active** human users into one
        tenant. Distinct from the invite flow (ADR-017): imported users are
        `status='active'` with **verified** contacts, bound to their provider
        identity on first SSO (by `provider_uid` when supplied, else by
        email/phone match). Gated on
        `requireTenantPermission(id, "users:manage")` (ADR-074): the
        tenant's own owner, the realm's own M2M token, or a member whose
        realm role grants `users:manage`.

        **Two-phase, whole-file-atomic on validation.** Phase 1 validates every
        row and writes nothing; any structural error → `committed:false` with a
        per-row report and no writes. Phase 2 commits all only when phase 1 is
        clean. **Both cases return HTTP 200** (ADR-069 uniform-200 envelope) —
        the `committed` flag + `rows[]` report is authoritative, not the status.

        **Identity (ADR-073 §B.2):** a row may carry its own `user_id` (a UUID)
        which becomes `users.id`; a row without one gets a freshly-minted UUIDv7
        **returned** in the row result. A `user_id` that already exists in
        another tenant rejects the whole file (`cross_tenant_user_id`).

        **ADR-092 D4:** when the realm sets `single_tenant_membership`, a row
        whose email already holds an ACTIVE membership in another tenant of the
        realm fails phase 1 with `single_tenant_membership` — which rejects the
        WHOLE file, so nothing is written. There is no HTTP 409 here: the row
        report is the error channel (uniform-200). A row that RECONCILES an
        existing member of THIS tenant creates no membership and is exempt, so
        re-running an import over an already-migrated realm still works.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportUsersRequest' }
      responses:
        '200':
          description: |
            Import report. `committed:true` = all rows written;
            `committed:false` = validation rejected the file, nothing written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportUsersResponse' }

  /tenants/{id}/users/{uid}:
    get:
      tags: [Tenants]
      summary: User detail
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Tenants]
      summary: Patch a user's contact identifiers (email/phone)
      description: |
        ADR-042 P2 admin contact-patch flow (`gPatchUserContact`). Gated
        on `users:manage` (ADR-074). For each supplied non-empty value
        the handler soft-releases the user's currently-active contact of
        that kind, revokes its pending `contact_verifications`,
        supersedes any pending contact-drift review, inserts the new
        `user_contacts` row (unverified, `added_by=admin_entry`, with a
        30-day `slot_recycled_until` so a first IdP login on the slot
        triggers the owner-approval gate), rebuilds the user's contacts
        snapshot, and emits `user.contact_changed`. The four steps are
        idempotent but NOT wrapped in one transaction (hardening tracked
        separately). At least one of `email` / `phone` is required; a
        value equal to the current active contact is a no-op.

        This IS the ADR-077 §5 identity-rebind seam. Authz is `users:manage`
        (same-tenant) **or the direct parent** (break-glass, G-014 gate,
        never a grandparent). Every change fires the ADR-079 **bidirectional
        notification** (email old + new address; a phone change routes the
        alarm to the account email on record). A cross-user collision is
        rejected up front (409) so a failed rebind leaves the binding intact.

        **A PENDING INVITATION'S ADDRESS IS IMMUTABLE** (ADR-095 amendment,
        spec `0.25.0`). A user whose `status` is `invited` is refused with
        `400 invitation_address_immutable`. Re-pointing a live invitation at
        a different inbox changes who may accept it, while the ADR-092 D5
        lifecycle row keeps its original expiry, the new address is never
        notified, and the old address is never told the offer moved. To
        correct a typo'd invite address: `DELETE /tenants/{id}/invitations/{uid}`
        (which releases every contact) and invite the corrected address.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of email / phone required.
              properties:
                email: { type: string }
                phone: { type: string }
      responses:
        '200':
          description: OK — the updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: |
            bad_json | missing_fields (neither email nor phone supplied) |
            invitation_address_immutable (the user's status is `invited`;
            revoke the invitation and invite the corrected address)
        '404':
          description: user_not_found
        '409':
          description: identifier_collision (identifier already in use in this tenant)

  /tenants/{id}/users/{uid}/role:
    patch:
      tags: [Tenants]
      summary: Update a user's tenant role (SDK SPEC §6.3 `users.updateRole`)
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRoleRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  role: { type: string, enum: [admin, member, viewer] }
                  tenant_id: { type: string, format: uuid }
                  updated_at: { type: integer, format: int64 }
        '400':
          description: invalid_role | use_transfer_owner
        '403':
          description: forbidden (caller is not an owner of the tenant)
        '404':
          description: user_not_found
        '409':
          description: last_owner — cannot demote the only owner

  /tenants/{id}/users/{uid}/status:
    patch:
      tags: [Tenants]
      summary: Flip a user's status (PUT is mounted as an alias of PATCH)
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, suspended, invited, deactivated]
      responses:
        '200':
          description: OK

  /tenants/{id}/integration-installations:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Platform Admin]
      summary: List inbound integration access (ADR-083 §4.5, TARGET side)
      description: |
        The org owner's "who can act in my org, as what" list — every standing
        inbound installation with its source realm, role and last-used stamp.
        Gated on `org_grants:read`. This list is the sole way a new owner
        discovers foreign access inherited across an ownership transfer
        (ADR-082 §7.4), so a non-zero count must be surfaced at transfer.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200':
          description: OK
    post:
      tags: [Platform Admin]
      summary: Install an integration into this org (ADR-083 §4.2)
      description: |
        Admits a foreign integration, materialising a kind=service principal in
        this org that holds the chosen role. Gated on `org_grants:manage` (only
        the org owner by default). RI hosts no consent screen — this endpoint IS
        the consent surface, rendered by the partner's own console (ADR-083 §5).
        The role MUST be authored specifically for service use — its
        `assignable_to` must be exactly `["service"]` (ADR-082 §7.1); a role that
        merely permits service (e.g. `["human","service"]`) is rejected.
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [integration_id, role_id]
              properties:
                integration_id: { type: string, format: uuid }
                role_id: { type: string, format: uuid, description: 'a role whose assignable_to is exactly ["service"]' }
      responses:
        '201':
          description: Installed
        '400':
          description: invalid_integration_id | invalid_role_id | integration_disabled | invalid_role | role_not_installable | role_disabled | role_not_service_typed
        '404':
          description: integration_not_found | tenant_not_found
        '409':
          description: already_installed

  /tenants/{id}/integration-installations/{iid}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: iid
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Platform Admin]
      summary: Uninstall an integration — TARGET half of two-ended revocation (ADR-082 §6.3)
      description: |
        Revokes the edge so future mints fail, and suspends the service
        principal. Live access tokens are NOT revoked (they are
        signature-verified); the exposure is bounded by the fixed 600s
        access-token TTL (ADR-083 §4.4). Gated on `org_grants:manage`.
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
        '404':
          description: installation_not_found

  /tenants/{id}/invitations:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Invitations]
      summary: List invitations (paginated, filterable per SDK SPEC §6.2)
      security: [{ BearerAccess: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, accepted, revoked, expired] }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationListPage' }
    post:
      tags: [Invitations]
      summary: Create an invitation
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }

  /tenants/{id}/invitations/{inviteId}:
    delete:
      tags: [Invitations]
      summary: Revoke an invitation
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: inviteId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK

  # ------------------------------------------------ Service accounts (ADR-071)

  /tenants/{id}/service-accounts:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Service Accounts]
      summary: List the tenant's service accounts (owner/admin or service_accounts:read)
      description: |
        Lists the `kind=service` accounts in the tenant (ADR-071 §10).
        Caller must be owner/admin of the tenant, the realm's own M2M
        token, OR a non-owner/admin whose realm role grants
        `service_accounts:read` (or `service_accounts:manage`, which
        implies read) (ADR-074 §I-06). Reached via the BFF on-behalf
        pattern (platform bot + the user's verified `X-User-Token`; the
        bare `X-On-Behalf-Of-User` id was removed 2026-07-27).
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceAccount' }
    post:
      tags: [Service Accounts]
      summary: Provision a service account (owner/admin)
      description: |
        Creates a `kind=service` account (ADR-071 §2): active from birth,
        no invite expiry (reaper-exempt), a single membership, a
        caller-chosen role that is neither `owner` nor `platform_api`, and
        an email-shaped login handle that is verified-at-creation and
        unique-in-tenant (`409 handle_taken` on collision). The owner then
        mints the first `view_bff` login OTP via `POST /auth/otp/issue`
        (`purpose=login`). Owner/admin, or a realm role granting
        `service_accounts:manage` (ADR-074 §I-06); the lifecycle
        endpoints below share this write gate.
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAccountCreateRequest' }
      responses:
        '201':
          description: |
            Created — the ServiceAccount DTO only. **No OTP is returned
            here**: the show-once `view_bff` login OTP is minted by a
            separate `POST /auth/otp/issue` (`purpose=login`) call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '400':
          description: |
            bad_json | invalid_handle (handle must be email-shaped,
            containing `@`) | invalid_role (role may not be `owner` or
            `platform_api`) | unknown_role / role_disabled (role not in
            the realm catalog / disabled).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: handle_taken — login handle already in use in this tenant

  /tenants/{id}/service-accounts/{said}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: said
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Service Accounts]
      summary: Get one service account (owner/admin or service_accounts:read)
      description: |
        Caller must be owner/admin of the tenant, the realm's own M2M
        token, OR a non-owner/admin whose realm role grants
        `service_accounts:read` (or `service_accounts:manage`, which
        implies read) (ADR-074 §I-06).
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '404':
          description: service_account_not_found (also covers a wrong-tenant or non-service target — no oracle)

  /tenants/{id}/service-accounts/{said}/reset-handle:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: said
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Service Accounts]
      summary: Change the login handle (owner/admin)
      description: |
        Recovery path when a platform picked a handle colliding with a real
        user's needs (ADR-071 §10). Inserts the new handle first (`409` on
        collision) then releases the prior one, so the account is never
        without a resolvable handle.
      security: [{ BearerAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAccountResetHandleRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '400':
          description: bad_json | invalid_handle (must be email-shaped, containing `@`)
        '404':
          description: service_account_not_found (also covers a wrong-tenant or non-service target — no oracle)
        '409':
          description: handle_taken — login handle already in use in this tenant

  /tenants/{id}/service-accounts/{said}/suspend:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: said
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Service Accounts]
      summary: Suspend a service account (owner/admin)
      description: Blocks new logins and revokes live sessions (ADR-071 §10).
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '404':
          description: service_account_not_found (also covers a wrong-tenant or non-service target — no oracle)

  /tenants/{id}/service-accounts/{said}/unsuspend:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: said
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Service Accounts]
      summary: Unsuspend a service account (owner/admin)
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '404':
          description: service_account_not_found (also covers a wrong-tenant or non-service target — no oracle)

  /tenants/{id}/service-accounts/{said}/revoke:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: said
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Service Accounts]
      summary: Revoke live sessions (rotate ≡ revoke, owner/admin)
      description: |
        Revokes the account's active sessions/refresh tokens without
        deactivating (ADR-071 §10). The next agent run re-onboards via a
        fresh OTP.
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  revoked_sessions: { type: integer }
        '404':
          description: service_account_not_found

  /tenants/{id}/service-accounts/{said}/deactivate:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: said
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Service Accounts]
      summary: Deactivate a service account (soft delete, owner/admin)
      description: |
        Soft delete (`status=deactivated`, ADR-071 §10): revokes live
        sessions and releases the handle slot. Preserves the audit trail;
        there is no hard user delete.
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '404':
          description: service_account_not_found (also covers a wrong-tenant or non-service target — no oracle)

  # ------------------------------------------------ Contact Drift Review (v0.11.0)

  /tenants/{id}/contact-drift-reviews:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Contact Drift]
      summary: >-
        List pending contact-drift reviews (ADR-042 P2). Tenant-wide by
        default; ?user_id= narrows to one user. A drift review is raised
        when a returning IdP login asserts a contact value different from
        the one stored — login proceeds, the mismatch is queued for owner
        review.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: query
          name: user_id
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK

  /tenants/{id}/contact-drift-reviews/{reviewId}/accept:
    post:
      tags: [Contact Drift]
      summary: >-
        Accept a drift review — trust the IdP. The drifted contact is
        soft-released and a new verified contact carrying the asserted
        value takes its slot; the users.contacts snapshot is rebuilt.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: reviewId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
        '409':
          description: review already resolved / identifier collision

  /tenants/{id}/contact-drift-reviews/{reviewId}/reject:
    post:
      tags: [Contact Drift]
      summary: >-
        Reject a drift review (ADR-080 Part 3). SOFT by default: dismiss the
        IdP-asserted change, keep the account and its original binding intact,
        and notify the original address that a login-identity change was
        declined (no teardown). An optional body {"hard": true} escalates to a
        HARD reject that parks the account by severing its provider binding —
        a deliberate "this looks like a takeover" action; the account row is
        left active-but-unmapped, not deactivated or re-invited.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: reviewId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hard: { type: boolean, default: false }
      responses:
        '200':
          description: "OK — status=rejected, mode=soft|hard"

  /tenants/{id}/users/{uid}/contacts/{contactId}/delink:
    post:
      tags: [Contact Drift]
      summary: >-
        Delink a contact's provider binding (ADR-080 Part 2). Revokes every
        active contact_verifications row bound to the contact, leaving the
        user_contacts row itself ACTIVE but unmapped, so a new provider
        identity can bind on the next verified login (subject to the Phase A
        verified-email gate). This is the explicit owner action that unblocks
        a `contact_admin_required` login — a different provider claiming an
        address already bound to another identity — without ever silently
        transferring the binding. Owner/admin only (users:manage). Idempotent.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: contactId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: "OK — status=delinked, contact_id, revoked_bindings"
        '404':
          description: user or contact not found (or contact not owned by user)

  /tenants/{id}/users/{uid}/hand-back:
    post:
      tags: [Contact Drift]
      summary: >-
        Hand back an account (ADR-080 Part 3). Reactivate the OLD account (uid)
        and move the mistakenly-created NEW account's current email identity
        onto it, then disable the new account — the explicit, audited recovery
        for a drift/rebind that created a separate account. Ordering: release
        the new account's email first (freeing the (tenant,email) slot),
        reactivate + re-point the old account, disable the new one. The user's
        next verified login rebinds the same provider UID to the old account.
        Owner/admin only (users:manage).
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_user_id]
              properties:
                from_user_id: { type: string, format: uuid }
      responses:
        '200':
          description: "OK — status=handed_back, user_id, email"
        '400':
          description: from_user_id missing / same user / source account has no email
        '404':
          description: target or source user not found

  # ----------------------------------------- First-login step-up gate (v0.11.0)

  /tenants/{id}/contact-verifications:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Contact Verifications]
      summary: >-
        List pending first-login step-up verifications (ADR-042 P2). A
        pending row is created when a login resolves to a user_contact
        whose slot was vacated within the last 30 days
        (slot_recycled_until); the IdP proof is held until a tenant owner
        approves. Login itself returns 412 first_login_pending_approval
        until then.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: query
          name: state
          schema: { type: string, enum: [pending], default: pending }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK

  /tenants/{id}/contact-verifications/{cvId}/approve:
    post:
      tags: [Contact Verifications]
      summary: >-
        Approve a pending step-up — flip the verification to active,
        verify the parent contact, rebuild the user.contacts snapshot.
        After approval the partner re-logs in and resolves via step 1.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: cvId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
        '409':
          description: verification already resolved / active slot taken

  /tenants/{id}/contact-verifications/{cvId}/reject:
    post:
      tags: [Contact Verifications]
      summary: Reject a pending step-up (terminal). The contact stays unverified.
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: cvId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK

  # ---------------------------------------------------------------- MFA Admin

  /tenants/{tenantId}/users/{uid}/mfa/enroll:
    post:
      tags: [MFA Admin]
      summary: Admin-initiated TOTP enrollment — returns QR/secret
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK

  /tenants/{tenantId}/users/{uid}/mfa/confirm:
    post:
      tags: [MFA Admin]
      summary: Confirm TOTP code and activate enrollment
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK

  /tenants/{tenantId}/users/{uid}/mfa:
    delete:
      tags: [MFA Admin]
      summary: Reset a user's MFA (also clears mfacache for (user, tenant))
      description: |
        Admin/parent MFA reset. Authz is `users:manage` (same-tenant) **or the
        direct parent** (ADR-077 §4 tier-2 break-glass, G-014 gate — never a
        grandparent; a reset never grants login). Emails the affected user for
        tamper-evidence (ADR-079), labelled by who reset it (self / admin /
        parent).
      security: [{ BearerAccess: [] }]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK

  # ---- ADR-047 §3: GET /me ----
  /me:
    get:
      tags: [Auth]
      summary: Caller identity, staff flag, owned platforms, and memberships
      description: |
        Authenticated by the user's access JWT (BearerAccess).
        `is_realm_staff` is a per-request derivation (not a JWT claim) so
        staff demotion takes effect on the next /me call.
        `owned_platforms_count` counts admin tenants the caller owns.
        `memberships` lists the caller's tenants (matched via shared
        email) **scoped to the session's own realm** — tenants that live
        in other realms are excluded, since they are not switchable from
        this session (a switch re-pins within the session realm and a
        foreign-realm tenant fails MintForTenant with not_a_member).

        `permissions` (ADR-090) is the caller's FULLY RESOLVED effective
        permission set for that membership — the role's stored grant, or
        the whole catalog when the caller owns the tenant, intersected
        with the token's ADR-084 `permissions_cap` when one is present.
        There is no implicit-all marker to expand client-side: a console
        decides an affordance with a plain membership test and no policy
        logic of its own. Empty for a disabled or unresolvable role.

        Two readings to keep straight. (1) For every membership OTHER than
        the session's current tenant the set is PROSPECTIVE — "what you
        would hold after switching here" — because a session acts only in
        the tenant it is pinned to. (2) The realm-surface permissions
        (`federation:*`, `sources:*`, `domains:*`, `identity_providers:*`,
        `platform:config`, …) are additionally gated on sitting in the
        realm's admin tenant, so pair them with `is_admin_tenant`; a role
        may grant them on an org membership where they are unreachable.
      security: [{ BearerAccess: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user_id, name, email, is_realm_staff, owned_platforms_count, memberships]
                properties:
                  user_id: { type: string, format: uuid }
                  name: { type: string }
                  email: { type: string, format: email }
                  is_realm_staff: { type: boolean }
                  owned_platforms_count: { type: integer }
                  memberships:
                    type: array
                    items:
                      type: object
                      required: [tenant_id, platform_id, display_name, role, is_owner, is_admin_tenant, permissions]
                      properties:
                        tenant_id: { type: string, format: uuid }
                        platform_id: { type: string, format: uuid }
                        display_name: { type: string }
                        role: { type: string }
                        owner_user_id:
                          type: string
                          format: uuid
                          description: >-
                            The tenant's ADR-076 ownership pointer. Omitted when
                            un-pointed.
                        is_owner:
                          type: boolean
                          description: >-
                            Resolved owner-ness of the CALLER for this membership.
                            Never a JWT claim. Means ownership only — never use it
                            as a permission proxy; read `permissions` for that.
                        is_admin_tenant:
                          type: boolean
                          description: >-
                            This tenant is the admin tenant of the realm that
                            governs it, i.e. the realm-surface gates are reachable
                            from it at all (ADR-090).
                        permissions:
                          type: array
                          description: >-
                            Effective ADR-074 permissions for this membership,
                            cap-intersected. See the endpoint description.
                          items: { type: string }
                        pending_first_signin:
                          type: boolean
                          description: >-
                            ADR-093 D6 — this membership was found by
                            CORRELATION (a verified email) but never CLAIMED:
                            the row carries no approved provider tuple, so
                            `POST /auth/token` for this tenant answers
                            `not_a_member`. It is a real invitation or bulk
                            import that its holder has not signed into yet.
                            Render it as pending, not as somewhere to go —
                            hiding it would make an invitation invisible to
                            its recipient. Absent means false.
                        invitation_pending:
                          type: boolean
                          description: >-
                            ADR-095 D5 — this membership is still an OFFER
                            awaiting the caller's answer (`users.status =
                            'invited'`), so `POST /me/invitations/{tenantId}/accept`
                            and its `/reject` sibling will act on it. Orthogonal
                            to `pending_first_signin`, which answers whether the
                            membership can be ENTERED: a bulk import and a
                            just-accepted invitation are both unclaimed with no
                            decision outstanding, and offering accept/decline on
                            either answers `not_invited` / `not_pending`. Absent
                            means false.
        '401':
          description: unauthorized
        '404':
          description: user_not_found

  # ---- ADR-049 §A.7: domain CRUD ----

  /me/invitations/{tenantId}/accept:
    post:
      tags: [Auth]
      summary: Accept an invitation to a tenant (ADR-095 D5)
      description: |
        Authenticated by the caller's own **realm** session (BearerAccess),
        not a session in the target tenant — someone accepting an invitation
        has no session there yet. The target membership is proven to be the
        caller's by the same correlation the `/reject` sibling uses.

        The invitation moves to `status='accepted'` with a `responded_at` and
        the membership row becomes `active`.

        Needed because a realm on `invitation_acceptance: explicit`
        (ADR-095 D2) no longer activates an invitation implicitly at login, so
        a decline path with no matching accept path would leave the invitee
        able to say no and unable to say yes. On a realm using the default
        `auto` mode this endpoint still works — it simply settles a row that
        the invitee's next sign-in would have settled anyway.

        The lifecycle row is written BEFORE the membership is activated. That
        is the concurrency control: `Respond` is the only operation that can
        lose a race against a simultaneous reject or an inviter's revoke, so
        activating the membership first would let a rejected invitation still
        grant access.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string, format: uuid }
                  status: { type: string, enum: [accepted] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No such membership for this caller. Deliberately does not
            distinguish "no such tenant" from "not your tenant" — the
            difference would make this an existence oracle for tenant ids.
        '409':
          description: |
            `not_invited` — the membership is not a pending invitation (an
            already-active member has nothing to accept), or `not_pending` —
            the invitation was already answered, revoked or expired.
        '501':
          description: '`invitations_unavailable` — invitation lifecycle store not configured.'
      security:
        - BearerAccess: []
  /me/invitations/{tenantId}/reject:
    post:
      tags: [Auth]
      summary: Decline an invitation to a tenant (ADR-092 D5)
      description: |
        Authenticated by the caller's own **realm** session (BearerAccess),
        not a session in the target tenant — someone declining an invitation
        has no session there and never will. The target membership is proven
        to be the caller's by the same verified-email correlation `/me` uses
        (ADR-093 D3); an unverified address cannot claim a membership.

        Records the outcome rather than deleting it: the invitation moves to
        `status='rejected'` with a `responded_at`, and the membership row it
        would have created is ended. Because the live-invite unique index is
        partial (`WHERE status='pending'`), the rejected row does not occupy
        the slot and the tenant MAY invite the same person again later; the
        rejection survives as history beside the new offer.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Invitation declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string, format: uuid }
                  status: { type: string, enum: [rejected] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No such membership for this caller. Deliberately does not
            distinguish "no such tenant" from "not your tenant" — the
            difference would make this an existence oracle for tenant ids.
        '409':
          description: |
            `not_invited` — the membership is not a pending invitation (an
            active member wanting out uses the leave endpoint instead), or
            `not_pending` — the invitation was already answered, revoked or
            expired.
        '501':
          description: '`invitations_unavailable` — invitation lifecycle store not configured.'
      security:
        - BearerAccess: []
  /me/memberships/{tenantId}/leave:
    post:
      tags: [Auth]
      summary: Leave a tenant you are a member of (ADR-092 D5)
      description: |
        Authenticated by the caller's own **realm** session (BearerAccess).
        This is the recovery path out of a suspended membership, which is why
        it cannot require a session in the tenant being left: that would make
        the recovery require the very access it is recovering from.

        Reuses ADR-076's `leave_entirely` disposition — the membership is
        deactivated — rather than introducing a third verb for the same idea.
        Live sessions for that membership are revoked, otherwise the caller
        would keep working there on an already-minted token until it expired
        and leaving would be cosmetic for up to a TTL.

        The tenant's OWNER is refused. `tenants.owner_user_id` is NOT NULL
        (ADR-073 Amendment C), so an owner leaving would strand the tenant and
        the database would reject it; ownership must be transferred first.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Membership ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string, format: uuid }
                  status: { type: string, enum: [left] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such membership for this caller. }
        '409':
          description: |
            `owner_cannot_leave` — transfer ownership (ADR-076) before
            leaving, or `already_left` — the membership is already ended.
      security:
        - BearerAccess: []
  /me/tenant-choice:
    post:
      tags: [Auth]
      summary: Settle the single-tenant picker (ADR-092 D5)
      description: |
        Answers the picker raised by `tenant_choice_required` on the login
        response: keep the named membership, give up the others in that realm.

        The unchosen memberships are **suspended, not deleted** (ADR-087's
        precedent). A login-time picker is a fast decision made under mild
        pressure and should not be the most destructive operation in the
        product; `POST /me/memberships/{tenantId}/leave` remains the deliberate
        way out, and an admin can restore a suspended member.

        Their sessions are **revoked**. Otherwise the person keeps working in an
        organization they just gave up, on an already-minted access token, until
        it expires — the change would be cosmetic for up to a token TTL.

        An **owned** organization cannot be given up: `tenants.owner_user_id` is
        NOT NULL, so revoking the owner's membership would leave it ownerless.
        Ownership must be transferred (ADR-076) first. The refusal is checked
        BEFORE anything is mutated, so a rejected choice never leaves the caller
        partially reconciled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                  description: The membership to KEEP.
      responses:
        '200':
          description: Choice applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string, format: uuid }
                  status: { type: string, enum: [chosen] }
                  released:
                    type: integer
                    description: How many memberships were suspended.
        '400': { description: '`tenant_required` — tenant_id is required.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such membership for this caller. }
        '409':
          description: |
            `owner_cannot_be_revoked` — the caller owns another organization in
            this realm and must transfer it first; or
            `single_tenant_not_required` — this realm does not require
            single-tenant membership, so there is nothing to settle.
      security:
        - BearerAccess: []
  # ---- ADR-094: per-org domain SSO grants -------------------------------
  # Distinct from /platforms/{pid}/tenants/{tid}/domains above, which is ADR-049
  # ROUTING (`domain_mappings`: who is served at this hostname). These paths
  # answer a different question — which org may a verified address at this
  # domain be auto-provisioned into — and read a different table
  # (`tenant_domains`). Before ADR-094 the login resolver read the routing
  # table, so a domain bound for routing silently conferred SSO.
  #
  # AUTHORIZATION (ADR-094 D11): the tenant-scoped operations below accept the
  # ORGANIZATION's own owner/admin (`domains:manage` resolved in the tenant)
  # OR the PLATFORM's. The platform-scoped approval queue accepts the platform
  # only. A BFF acting for a signed-in human forwards the user's verified access
  # JWT as `X-User-Token`; the bot credential itself never needs the permission.
  /platforms/{pid}/tenants/{tid}/sso-domains:
    parameters:
      - in: path
        name: pid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: tid
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Platform Admin]
      summary: List an organization's SSO domain grants
      security: [{ BearerPlatformToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SSODomainGrant' }
                  next_cursor: { type: string, nullable: true }
        '401': { description: unauthorized }
        '403': { description: forbidden }
        '404': { description: tenant_not_found }
    post:
      tags: [Platform Admin]
      summary: Claim a domain for organization SSO
      description: |
        Creates the grant record. There is no NULL-evidence path (D5): an
        unproven claim is a ROW carrying a status and a method, so an audit can
        always say who asserted what, when, and under which standard.

        `method` defaults to `dns_txt`. Which methods are permitted is decided
        by the platform's `domain_sso.evidence` — proof is accepted at every
        level, attestation only where the platform allows it
        (`400 method_not_enabled` otherwise).

        For a proof method the response carries the DNS record / file the caller
        must publish, and the grant sits in `claimed` until
        `POST .../{domain}/verify` succeeds. `self_asserted` activates
        immediately; `platform_approval` lands in `pending` for the platform
        owner.

        Freemail and public-suffix domains are refused with
        `400 domain_not_eligible` on EVERY evidence level — a grant on
        `gmail.com` or on `co.uk` would auto-provision a large fraction of the
        internet into one org.
      security: [{ BearerPlatformToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, example: acme.com }
                method:
                  type: string
                  enum: [dns_txt, html_file, meta_tag, platform_approval, self_asserted]
                  default: dns_txt
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  grant: { $ref: '#/components/schemas/SSODomainGrant' }
                  instructions:
                    type: object
                    description: |
                      Present only for a proof method — the DNS record or file
                      the caller must publish before verifying.
        '400': { description: domain_not_eligible | method_not_enabled | invalid_method }
        '401': { description: unauthorized }
        '403': { description: forbidden }
        '404': { description: tenant_not_found }
        '409': { description: grant_exists | domain_owned_elsewhere | dns_proof_supersedes }
        '429': { description: too_many_pending_claims | domain_request_cooldown }

  /platforms/{pid}/tenants/{tid}/sso-domains/{domain}/verify:
    parameters:
      - in: path
        name: pid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: tid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: domain
        required: true
        schema: { type: string }
    post:
      tags: [Platform Admin]
      summary: Run the proof check for an SSO domain grant
      description: |
        Performs the real DNS / file / meta check — the issuer carries no
        verification bypass, by design.

        On success the grant goes `active` and `verified_at` is written. That
        write is where D8 applies: if another org in this platform already holds
        the domain PROVEN, a partial unique index rejects it and the caller gets
        `409 domain_owned_elsewhere`. The refusal comes from the constraint, not
        from a pre-check, so two orgs verifying concurrently cannot both win.

        Incumbency is not permanent — a proven grant is re-checked every 24h and
        goes `failed` after 7 consecutive days of failure, at which point it
        leaves the index and a challenger can verify.

        A FAILED check is not an error: the response returns `verified: false`
        with the grant unchanged apart from `last_checked_at`.
      security: [{ BearerPlatformToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  grant: { $ref: '#/components/schemas/SSODomainGrant' }
                  verified: { type: boolean }
        '400': { description: not_a_proof_method | method_not_enabled }
        '401': { description: unauthorized }
        '403': { description: forbidden }
        '404': { description: tenant_not_found | grant_not_found }
        '409': { description: domain_owned_elsewhere }

  /platforms/{pid}/tenants/{tid}/sso-domains/{domain}/request:
    parameters:
      - in: path
        name: pid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: tid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: domain
        required: true
        schema: { type: string }
    post:
      tags: [Platform Admin]
      summary: Ask the platform owner to attest an SSO domain
      description: |
        Flow 2 of ADR-094 D11 — for an org that cannot publish DNS. Distinct
        from a claim because it is a different act: a claim says "I will prove
        this", a request says "I cannot prove this, please vouch for me".

        Available only where `domain_sso.evidence` permits `platform_approval`
        (`400 method_not_enabled` otherwise), and refused with
        `409 dns_proof_supersedes` when another org has actually PROVEN the
        domain — proof outranks attestation, so the grant would be suspended by
        the D9 ladder the moment it ran.
      security: [{ BearerPlatformToken: [] }]
      responses:
        '200':
          description: OK — grant is pending platform approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSODomainGrant' }
        '400': { description: domain_not_eligible | method_not_enabled }
        '401': { description: unauthorized }
        '403': { description: forbidden }
        '404': { description: tenant_not_found }
        '409': { description: dns_proof_supersedes | domain_owned_elsewhere }
        '429': { description: too_many_pending_claims | domain_request_cooldown }

  /platforms/{pid}/tenants/{tid}/sso-domains/{domain}:
    parameters:
      - in: path
        name: pid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: tid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: domain
        required: true
        schema: { type: string }
    delete:
      tags: [Platform Admin]
      summary: Revoke an SSO domain grant
      description: |
        Open to BOTH principals: an org may give up its own grant, and the
        platform owner may take one away.

        The row is marked `revoked`, which frees the grant slot so the domain
        can be claimed again later — after a 7-day cooldown. That is longer than
        the 24h cooldown after a rejection, because a revoke ends a grant that
        was previously good, which is the stronger signal.

        `verified_at` is deliberately left in place: it records that proof once
        happened, which remains true. `status` is what stops the row
        provisioning or holding the domain.
      security: [{ BearerPlatformToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSODomainGrant' }
        '401': { description: unauthorized }
        '403': { description: forbidden }
        '404': { description: tenant_not_found | grant_not_found }

  /platforms/{pid}/sso-domains:
    parameters:
      - in: path
        name: pid
        required: true
        schema: { type: string, format: uuid }
      - in: query
        name: status
        required: false
        schema: { type: string }
        description: |
          Comma-separated status filter, e.g. `pending` for the approval queue.
          Omitted returns every grant in the platform.
    get:
      tags: [Platform Admin]
      summary: List every SSO domain grant in a platform (approval queue)
      description: |
        Platform-scoped, so platform-gated: an org owner has no business
        enumerating every other org's domains (ADR-067, the same reasoning that
        keeps rosters org-private).
      security: [{ BearerPlatformToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SSODomainGrant' }
                  next_cursor: { type: string, nullable: true }
        '400': { description: invalid_status }
        '401': { description: unauthorized }
        '403': { description: forbidden }

  /platforms/{pid}/sso-domains/{id}/approve:
    parameters:
      - in: path
        name: pid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platform Admin]
      summary: Approve a pending SSO domain request
      description: |
        Platform-only, and not by convention alone: an org approving its own
        request would make the request flow a no-op with extra steps.

        The grant becomes `active` with `method=platform_approval`.
        `verified_at` stays NULL — an approval is an ATTESTATION, not proof, and
        a schema CHECK refuses any other reading. Eligibility and the platform's
        evidence level are re-checked at approval, because approval is the act
        that makes the grant live and either may have changed since the request.

        A grant from another platform answers `404`, not `403`: distinguishing
        the two would make this route an existence oracle for other platforms'
        grant ids.
      security: [{ BearerPlatformToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSODomainGrant' }
        '400': { description: domain_not_eligible | method_not_enabled }
        '401': { description: unauthorized }
        '403': { description: forbidden }
        '404': { description: grant_not_found }
        '409': { description: dns_proof_supersedes | domain_owned_elsewhere }

  /platforms/{pid}/sso-domains/{id}/reject:
    parameters:
      - in: path
        name: pid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platform Admin]
      summary: Reject a pending SSO domain request
      description: |
        Sets the grant to `rejected` and starts a 24h cooldown, during which the
        same org cannot re-request the domain (`429 domain_request_cooldown`).
        A rejection is often quickly remediable — fix the DNS record, talk to
        the platform owner — so the cooldown is friction against a retry loop,
        not a penalty.
      security: [{ BearerPlatformToken: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSODomainGrant' }
        '401': { description: unauthorized }
        '403': { description: forbidden }
        '404': { description: grant_not_found }

  /platforms/{pid}/tenants/{tid}/domains:
    parameters:
      - in: path
        name: pid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: tid
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Platform Admin]
      summary: List custom domains bound to a tenant
      security: [{ BearerPlatformToken: [] }]
      responses:
        '200': { description: OK }
        '401': { description: unauthorized | wrong_scope }
        '403': { description: realm_mismatch }
        '404': { description: tenant_not_found }
    post:
      tags: [Platform Admin]
      summary: Claim a domain for a tenant (initiates domain_verifications)
      description: |
        Owner-scoped: the verification row belongs to the tenant
        (`owner_type='tenant'`, `owner_id=tid`), not to the calling
        admin user. Any platform admin can complete a claim another
        admin started, and the row survives the original claimer's
        user being removed.

        `method` selects the verification path. `dns_txt` (default) and
        `html_file` are accepted; `meta_tag` is not exposed. Realm-
        origin claims do not accept this field — only DNS TXT is
        permitted there.

        Single-pending invariant: at most one pending row per
        `(tenant, domain)`. A re-claim with the same method returns
        the existing pending token (idempotent). A re-claim with a
        different method supersedes the prior pending row.
      security: [{ BearerPlatformToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                method:
                  type: string
                  enum: [dns_txt, html_file]
                  default: dns_txt
      responses:
        '200':
          description: OK — pending verification
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      domain: { type: string }
                      status: { type: string, enum: [pending] }
                      method: { type: string, enum: [dns_txt] }
                      dns_record_name: { type: string }
                      dns_record_value: { type: string }
                  - type: object
                    properties:
                      domain: { type: string }
                      status: { type: string, enum: [pending] }
                      method: { type: string, enum: [html_file] }
                      file_path:
                        type: string
                        example: /.well-known/realmid-verification.txt
                      file_content: { type: string }
        '400': { description: missing_domain | unsupported_method }
        '409': { description: domain_taken | already_bound }

  /platforms/{pid}/tenants/{tid}/domains/{domain}/verify:
    parameters:
      - in: path
        name: pid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: tid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: domain
        required: true
        schema: { type: string }
    post:
      tags: [Platform Admin]
      summary: Verify the pending claim and bind the domain to the tenant
      description: |
        **Domain-contest surface (ADR-063 §4).** When the challenger
        proves control but the domain is already held by an incumbent
        mapping, the bind does not 409 — a **contest** is opened instead
        and the 200 body is
        `{status:"contest_open", contest_id, closes_at}` (7-day overlap
        window; the incumbent's config never moves — only the domain
        attachment is at stake, resolved by the contest worker). A
        second verify while a contest is already open returns
        `409 contest_open`. A plain conflict with no contest path
        returns `409 domain_taken`.
      security: [{ BearerPlatformToken: [] }]
      responses:
        '200':
          description: OK — verified + bound, pending if DNS not yet live, or contest opened
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status: { type: string, enum: [verified, pending] }
                      id: { type: string, format: uuid }
                  - type: object
                    description: ADR-063 §4 contest opened (see description).
                    required: [status, contest_id, closes_at]
                    properties:
                      status: { type: string, enum: [contest_open] }
                      contest_id: { type: string, format: uuid }
                      closes_at: { type: string, format: date-time }
        '400': { description: verification_failed }
        '404': { description: domain_not_found | tenant_not_found }
        '409': { description: domain_taken | contest_open (a contest is already open for this domain) }

  /platforms/{pid}/tenants/{tid}/domains/{domain}:
    parameters:
      - in: path
        name: pid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: tid
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: domain
        required: true
        schema: { type: string }
    delete:
      tags: [Platform Admin]
      summary: Detach a tenant custom domain (revokes tenant sessions)
      security: [{ BearerPlatformToken: [] }]
      responses:
        '200': { description: OK }
        '404': { description: tenant_not_found | domain_not_found }

  /platforms/{id}/origins:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Platform Admin]
      summary: List realm SPA origins
      security: [{ BearerPlatformToken: [] }]
      responses:
        '200': { description: OK }
        '404': { description: realm_not_found }
    post:
      tags: [Platform Admin]
      summary: Bind a SPA origin to the realm
      description: |
        ADR-049 §3: when the requested origin is a subdomain of any
        verified apex bound to this realm, the row is inserted
        trusted-by-parent (sharing the apex's verification_id and
        carrying `trusted_by_parent: true` in the audit payload).
        Otherwise the realm must hold a verified
        `domain_verifications` row for the domain (issued by
        `POST /platforms/{id}/origins/claim` + `/origins/verify`).

        The DV lookup is owner-scoped to the realm, so any admin in
        this realm can have completed the claim/verify pair.

        **Domain-contest surface (ADR-063 §4, I-09).** When the realm has
        proven its OWN DNS control (a verified `domain_verifications` row —
        not a trusted-by-parent borrow) of a domain a **different realm**
        still holds, the bind does **not** 409 — a **contest** is opened
        and the 201 body is `{status:"contest_open", contest_id, closes_at}`
        (7-day overlap; the incumbent keeps routing and is emailed; only the
        domain attachment is at stake). The contest worker transfers ONLY if
        the incumbent's TXT proof is gone AND the challenger's still resolves
        at close; a trusted-by-parent incumbent is rechecked at its parent
        apex. Guards: a second bind while a contest is open → `409
        contest_open`; a domain that just survived a contest is under an
        anti-harassment lock → `409 contest_cooldown`; a conflict with no
        challenger proof (trusted-by-parent, same realm, or a tenant
        incumbent) stays `409 domain_taken`.
      security: [{ BearerPlatformToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
      responses:
        '201':
          description: |
            Created — bound. When a cross-realm contest is opened instead
            (ADR-063 §4), the body is `{status:"contest_open", contest_id,
            closes_at}` rather than the bound-mapping shape.
        '409': { description: domain_taken | contest_open | contest_cooldown }
        '412': { description: domain_not_verified }

  /platforms/{id}/origins/claim:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platform Admin]
      summary: Claim a domain to bind as a realm SPA origin
      description: |
        Owner-scoped: the DV row is `owner_type='realm'`, `owner_id=id`.
        Replaces the legacy user-scoped `POST /domains/claim` for
        post-bootstrap origin adds.

        DNS TXT only — `method=html_file` is rejected with
        `400 unsupported_method`. The `dns_txt` method is the only
        one that proves zone control, which is required at the
        platform-trust level (see ADR-049 §"Method options").

        Single-pending invariant: at most one pending row per
        `(realm, domain)`. Re-claiming returns the existing pending
        token (idempotent).
      security: [{ BearerPlatformToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                method:
                  type: string
                  enum: [dns_txt]
                  default: dns_txt
      responses:
        '200':
          description: OK — pending DNS verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string }
                  status: { type: string, enum: [pending] }
                  method: { type: string, enum: [dns_txt] }
                  dns_record_name: { type: string }
                  dns_record_value: { type: string }
        '400': { description: missing_domain | unsupported_method }
        '404': { description: realm_not_found }

  /platforms/{id}/origins/verify:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platform Admin]
      summary: Verify the realm's pending claim (does NOT bind)
      description: |
        Drives the DNS check on the realm-owned pending DV row.
        Persists the resulting status. The bind step is the separate
        `POST /platforms/{id}/origins` call, which lets a verified
        apex serve as the trust anchor for many subdomains
        (trusted-by-parent shortcut).
      security: [{ BearerPlatformToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
      responses:
        '200': { description: OK — verified or pending }
        '400': { description: verification_failed }
        '404': { description: domain_not_found | realm_not_found }

  /platforms/{id}/origins/{originId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: originId
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Platform Admin]
      summary: Detach a realm SPA origin (revokes realm sessions)
      description: |
        ADR-049 §4.1 last-origin guard: returns 409 `last_origin` when
        the row is the only live realm-bound origin.
      security: [{ BearerPlatformToken: [] }]
      responses:
        '200': { description: OK }
        '404': { description: origin_not_found }
        '409': { description: last_origin }

  /domains/resolve:
    get:
      tags: [Auth]
      summary: Resolve a domain within your own realm
      description: |
        ADR-049 §A.7.3, **amended 2026-08-02 (spec 0.19.0)**. Single index
        hit on `domain_mappings`. Returns `{ entity_type, entity_id,
        realm_id }`, joined through `tenants` for `entity_type='tenant'`.

        **BREAKING:** this endpoint used to be unauthenticated. It now
        requires a platform token and answers **only for that token's own
        realm** — it was otherwise a customer-enumeration oracle (probe a
        domain list, learn who the platform's customers are and the UUIDs
        their admin paths key on).

        A domain bound to a *different* realm returns the **same `404
        not_found`** as a domain nobody has bound. The two cases are
        deliberately indistinguishable; a distinct `403` would still
        confirm the domain is live.

        The surviving use is the post-claim "did my DNS land?" check,
        where the caller holds their own realm's token. There is no
        cross-realm lookup.
      security: [{ BearerPlatformToken: [] }]
      parameters:
        - in: query
          name: domain
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [entity_type, entity_id, realm_id]
                properties:
                  entity_type: { type: string, enum: [realm, tenant] }
                  entity_id: { type: string, format: uuid }
                  realm_id: { type: string, format: uuid }
        '400': { description: missing_domain }
        '401': { description: missing or invalid platform bearer }
        '404': { description: not_found — unbound, OR bound in another realm }

  # ---- Internal ops console (UI v2 G3) -----------------------------------
  # Base-realm staff only. See the "Internal ops" tag description.

  /admin/platforms:
    get:
      tags: [Internal ops]
      summary: List all partner platforms with rolled-up counts (ADR-048 §1)
      description: |
        Filterable fleet list for the RealmID internal-ops console + the
        customer-mode realm cards. Counts (`tenants_count`, `users_count`)
        and `last_activity_at` are rolled up server-side. The base realm
        is omitted. Customers see only platforms they own (filter by
        `owner_user_id=me`); base-realm staff see every platform.
      security:
        - BearerAccess: []
        - BearerService: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Free-text match on display_name, slug, or bound domain.
        - in: query
          name: status
          schema: { type: string, enum: [active, suspended, deactivated] }
          description: Repeatable; comma-separated also accepted.
        - in: query
          name: signup_mode
          schema: { type: string, enum: [closed, allowlist, open] }
        - in: query
          name: domain
          schema: { type: string }
          description: Exact custom-domain match via domain_mappings.
        - in: query
          name: owner_user_id
          schema: { type: string }
        - in: query
          name: has_custom_domain
          schema: { type: boolean }
        - in: query
          name: created_after
          schema: { type: integer, format: int64 }
        - in: query
          name: created_before
          schema: { type: integer, format: int64 }
        - in: query
          name: last_activity_after
          schema: { type: integer, format: int64 }
        - in: query
          name: last_activity_before
          schema: { type: integer, format: int64 }
        - in: query
          name: sort
          schema:
            type: string
            enum:
              [created_at, -created_at, last_activity_at, -last_activity_at,
               display_name, -display_name, tenants_count, -tenants_count,
               users_count, -users_count]
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlatformsResponse'
        '403': { description: not base-realm staff }

  /admin/stats:
    get:
      tags: [Internal ops]
      summary: Four-tile dashboard summary (ADR-048 §2)
      description: |
        Cached in-process for 30 seconds. `sessions_active` is a
        cross-realm count (`COUNT(*) FROM sessions WHERE expires_at > now()`).
        `events_24h` is the 24-hour audit-log count.
      security:
        - BearerAccess: []
        - BearerService: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
        '403': { description: not base-realm staff }

  /admin/events:
    get:
      tags: [Internal ops]
      summary: Paged audit/activity feed across all platforms (ADR-048 §3)
      description: |
        The same shape backs the customer-mode activity feed; the UI scopes
        the request to `platform_id IN (caller's owned platforms)` before
        sending. `kind` is repeatable + comma-separated; the taxonomy lives
        in `internal/audit/kinds.go`.
      security:
        - BearerAccess: []
        - BearerService: []
      parameters:
        - in: query
          name: platform_id
          schema: { type: string, format: uuid }
        - in: query
          name: tenant_id
          schema: { type: string, format: uuid }
        - in: query
          name: actor_id
          schema: { type: string, format: uuid }
        - in: query
          name: kind
          schema: { type: string }
        - in: query
          name: since
          schema: { type: integer, format: int64 }
        - in: query
          name: until
          schema: { type: integer, format: int64 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventsResponse'
        '403': { description: not base-realm staff }

  /platforms/{id}/audit-events:
    get:
      tags: [Realms]
      summary: Partner-facing audit-event feed (ADR-055)
      description: |
        Paged cursor feed over the platform's slice of `audit_log`. Same row
        shape as `/admin/events`, but scoped (and forced) to `{id}` — a
        caller cannot read another platform's events even by passing a
        `platform_id` query parameter (it is ignored).

        Auth: either a platform admin user JWT, or a platform-scoped
        service JWT minted from a platform API key (`/auth/token` with an
        API-key bearer). Compliance ingest jobs typically use the API-key
        path.

        Retention: 400 days. Pull at least once per quarter to maintain a
        complete archive.
      security:
        - BearerAccess: []
        - BearerService: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: tenant_id
          schema: { type: string, format: uuid }
        - in: query
          name: actor_id
          schema: { type: string, format: uuid }
        - in: query
          name: kind
          description: Repeatable; matches any of the supplied kinds.
          schema: { type: string }
        - in: query
          name: since
          schema: { type: integer, format: int64 }
        - in: query
          name: until
          schema: { type: integer, format: int64 }
        - in: query
          name: cursor
          description: Opaque cursor returned by the previous page.
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventsResponse'
        '401': { description: missing or invalid bearer }
        '403': { description: not a platform admin / realm mismatch }

  /admin/search:
    get:
      tags: [Internal ops]
      summary: Cmd-K typeahead across platforms and tenants (ADR-048 §4)
      description: |
        Prefix matches rank above substring matches; per-type cap so
        neither type crowds the other. Users are deliberately excluded
        from the typeahead surface (kept out of the user-PII path).
      security:
        - BearerAccess: []
        - BearerService: []
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 25, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSearchResponse'
        '403': { description: not base-realm staff }

  /admin/platforms/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Internal ops]
      summary: Read one platform's fleet row (ADR-048 §1)
      description: |
        The singular counterpart to `GET /admin/platforms`, returning the
        identical `AdminPlatformSummary` row for one platform. It resolves
        through the same store query and the same serializer as the list, so
        the detail screen and the fleet table cannot disagree about a platform.

        The base realm is omitted, exactly as it is from the list.
      security:
        - BearerAccess: []
        - BearerService: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlatformSummary' }
        '401':
          description: unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { description: not base-realm staff }
        '404':
          description: platform_not_found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/platforms/{id}/notes:
    get:
      tags: [Internal ops]
      summary: List internal platform notes (newest first)
      description: |
        Append-only ledger of free-text notes scoped to a platform realm.
        Visible only to base-realm staff (decision #15). Pagination is
        cursor-opaque; the wire envelope intentionally uses `notes` rather
        than `items` to make the surface unambiguous when grepped from the
        UI. There is no edit/delete in v1 — corrections are entered as
        follow-up notes.
      security:
        - BearerAccess: []
        - BearerService: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [notes, next_cursor]
                properties:
                  notes:
                    type: array
                    items:
                      type: object
                      required: [id, platform_id, author_user_id, body, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        platform_id: { type: string, format: uuid }
                        author_user_id: { type: string, format: uuid }
                        body: { type: string }
                        created_at: { type: integer, format: int64 }
                  next_cursor:
                    type: string
                    nullable: true
        '403': { description: not base-realm staff }
        '404': { description: platform_not_found }
    post:
      tags: [Internal ops]
      summary: Append a new internal platform note
      description: |
        Whitespace-only bodies are rejected with 400 empty_body. Each
        successful insert writes an audit_log entry with action
        `platform.note.create`.
      security:
        - BearerAccess: []
        - BearerService: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, platform_id, author_user_id, body, created_at]
                properties:
                  id: { type: string, format: uuid }
                  platform_id: { type: string, format: uuid }
                  author_user_id: { type: string, format: uuid }
                  body: { type: string }
                  created_at: { type: integer, format: int64 }
        '400': { description: empty_body }
        '403': { description: not base-realm staff }
        '404': { description: platform_not_found }

  /admin/platforms/{id}/signing-keys/rotate:
    post:
      tags: [Internal ops]
      summary: Force an immediate signing-key rotation
      description: |
        Reuses the per-realm key-rotation worker logic
        (`internal/worker/keyrotate.Rotator.RotateNow`) to append a fresh
        key to the realm's keyring out-of-band. Existing keys remain in
        JWKS until their RetireAt fires; `retired_kids` lists the kids
        that were on the keyring before the rotation. Rate-limited to 1
        rotation per 60s window per platform — exceeding the cap returns
        429 rate_limited. Audited as `platform.signing_keys.rotate`.
      security:
        - BearerAccess: []
        - BearerService: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [kid, retired_kids]
                properties:
                  kid: { type: string }
                  retired_kids:
                    type: array
                    items: { type: string }
        '403': { description: not base-realm staff }
        '404': { description: platform_not_found }
        '429': { description: rate_limited }

  /admin/platforms/{id}/suspend:
    post:
      tags: [Internal ops]
      summary: Suspend a platform realm
      description: |
        Flips `realms.status` to `suspended` and records the optional
        reason. Idempotent — re-suspending an already-suspended platform
        returns the current state without re-emitting an audit row.
        Audited as `platform.suspend`.
      security:
        - BearerAccess: []
        - BearerService: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuspendPlatformResponse'
        '403': { description: not base-realm staff }
        '404': { description: platform_not_found }

  /admin/platforms/{id}/unsuspend:
    post:
      tags: [Internal ops]
      summary: Reactivate a suspended platform realm
      description: |
        Flips `realms.status` back to `active` and clears `suspended_at`
        + `reason`. Idempotent on already-active realms. Audited as
        `platform.unsuspend`.
      security:
        - BearerAccess: []
        - BearerService: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuspendPlatformResponse'
        '403': { description: not base-realm staff }
        '404': { description: platform_not_found }
